:root{
  color-scheme: only light;
  --cream:#FBF4E7;--milk:#FFFDF7;--foam:#F4E6CF;
  --matcha:#A8342A;--matcha-deep:#7E2118;--matcha-pale:#F0DBD2;
  --latte:#452A1D;--latte-soft:#7A5541;
  --berry:#A9764F;--berry-pale:#EEDFCD;--caramel:#E39B23;--caramel-pale:#FBEBCB;
  --bad:#8A2018;--bad-pale:#F7E1DB;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:'SeedDeck','LINE Seed TW_TTF','LINE Seed TW','Microsoft JhengHei','PingFang TC',sans-serif;
 color:var(--latte);min-height:100vh;padding:20px 14px 80px;font-size:17px;line-height:1.6;
 background:radial-gradient(90% 45% at 6% 102%,var(--matcha-pale),rgba(220,231,201,0) 60%),
  radial-gradient(80% 40% at 98% 98%,var(--berry-pale),rgba(239,221,230,0) 60%),
  linear-gradient(180deg,var(--milk),var(--cream) 50%,var(--foam))}
.wrap{max-width:760px;margin:0 auto}
header{display:flex;align-items:center;gap:12px;margin-bottom:14px}
header img{height:44px}
h1{font-size:24px;font-weight:800;letter-spacing:1px}
header .sub{font-size:13px;color:var(--latte-soft);margin-top:2px}
.card{background:var(--milk);border:4px solid var(--matcha-pale);border-radius:22px;padding:16px}
label{display:block;font-size:14px;font-weight:700;color:var(--latte-soft);margin:10px 0 4px}
select,input,textarea{width:100%;font:inherit;font-size:16px;color:var(--latte);background:#fff;
 border:2px solid #E9DCC6;border-radius:12px;padding:9px 11px;outline:none}
select:focus,input:focus,textarea:focus{border-color:var(--matcha)}
textarea{min-height:74px;resize:vertical}
.row{display:flex;gap:10px}
.row .c1{flex:1.4}.row .c2{flex:1}
button.go{width:100%;margin-top:12px;background:var(--matcha);color:#fff;border:0;border-radius:99px;
 padding:13px;font:inherit;font-size:17px;font-weight:700;cursor:pointer}
button.go:disabled{background:#E0D4C1;color:#9A9284}
.hint{font-size:13px;color:var(--latte-soft);margin-top:8px;line-height:1.55}
.carry{margin-top:22px;background:var(--milk);border:4px dashed var(--caramel);border-radius:22px;padding:16px}
.carry .ch{font-size:19px;font-weight:800;color:#A56A12}
.carry .ct{font-size:14.5px;color:var(--latte-soft);line-height:1.6;margin:6px 0 4px}
#cmsg{font-size:14px;margin-top:8px;color:var(--latte-soft)}
#cmsg.no{color:var(--bad);font-weight:700}
.maps{display:inline-block;font-size:12.5px;font-weight:700;color:#A56A12;background:var(--caramel-pale);
 border-radius:99px;padding:3px 12px;margin:-2px 0 6px}
.topics{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:12px}
.topics .tp{font-size:14.5px;padding:8px 15px;border-radius:99px;border:2px solid #E0D8C2;
 background:var(--milk);color:var(--latte);cursor:pointer;font-weight:700}
.topics .tp.on{background:var(--berry);border-color:var(--berry);color:#fff}
.bar{display:flex;align-items:center;gap:10px;margin:20px 2px 10px;flex-wrap:wrap}
.bar h2{font-size:19px;font-weight:800;flex:1}
.bar .up{font-size:12.5px;color:var(--latte-soft)}
.idea{background:var(--milk);border:3px solid #E9DCC6;border-radius:18px;padding:12px 14px;
 margin-bottom:10px;display:flex;gap:12px;align-items:flex-start}
.idea.top{border-color:var(--caramel);background:#FFFBF0}
.idea .rank{flex:0 0 auto;width:30px;height:30px;border-radius:50%;background:#F3E4CC;color:#A56A12;
 font-size:14px;font-weight:800;display:flex;align-items:center;justify-content:center;margin-top:2px}
.idea.top .rank{background:var(--caramel);color:#fff}
.idea .body{flex:1;min-width:0}
.idea .who{font-size:12.5px;color:var(--latte-soft)}
.idea .txt{font-size:17px;line-height:1.55;margin-top:2px;word-break:break-word}
.vote{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;gap:2px;
 background:#fff;border:2px solid var(--matcha-pale);border-radius:14px;padding:6px 10px;cursor:pointer}
.vote b{font-size:18px;color:var(--matcha-deep)}
.vote span{font-size:11px;color:var(--latte-soft)}
.vote.voted{background:var(--matcha);border-color:var(--matcha)}
.vote.voted b,.vote.voted span{color:#fff}
#msg{font-size:14.5px;margin-top:10px}
#msg.no{color:var(--bad);font-weight:700}
.empty{text-align:center;color:var(--latte-soft);font-size:15px;padding:24px 10px}
footer{text-align:center;font-size:12px;color:var(--latte-soft);opacity:.75;margin-top:22px;line-height:1.7}
@media (prefers-color-scheme: dark){
  html,body{background-color:#FBF4E7 !important;color:#452A1D !important}
  input,textarea,select,button{background-color:#fff !important;color:#452A1D !important;
   -webkit-text-fill-color:#452A1D !important}
  ::placeholder{color:#B0A28C !important;-webkit-text-fill-color:#B0A28C !important}
}
</style>
</head>

    const ifr=document.createElement('iframe'); ifr.name='hft'; ifr.style.display='none';
    document.body.appendChild(ifr);
    f=document.createElement('form'); f.id='hf'; f.method='POST'; f.action=SCRIPT_URL;
    f.target='hft'; f.style.display='none'; f.innerHTML='<input name="payload">';
    document.body.appendChild(f);
  }
  f.querySelector('input').value=JSON.stringify(payload);
  f.submit();
  setTimeout(done, 1300);
}
function msg(k,t){ const m=$('msg'); m.className=k||''; m.textContent=t||''; }

function load(){
  jsonp('action=ideas&topic='+encodeURIComponent(TOPIC)+(CUR?'&cls='+encodeURIComponent(CUR):''), d=>{
    if(!d||!d.ok) return;
    if($('cls').options.length<2 && d.classes){
      $('cls').innerHTML='<option value="">請選班級</option>'+
        d.classes.map(c=>`<option>${c}</option>`).join('');
      const saved=localStorage.getItem(KEY+'cls');
      if(saved){ $('cls').value=saved; CUR=saved; }
      $('cls').onchange=()=>{ CUR=$('cls').value;
        try{localStorage.setItem(KEY+'cls',CUR)}catch(e){}
        setQ(); load(); };
      setQ();
    }
    render(d);
  });
}
function render(d){
  $('up').textContent='共 '+d.list.length+' 則　｜　更新於 '+d.updated;
  if(!d.list.length){ $('list').innerHTML='<div class="empty">這個主題還沒有人貼，當第一個吧。</div>'; return; }
  $('list').innerHTML=d.list.map((x,i)=>{
    const voted=localStorage.getItem(KEY+'v'+x.id)?'voted':'';
    return `<div class="idea ${i===0&&x.votes>0?'top':''}">
      <div class="rank">${i+1}</div>
      <div class="body">
        <div class="who">${x.cls||''} ${x.no?x.no+' 號':''}　${x.time}</div>
        <div class="txt">${esc(x.text)}</div>
      </div>
      <div class="vote ${voted}" onclick="vote('${x.id}',this)">
        <b>${x.votes}</b><span>讚</span>
      </div></div>`;
  }).join('');
}
function esc(t){ return String(t).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }

function post(){
  const cls=$('cls').value, no=$('no').value.trim(), text=$('text').value.trim();
  if(!cls){ msg('no','先選班級。'); return; }
  if(!text){ msg('no','寫一句話再貼。'); return; }
  try{ localStorage.setItem(KEY+'cls',cls); localStorage.setItem(KEY+'no',no); }catch(e){}
  $('send').disabled=true; $('send').textContent='送出中…'; msg('','');
  send({action:'idea',cls:cls,topic:TOPIC,no:no,text:text}, ()=>{
    $('text').value=''; $('send').disabled=false; $('send').textContent='貼到牆上';
    msg('','貼好了，往下看看大家寫什麼。'); CUR=cls; load();
  });
}
function vote(id, el){
  const k=KEY+'v'+id;
  const had=localStorage.getItem(k);
  try{ had?localStorage.removeItem(k):localStorage.setItem(k,'1'); }catch(e){}
  const b=el.querySelector('b');
  b.textContent=Math.max(0, Number(b.textContent)+(had?-1:1));
  el.classList.toggle('voted', !had);
  send({action:'vote',id:id,minus:!!had}, ()=>{});
}

function buildTopics(){
  const h=$('topics'); h.innerHTML='';
  TOPICS.forEach(t=>{
    const b=document.createElement('button');
    b.type='button'; b.className='tp'+(t[0]===TOPIC?' on':''); b.textContent=t[0];
    b.onclick=()=>{ TOPIC=t[0];
      [...h.children].forEach(x=>x.classList.remove('on')); b.classList.add('on');
      try{localStorage.setItem(KEY+'topic',TOPIC)}catch(e){}
      setQ(); load(); };
    h.appendChild(b);
  });
}
function setQ(){
  const t=TOPICS.find(x=>x[0]===TOPIC)||TOPICS[0];
  $('qlabel').textContent=t[2];
  $('maps').textContent=t[1];
  $('title').textContent=(CUR?CUR+'　':'')+TOPIC;
}
const savedTopic=localStorage.getItem(KEY+'topic');
if(savedTopic && TOPICS.some(x=>x[0]===savedTopic)) TOPIC=savedTopic;
buildTopics(); setQ();
function carry(){
  if(!CUR){ cmsg('no','先選班級。'); return; }
  cmsg('','正在把第一名撈出來…');
  jsonp('action=ideas&cls='+encodeURIComponent(CUR), d=>{
    if(!d||!d.ok){ cmsg('no','讀不到資料，請重試。'); return; }
    const top={};
    d.list.forEach(x=>{
      const t=String(x.topic||'');
      if(!top[t] || x.votes>top[t].votes) top[t]=x;
    });
    const pick=i=>{ const t=TOPICS[i]&&TOPICS[i][0]; return (t&&top[t])?top[t].text:''; };
    const insight=pick(0), items=pick(1), name=pick(2), priceRaw=pick(3), desc=pick(4);
    const price=(priceRaw.match(/\d+/)||[''])[0];
    if(!insight && !items && !name){ cmsg('no','還沒有人貼，或票數都是 0。先討論再帶入。'); return; }
    const q=new URLSearchParams();
    q.set('cls',CUR);
    if(name) q.set('name',name);
    if(insight) q.set('insight',insight);
    if(items) q.set('items',items);
    if(price) q.set('price',price);
    if(desc) q.set('desc',desc);
    cmsg('','帶好了，正在開啟報名表…');
    window.open(FORM_URL+'?'+q.toString(),'_blank');
  });
}
function cmsg(k,t){ const m=$('cmsg'); m.className=k||''; m.textContent=t||''; }

const savedNo=localStorage.getItem(KEY+'no'); if(savedNo) $('no').value=savedNo;
load();
TIMER=setInterval(load, 20000);
</script>
</body>
</html>
