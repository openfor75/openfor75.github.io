:root{--cream:#FAF5E9;--milk:#FFFCF5;--foam:#F3EAD6;--matcha:#7E9B60;--matcha-deep:#4E6B3B;
 --matcha-pale:#DCE7C9;--latte:#4A3B22;--latte-soft:#6E5A3A;--berry:#C089A3;--berry-pale:#EFDDE6;
 --caramel:#C9A24A;--caramel-pale:#F3E5C4;}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'SeedDeck','LINE Seed TW_TTF','LINE Seed TW','Microsoft JhengHei','PingFang TC',sans-serif;
 color:var(--latte);min-height:100vh;padding:34px 18px 60px;
 background:radial-gradient(90% 45% at 6% 102%,var(--matcha-pale),rgba(220,231,201,0) 60%),
  radial-gradient(80% 40% at 98% 98%,var(--berry-pale),rgba(239,221,230,0) 60%),
  linear-gradient(180deg,var(--milk),var(--cream) 50%,var(--foam))}
.wrap{max-width:640px;margin:0 auto}
header{text-align:center;margin-bottom:26px}
header img{height:58px;margin-bottom:10px}
h1{font-size:30px;font-weight:800;letter-spacing:1px;line-height:1.35}
header p{font-size:15px;color:var(--latte-soft);margin-top:8px}
a.card{display:flex;gap:16px;align-items:center;text-decoration:none;color:inherit;
 background:var(--milk);border:4px solid var(--matcha-pale);border-radius:22px;
 padding:18px 20px;margin-bottom:14px}
a.card:active{transform:translateY(1px)}
a.card .em{font-size:38px;flex:0 0 auto}
a.card b{display:block;font-size:21px;font-weight:700}
a.card span{display:block;font-size:15px;color:var(--latte-soft);margin-top:3px;line-height:1.5}
a.card.t{border-color:var(--berry-pale)}
a.card.g{border-color:var(--caramel-pale)}
.tag{display:inline-block;font-size:12.5px;font-weight:700;padding:3px 12px;border-radius:99px;
 background:var(--matcha-pale);color:var(--matcha-deep);margin-bottom:6px}
.tag.t{background:var(--berry-pale);color:#8E5872}
.tag.g{background:var(--caramel-pale);color:#8A6A1E}
footer{text-align:center;font-size:12.5px;color:var(--latte-soft);opacity:.75;margin-top:28px;line-height:1.7}
</style>
