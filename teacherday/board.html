:root{
  --cream:#FAF5E9;--milk:#FFFCF5;--foam:#F3EAD6;
  --matcha:#7E9B60;--matcha-deep:#4E6B3B;--matcha-pale:#DCE7C9;
  --latte:#4A3B22;--latte-soft:#6E5A3A;
  --berry:#C089A3;--berry-pale:#EFDDE6;--caramel:#C9A24A;--caramel-pale:#F3E5C4;
  --bad:#B4574F;--bad-pale:#F6DEDC;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'SeedDeck','LINE Seed TW_TTF','LINE Seed TW','Microsoft JhengHei','PingFang TC',sans-serif;
  color:var(--latte);min-height:100vh;
  background:radial-gradient(90% 50% at 8% 104%,var(--matcha-pale),rgba(220,231,201,0) 60%),
    radial-gradient(80% 45% at 96% 98%,var(--berry-pale),rgba(239,221,230,0) 60%),
    linear-gradient(180deg,var(--milk),var(--cream) 50%,var(--foam));
  padding:28px 30px 40px}
.top{display:flex;align-items:center;gap:20px;flex-wrap:wrap}
.top img{height:56px}
h1{font-size:38px;font-weight:800;letter-spacing:1px}
.sub{font-size:17px;color:var(--latte-soft)}
.spacer{flex:1}
.clock{text-align:right}
.clock .big{font-size:34px;font-weight:800;color:var(--matcha-deep);line-height:1.2}
.clock .lab{font-size:15px;color:var(--latte-soft)}
.clock.hot .big{color:var(--bad)}

.barwrap{margin:22px 0 8px;background:var(--milk);border-radius:99px;height:34px;overflow:hidden;
  border:4px solid var(--matcha-pale)}
#bar{height:100%;width:0;background:linear-gradient(90deg,var(--matcha),var(--caramel));
  transition:width .6s cubic-bezier(.2,.9,.3,1)}
.legend{display:flex;gap:10px 22px;flex-wrap:wrap;font-size:17px;font-weight:700;margin-bottom:20px}
.legend span{display:inline-flex;align-items:center;gap:8px}
.legend i{width:18px;height:18px;border-radius:6px;display:inline-block}
.i-ok{background:var(--matcha)}.i-wait{background:var(--caramel)}
.i-back{background:var(--bad)}.i-none{background:#DDD6C6}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px}
.cell{background:var(--milk);border:5px solid #E6DFCC;border-radius:22px;padding:16px 18px;
  min-height:132px;display:flex;flex-direction:column;justify-content:space-between}
.cell .cls{font-size:30px;font-weight:800;letter-spacing:2px}
.cell .nm{font-size:16px;color:var(--latte-soft);margin-top:2px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cell .tag{align-self:flex-start;margin-top:10px;font-size:16px;font-weight:700;
  padding:5px 16px;border-radius:99px}
.cell .t{font-size:14px;color:var(--latte-soft);opacity:.85;margin-top:6px}
.cell.ok{border-color:var(--matcha)}
.cell.ok .tag{background:var(--matcha);color:#fff}
.cell.wait{border-color:var(--caramel)}
.cell.wait .tag{background:var(--caramel-pale);color:#8A6A1E}
.cell.back{border-color:var(--bad);background:var(--bad-pale)}
.cell.back .tag{background:var(--bad);color:#fff}
.cell.none{opacity:.72}
.cell.none .cls{color:var(--latte-soft)}
.cell.none .tag{background:#E6E0D2;color:#8A806E}

footer{margin-top:26px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px;
  font-size:14px;color:var(--latte-soft);opacity:.8}
#err{background:var(--bad-pale);color:#8E3E38;border-radius:16px;padding:14px 18px;
  font-size:16px;margin-bottom:18px;display:none}
@media (max-width:600px){h1{font-size:28px}.cell .cls{font-size:24px}.clock .big{font-size:26px}}
</style>
</head>

  <span><i class="i-back"></i>需要補件 <b id="n-back">0</b></span>

</footer>

<script>
/* ═══ 主辦單位設定 ═══ */
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbz0Iq57HwxSMIAqYjbukaMaysAdYlWkj2OiZavB-N7xDNPZAhKDfdTbogUi1PUcR3kJLQ/exec";                    // Apps Script 的 /exec 網址
const DEADLINE   = "2026-09-28T17:00";                    // 截止時間，例如 "2026-09-19T16:00"；留空就不顯示倒數
/* ═══════════════════ */

const $=id=>document.getElementById(id);
const S={'通過':'ok','退件':'back','未繳':'none'};

function load(){
  if(!SCRIPT_URL){ err('尚未設定 SCRIPT_URL，請主辦單位打開這個檔案填入 Apps Script 網址。'); return; }
  const cb='cb_'+Date.now();
  window[cb]=d=>{ render(d); delete window[cb]; s.remove(); };
  const s=document.createElement('script');
  s.src=SCRIPT_URL+'?action=board&callback='+cb+'&t='+Date.now();
  s.onerror=()=>{ err('讀不到資料，請確認 Apps Script 已部署且「誰可以存取」設為所有人。'); s.remove(); };
  document.body.appendChild(s);
}
function err(m){ const e=$('err'); e.textContent=m; e.style.display='block'; }

function render(d){
  $('err').style.display='none';
  const c={ok:0,wait:0,back:0,none:0};
  $('grid').innerHTML=d.list.map(x=>{
    const k=S[x.status]||'wait';
    c[k]++;
    const label={ok:'審查通過',back:'需要補件',none:'還沒繳',wait:'已繳待審'}[k];
    return `<div class="cell ${k}">
      <div><div class="cls">${x.cls}</div><div class="nm">${x.name||'&nbsp;'}</div></div>
      <div><div class="tag">${label}</div>${x.time?`<div class="t">${x.time} 繳交</div>`:''}</div>
    </div>`;
  }).join('');
  ['ok','wait','back','none'].forEach(k=>$('n-'+k).textContent=c[k]);
  const done=d.list.length-c.none;
  $('bar').style.width=(d.list.length?done/d.list.length*100:0)+'%';
  $('updated').textContent='已繳 '+done+' / '+d.list.length+' 班　｜　資料更新於 '+d.updated;
}

function tick(){
  if(!DEADLINE){ $('clock').style.display='none'; return; }
  const ms=new Date(DEADLINE)-new Date();
  if(isNaN(ms)){ $('clock').style.display='none'; return; }
  if(ms<=0){ $('left').textContent='已截止'; $('leftlab').textContent='收件結束'; $('clock').classList.add('hot'); return; }
  const d=Math.floor(ms/86400000), h=Math.floor(ms%86400000/3600000), m=Math.floor(ms%3600000/60000);
  $('left').textContent=(d?d+' 天 ':'')+h+' 小時 '+m+' 分';
  $('clock').classList.toggle('hot', ms<86400000);
}
load(); tick();
setInterval(load,60000); setInterval(tick,30000);
</script>
