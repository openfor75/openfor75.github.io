<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>校園3D導覽地圖（示範版）</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { background:#060c1a; color:#e0e8ff; font-family:'Microsoft JhengHei',sans-serif; overflow:hidden; height:100vh; width:100vw; touch-action:none; }
canvas#c { display:block; position:fixed; inset:0; width:100%; height:100%; }
#hd { position:fixed; top:0; left:0; right:0; padding:11px 14px 16px; background:linear-gradient(to bottom,rgba(6,12,26,.95) 60%,transparent); pointer-events:none; z-index:10; }
#hd h1 { font-size:15px; font-weight:700; color:#7dd3fc; letter-spacing:1.5px; }
#hd p  { font-size:10px; color:#475569; margin-top:2px; }
#leg { position:fixed; top:60px; left:10px; background:rgba(10,18,38,.88); border:1px solid rgba(100,180,255,.15); border-radius:10px; padding:8px 12px; z-index:10; pointer-events:none; }
.li { display:flex; align-items:center; gap:7px; font-size:11px; color:#94a3b8; margin-bottom:5px; }
.li:last-child { margin-bottom:0; }
.dot { width:10px; height:10px; border-radius:2px; flex-shrink:0; }
.sub { font-size:9px; color:#475569; }
#bleg { position:fixed; bottom:86px; left:10px; pointer-events:none; z-index:10; }
.brow { display:flex; align-items:center; gap:6px; margin-bottom:4px; }
.bl { width:18px; height:3px; border-radius:2px; }
#hint { position:fixed; bottom:14px; left:50%; transform:translateX(-50%); background:rgba(10,18,38,.8); border:1px solid rgba(100,180,255,.15); border-radius:20px; padding:6px 14px; font-size:10px; color:#475569; pointer-events:none; z-index:10; white-space:nowrap; transition:opacity .4s; }
#panel { position:fixed; bottom:0; left:0; right:0; background:rgba(8,16,34,.97); border-top:1px solid rgba(100,180,255,.2); border-radius:18px 18px 0 0; padding:14px 16px 28px; transform:translateY(110%); transition:transform .35s cubic-bezier(.34,1.56,.64,1); z-index:20; max-height:65vh; overflow-y:auto; }
#panel.on { transform:translateY(0); }
#db { width:36px; height:4px; background:#1e3a5f; border-radius:2px; margin:0 auto 12px; }
#ph { display:flex; align-items:flex-start; justify-content:space-between; margin-bottom:8px; }
#ph h2 { font-size:18px; font-weight:700; color:#7dd3fc; }
#fb { display:inline-flex; margin-top:4px; background:rgba(37,99,235,.2); border:1px solid rgba(37,99,235,.4); border-radius:20px; padding:2px 10px; font-size:11px; color:#93c5fd; font-weight:600; }
#xb { background:rgba(100,180,255,.1); border:none; color:#7dd3fc; width:30px; height:30px; border-radius:50%; cursor:pointer; font-size:14px; flex-shrink:0; }
#pbr { background:rgba(245,158,11,.08); border:1px solid rgba(245,158,11,.25); border-radius:8px; padding:8px 10px; margin-bottom:8px; display:none; }
#pbr h4 { font-size:10px; color:#f59e0b; font-weight:700; margin-bottom:5px; }
.btag { display:inline-block; background:rgba(245,158,11,.15); border:1px solid rgba(245,158,11,.3); border-radius:5px; padding:2px 7px; font-size:11px; color:#fbbf24; margin:2px; }
#pex { margin-top:6px; background:rgba(20,40,80,.4); border-radius:6px; padding:6px 10px; font-size:11px; color:#64748b; border:1px solid rgba(30,58,95,.4); display:none; }

/* Rooms list */
#prooms { margin-top:10px; }
#prooms h4 { font-size:11px; color:#7dd3fc; font-weight:700; margin-bottom:6px; letter-spacing:1px; }
.rgrid { display:grid; grid-template-columns:repeat(2,1fr); gap:5px; }
.rtag { background:rgba(20,40,80,.6); border:1px solid rgba(100,180,255,.2); border-radius:6px; padding:6px 8px; font-size:11px; color:#cbd5e1; }
.rtag .rcode { color:#7dd3fc; font-weight:600; font-size:10px; }
.rtag .rname { display:block; }
.rtag.special { border-color:rgba(245,158,11,.4); background:rgba(245,158,11,.1); color:#fbbf24; }

#fpbtn {
  margin-top:12px; width:100%; padding:10px; border:none;
  background:linear-gradient(135deg,rgba(125,211,252,.18),rgba(96,165,250,.15));
  border:1px solid rgba(125,211,252,.3); color:#7dd3fc;
  border-radius:8px; font-size:13px; font-weight:600; cursor:pointer;
  display:flex; align-items:center; justify-content:center; gap:6px;
}
#fpbtn:active { background:rgba(125,211,252,.25); }

#pst { margin-top:8px; background:rgba(15,23,42,.6); border-radius:6px; padding:8px 10px; font-size:11px; color:#475569; border:1px solid rgba(30,58,95,.5); }

/* Floor Plan Modal */
#fpmodal { position:fixed; inset:0; background:rgba(2,6,15,.92); z-index:100; display:none; align-items:center; justify-content:center; padding:20px; backdrop-filter:blur(8px); }
#fpmodal.on { display:flex; }
#fpcontent { background:linear-gradient(180deg,#0a1428 0%,#080f1f 100%); border:1px solid rgba(100,180,255,.2); border-radius:16px; padding:18px; max-width:96%; max-height:90vh; overflow:auto; position:relative; box-shadow:0 20px 80px rgba(0,0,0,.6); width:600px; }
#fphead { display:flex; align-items:flex-start; justify-content:space-between; margin-bottom:14px; }
#fphead h3 { font-size:16px; color:#7dd3fc; letter-spacing:1px; }
#fphead p { font-size:10px; color:#475569; margin-top:2px; }
#fpclose { background:rgba(125,211,252,.12); border:none; color:#7dd3fc; width:32px; height:32px; border-radius:50%; cursor:pointer; font-size:14px; flex-shrink:0; }
#fpsvg { width:100%; }
#fpsvg svg { width:100%; height:auto; max-height:55vh; }
#fpnote { font-size:10px; color:#64748b; margin-top:8px; text-align:center; }

/* Floor switcher in modal */
#fpswitcher { display:flex; gap:4px; flex-wrap:wrap; margin-bottom:10px; padding-bottom:8px; border-bottom:1px solid rgba(100,180,255,0.1); }
.fp-floor-btn { background:rgba(20,40,80,0.5); border:1px solid rgba(100,180,255,0.2); color:#94a3b8; padding:4px 12px; border-radius:6px; font-size:11px; cursor:pointer; font-family:inherit; }
.fp-floor-btn:hover { background:rgba(20,40,80,0.8); color:#cbd5e1; }
.fp-floor-btn.cur { background:rgba(125,211,252,0.2); border-color:#7dd3fc; color:#7dd3fc; font-weight:700; }
.fp-floor-btn.no-layout { opacity:0.55; }
.fp-floor-btn.no-layout::after { content:'·'; color:#64748b; margin-left:2px; }

/* ===== 環景檢視器 ===== */
.pano-overlay {
  position: fixed; inset: 0;
  background: rgba(0,0,0,0.95);
  z-index: 5000;
  display: none;
  flex-direction: column;
  animation: panoFadeIn 0.3s;
}
.pano-overlay.on { display: flex; }
@keyframes panoFadeIn { from { opacity: 0; } to { opacity: 1; } }
.pano-content {
  position: relative;
  flex: 1;
  width: 100%;
  height: 100%;
}
#pano-canvas {
  width: 100%;
  height: 100%;
  display: block;
  cursor: grab;
  touch-action: none;
}
#pano-canvas:active { cursor: grabbing; }
.pano-close {
  position: absolute;
  top: 14px; right: 14px;
  width: 40px; height: 40px;
  border-radius: 50%;
  background: rgba(0,0,0,0.7);
  -webkit-backdrop-filter: blur(8px);
  backdrop-filter: blur(8px);
  color: white;
  border: none;
  font-size: 22px;
  z-index: 10;
  cursor: pointer;
  font-weight: 300;
}
.pano-header {
  position: absolute;
  top: 14px; left: 14px;
  background: rgba(0,0,0,0.7);
  -webkit-backdrop-filter: blur(8px);
  backdrop-filter: blur(8px);
  padding: 10px 16px;
  border-radius: 12px;
  color: white;
  z-index: 10;
  max-width: calc(100% - 80px);
}
.pano-header h3 { 
  font-size: 15px; 
  font-weight: 600;
  margin-bottom: 2px;
}
.pano-header p { 
  font-size: 11px; 
  opacity: 0.85;
}
.pano-hint {
  position: absolute;
  bottom: 30px;
  left: 50%;
  transform: translateX(-50%);
  background: rgba(0,0,0,0.7);
  -webkit-backdrop-filter: blur(8px);
  backdrop-filter: blur(8px);
  padding: 9px 16px;
  border-radius: 999px;
  color: white;
  font-size: 12px;
  z-index: 10;
  pointer-events: none;
  transition: opacity 0.6s;
  white-space: nowrap;
}
.pano-hint.fade { opacity: 0; }
.pano-loading {
  position: absolute; inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  gap: 12px;
  color: white;
  z-index: 5;
  background: #1f2937;
}
.pano-loading.hidden { display: none; }
.pano-spinner {
  width: 36px; height: 36px;
  border: 3px solid rgba(255,255,255,0.2);
  border-top-color: #fbbf24;
  border-radius: 50%;
  animation: panoSpin 0.9s linear infinite;
}
@keyframes panoSpin { to { transform: rotate(360deg); } }

</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hd">
  <h1>🏫 示範學校 校園3D導覽地圖</h1>
  <p>拖曳旋轉・滾輪縮放・點擊樓層查看資訊</p>
</div>
<div id="leg">
  <div class="li"><div class="dot" style="background:#1d4ed8"></div>誠信樓<span class="sub">6F・L形</span></div>
  <div class="li"><div class="dot" style="background:#15803d"></div>勤學樓<span class="sub">5F</span></div>
  <div class="li"><div class="dot" style="background:#0ea5e9"></div>樸實樓<span class="sub">5F</span></div>
  <div class="li"><div class="dot" style="background:#6b7280"></div>敬業樓<span class="sub">3F</span></div>
</div>
<div id="bleg">
  <div class="brow"><div class="bl" style="background:#f59e0b"></div><span style="color:#78716c;font-size:10px">空橋連通</span></div>
  <div class="brow"><div class="bl" style="background:#06b6d4"></div><span style="color:#64748b;font-size:10px">穿堂</span></div>
</div>
<div id="hint">點擊樓層看資訊・點<b style="color:#fbbf24">黃色光點</b>看虛擬街景</div>
<div id="panel">
  <div id="db"></div>
  <div id="ph">
    <div><h2 id="pn"></h2><div id="fb"><span id="pf"></span></div></div>
    <button id="xb" onclick="closePanel()">✕</button>
  </div>
  <div id="pbr"><h4>🔗 空橋連通</h4><div id="bt"></div></div>
  <div id="pex"></div>
  <div id="prooms"><h4>📍 樓層內容</h4><div class="rgrid" id="rgrid"></div></div>
  <button id="fpbtn" onclick="openFloorPlan()">📐 查看樓層俯視平面圖</button>
  <div id="pst"></div>
</div>

<!-- Floor Plan Modal -->
<div id="fpmodal">
  <div id="fpcontent">
    <div id="fphead">
      <div>
        <h3 id="fptitle"></h3>
        <p id="fpsubtitle"></p>
      </div>
      <button id="fpclose" onclick="closeFloorPlan()">✕</button>
    </div>
    <div id="fpswitcher"></div>
    <div id="fpsvg"></div>
    <div id="fpnote">📌 此為示意圖，教室位置為大略安排，實際請以平面圖為準</div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// ─────────────────────────────────────────
// 虛擬街景產生器（程式即時繪製 360° 環景，非實景照片）
// 原理：每一欄朝一個方向「射一條光線」，算出撞到哪面牆、多遠，
//       再依距離畫出牆的高度與材質（類似早期 3D 遊戲的做法）。
// ─────────────────────────────────────────
var PanoGen = (function () {
  'use strict';
  var TAU = Math.PI * 2;
  function hash(x, y) { var h = (x * 374761393 + y * 668265263) | 0; h = Math.imul(h ^ (h >>> 13), 1274126177); return ((h ^ (h >>> 16)) >>> 0) / 4294967296; }
  function vnoise(x, y, P) {
    var xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi;
    var w = function (i) { return P ? ((i % P) + P) % P : i; };
    var a = hash(w(xi), yi), b = hash(w(xi + 1), yi), c = hash(w(xi), yi + 1), d = hash(w(xi + 1), yi + 1);
    var u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
    return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
  }
  function mix(a, b, t) { return [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t]; }
  function mul(a, k) { return [a[0] * k, a[1] * k, a[2] * k]; }
  function fr(x, p) { return ((x % p) + p) % p; }

  // ── 材質（u：沿牆面公尺，v：離地高度公尺）──
  var TEX = {
    facade: function (u, v, o) { // 校舍：米白磁磚＋窗戶
      var fh = 3.5, fl = Math.floor(v / fh), fv = v - fl * fh, pu = fr(u + (o.off || 0), 3.6);
      var base = o.color || [226, 219, 200];
      if (fv < 0.22) return mul(base, 0.78);
      if (fl === 0 && o.arcade) return (pu < 0.45) ? mul(base, 0.85) : [58, 62, 70];
      if (pu > 0.55 && pu < 3.05 && fv > 0.95 && fv < 2.75) {
        if (Math.abs(pu - 1.8) < 0.04 || fv < 1.0 || fv > 2.7) return [90, 96, 104];
        var r = hash(Math.floor((u + (o.off || 0)) / 3.6), fl + 7);
        var g = mix([120, 150, 175], [190, 210, 225], (fv - 0.95) / 1.8 * 0.6 + r * 0.3);
        return r > 0.85 ? [235, 225, 180] : g;
      }
      var tile = (fr(u, 0.3) < 0.015 || fr(v, 0.3) < 0.015) ? 0.93 : 1;
      return mul(base, tile * (0.97 + hash(Math.floor(u / 0.3), Math.floor(v / 0.3)) * 0.05));
    },
    shop: function (u, v, o) { // 對街店面
      var pal = [[214, 96, 77], [242, 183, 5], [60, 130, 190], [120, 170, 90], [200, 120, 170], [236, 236, 230]];
      var c = pal[(o.seed || 0) % pal.length];
      if (v < 3.0) {
        if (v > 2.4) return mul(c, 0.95);
        var pu = fr(u, 4);
        if (o.shutter) return fr(v, 0.12) < 0.03 ? [150, 150, 150] : [196, 198, 200];
        if (pu < 0.25 || pu > 3.75) return [80, 80, 86];
        return v < 0.4 ? [70, 70, 75] : mix([170, 200, 215], [240, 225, 190], hash(Math.floor(u / 4), o.seed || 0) * 0.7);
      }
      var fv = fr(v - 3, 3.2), pu2 = fr(u, 2.6);
      if (pu2 > 0.5 && pu2 < 2.1 && fv > 0.8 && fv < 2.4) return fr(pu2, 0.8) < 0.04 ? [110, 110, 110] : [130, 160, 180];
      var wall = o.wall || [205, 200, 192];
      return mul(wall, 0.96 + hash(Math.floor(u * 2), Math.floor(v * 2)) * 0.06);
    },
    brick: function (u, v) {
      var row = Math.floor(v / 0.09), off = (row % 2) * 0.12;
      if (fr(v, 0.09) < 0.012 || fr(u + off, 0.24) < 0.012) return [200, 190, 175];
      return mul([168, 74, 52], 0.88 + hash(Math.floor((u + off) / 0.24), row) * 0.2);
    },
    wallTop: function (u, v, o) { return v > o.y1 - 0.12 ? [210, 205, 195] : TEX.brick(u, v); },
    fence: function (u, v) { // 有縫的欄杆：縫隙回傳 null 會透出後面的景
      if (fr(u, 2.0) < 0.08) return [60, 70, 66];
      if (v > 1.45 || v < 0.1) return [70, 82, 76];
      return fr(u, 0.13) < 0.035 ? [80, 95, 88] : null;
    },
    rail: function (u, v) { // 走廊女兒牆
      if (v > 0.98) return [205, 200, 190];
      return mul([232, 228, 218], 0.95 + hash(Math.floor(u * 3), 1) * 0.05);
    },
    office: function (u, v, o) { // 走廊牆：門＋窗
      var pu = fr(u + (o.off || 0), 7.2);
      if (v < 0.15) return [90, 90, 92];
      if (pu > 0.6 && pu < 1.6 && v < 2.15) { // 門
        if (pu < 0.66 || pu > 1.54 || v > 2.09) return [70, 60, 50];
        if (v > 1.25 && v < 1.85 && pu > 0.85 && pu < 1.35) return [170, 195, 205];
        return [150, 108, 70];
      }
      if (pu > 2.4 && pu < 6.6 && v > 1.0 && v < 2.25) { // 窗
        if (fr(pu - 2.4, 1.05) < 0.05 || v < 1.04 || v > 2.21) return [120, 125, 130];
        return mix([150, 180, 195], [210, 225, 230], (v - 1) / 1.25 * 0.7);
      }
      if (v > 2.6) return [244, 242, 236];
      return v < 1.0 ? [196, 214, 200] : [238, 236, 228];
    },
    plain: function (u, v, o) { return mul(o.color || [220, 220, 215], 0.97 + hash(Math.floor(u * 4), Math.floor(v * 4)) * 0.04); },
    concrete: function (u, v) { return mul([168, 168, 162], 0.9 + vnoise(u * 3, v * 3) * 0.18); },
    board: function (u, v, o) { // 公告欄
      if (u < 0.08 || u > o.len - 0.08 || v < o.y0 + 0.08 || v > o.y1 - 0.08) return [120, 80, 50];
      var cx = Math.floor(u / 0.62), cy = Math.floor((v - o.y0) / 0.55), r = hash(cx, cy + 3);
      var lu = fr(u, 0.62), lv = fr(v - o.y0, 0.55);
      if (r > 0.25 && lu > 0.07 && lu < 0.55 && lv > 0.06 && lv < 0.5) {
        var pc = [[255, 255, 250], [255, 236, 150], [190, 225, 250], [255, 205, 210], [200, 240, 200]][Math.floor(r * 5)];
        return (lv > 0.36 && lv < 0.42) || (lv > 0.22 && lv < 0.26 && lu < 0.4) ? mul(pc, 0.7) : pc;
      }
      return mul([196, 150, 100], 0.9 + hash(Math.floor(u * 20), Math.floor(v * 20)) * 0.15);
    },
    bin: function (u, v, o) { // 回收桶
      var c = o.color;
      if (v > o.y1 - 0.12) return mul(c, 0.7);
      if (v < 0.08) return [50, 50, 50];
      return fr(u, 0.55) < 0.03 ? mul(c, 0.85) : c;
    },
    trunk: function (u, v) { return mul([110, 80, 55], 0.85 + hash(Math.floor(u * 10), Math.floor(v * 6)) * 0.25); },
    leaves: function (u, v, o) {
      var n = vnoise(u * 2.2 + (o.seed || 0) * 13, v * 2.2);
      var top = o.y1, dv = v - o.y0, h = top - o.y0;
      if (dv > h * 0.85 && n < 0.22) return null;
      return mix([40, 95, 45], [110, 160, 70], n);
    },
    pole: function () { return [85, 90, 96]; },
    backboard: function (u, v, o) {
      var cu = u - o.len / 2, cv = v - o.y0;
      if (u < 0.05 || u > o.len - 0.05 || cv < 0.05 || cv > (o.y1 - o.y0) - 0.05) return [200, 60, 40];
      if (Math.abs(cu) < 0.3 && cv > 0.12 && cv < 0.58 && (Math.abs(Math.abs(cu) - 0.3) < 0.03 || Math.abs(cv - 0.12) < 0.03 || Math.abs(cv - 0.58) < 0.03)) return [200, 60, 40];
      return [245, 245, 245];
    },
    stage: function (u, v, o) { if (v > o.y1 - 0.15) return [150, 150, 145]; return fr(v, 0.3) < 0.02 ? [120, 120, 118] : [178, 176, 168]; },
    guard: function (u, v) {
      if (v > 2.5) return [60, 90, 140];
      if (v > 1.0 && v < 2.1 && fr(u, 1.4) > 0.2 && fr(u, 1.4) < 1.2) return [160, 190, 205];
      return [236, 232, 220];
    },
    fountain: function (u, v) { return v > 1.0 ? [180, 185, 190] : [205, 210, 214]; }
  };

  // ── 場景描述工具 ──
  function S() { return { segs: [], circs: [], labels: [] }; }
  function seg(s, x1, z1, x2, z2, y0, y1, tex, o) { o = o || {}; o.y0 = y0; o.y1 = y1; o.tex = tex; o.x1 = x1; o.z1 = z1; o.x2 = x2; o.z2 = z2; o.len = Math.hypot(x2 - x1, z2 - z1); s.segs.push(o); return o; }
  function box(s, cx, cz, w, d, y0, y1, tex, o) {
    var x0 = cx - w / 2, x1 = cx + w / 2, z0 = cz - d / 2, z1 = cz + d / 2;
    var mk = function () { var c = {}; for (var k in (o || {})) c[k] = o[k]; return c; };
    seg(s, x0, z0, x1, z0, y0, y1, tex, mk()); seg(s, x1, z0, x1, z1, y0, y1, tex, mk());
    seg(s, x1, z1, x0, z1, y0, y1, tex, mk()); seg(s, x0, z1, x0, z0, y0, y1, tex, mk());
  }

// ── Helpers ──────────────────────────────
function addFlat(w, d, col, x, z, y, op) {
  var mat = new THREE.MeshLambertMaterial({ color: col });
  if (op !== undefined) { mat.transparent = true; mat.opacity = op; }
  var m = new THREE.Mesh(new THREE.PlaneGeometry(w, d), mat);
  m.rotation.x = -Math.PI / 2;
  m.position.set(x, y !== undefined ? y : 0.02, z);
  scene.add(m);
}
function addBox(w, h, d, col, x, y, z, sh, shad) {
  var mat = new THREE.MeshPhongMaterial({ color: col, shininess: sh || 40 });
  var m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
  m.position.set(x, y, z);
  if (shad) { m.castShadow = true; m.receiveShadow = true; }
  scene.add(m);
  return m;
}
function rrect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y); ctx.lineTo(x + w - r, y); ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h - r); ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  ctx.lineTo(x + r, y + h); ctx.quadraticCurveTo(x, y + h, x, y + h - r);
  ctx.lineTo(x, y + r); ctx.quadraticCurveTo(x, y, x + r, y);
  ctx.closePath();
}
function addLabel(text, x, y, z, hex, small) {
  var W = 256, H = small ? 38 : 56;
  var cv = document.createElement('canvas');
  cv.width = W; cv.height = H;
  var ctx = cv.getContext('2d');
  var col = new THREE.Color(hex);
  var r = Math.round(col.r * 255), g = Math.round(col.g * 255), b = Math.round(col.b * 255);
  ctx.fillStyle = 'rgba(' + r + ',' + g + ',' + b + ',.22)';
  rrect(ctx, 3, 3, W - 6, H - 6, 9); ctx.fill();
  ctx.strokeStyle = 'rgba(' + r + ',' + g + ',' + b + ',.65)';
  ctx.lineWidth = 1.5; ctx.stroke();
  ctx.fillStyle = 'rgb(' + r + ',' + g + ',' + b + ')';
  ctx.font = 'bold ' + (small ? 18 : 25) + 'px "Microsoft JhengHei",sans-serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(text, W / 2, H / 2);
  var tex = new THREE.CanvasTexture(cv);
  var m = new THREE.Mesh(
    new THREE.PlaneGeometry(small ? 5 : 8, small ? 0.95 : 1.7),
    new THREE.MeshBasicMaterial({ map: tex, transparent: true, depthWrite: false })
  );
  m.position.set(x, y, z);
  m.userData.isLabel = true;
  scene.add(m);
  labelMeshes.push(m);
}

}

  var cx = b.cx, cz = b.cz, bw = b.w, bd = b.d;
  var startFloor = (b.chuan === 'connector') ? 1 : 0;
  for (var f = startFloor; f < b.floors; f++) {
    var shade = 1 - f * 0.04;
    var col = new THREE.Color(b.color);
    col.multiplyScalar(shade);
    var op = 0.85;
    if (f === 0 && b.chuan === 'partial') op = 0.45;
    var mat = new THREE.MeshPhongMaterial({ color: col, transparent: true, opacity: op, shininess: 50 });
    var geo = new THREE.BoxGeometry(bw, FH - 0.2, bd);
    var mesh = new THREE.Mesh(geo, mat);
    mesh.position.set(cx, f * FH + FH / 2, cz);
    mesh.castShadow = true;
    mesh.receiveShadow = true;
    mesh.userData = { bldg: b, floor: f + 1, isChuan: false };
    scene.add(mesh);
    var edgeMat = new THREE.LineBasicMaterial({ color: new THREE.Color(b.color).multiplyScalar(1.8), transparent: true, opacity: 0.4 });
    var el = new THREE.LineSegments(new THREE.EdgesGeometry(geo), edgeMat);
    el.position.copy(mesh.position);
    scene.add(el);
    origMats.set(mesh.uuid, mat.clone());
    floorMeshes.push(mesh);
  }
  if (b.chuan === 'connector') {
    drawChuanTangArea(cx, cz, bw, bd, b.color);
    var clickGeo = new THREE.BoxGeometry(bw, FH - 0.2, bd);
    var clickMat = new THREE.MeshBasicMaterial({ color: 0x06b6d4, transparent: true, opacity: 0.0 });
    var clickMesh = new THREE.Mesh(clickGeo, clickMat);
    clickMesh.position.set(cx, FH / 2, cz);
    clickMesh.userData = { bldg: b, floor: 1, isChuan: true };
    scene.add(clickMesh);
    origMats.set(clickMesh.uuid, clickMat.clone());
    floorMeshes.push(clickMesh);
  }
  var capCol = new THREE.Color(b.color).multiplyScalar(1.6).getHex();
  addBox(bw + 0.4, 0.5, bd + 0.4, capCol, cx, b.floors * FH + 0.25, cz, 80, true);
  if (b.id === 'SA') addLabel('誠信樓 A棟', cx, b.floors * FH + 2.8, cz, b.color, false);
  else if (b.id === 'SB') addLabel('B棟', cx, b.floors * FH + 1.8, cz, b.color, true);
  else if (b.id !== 'SC') addLabel(b.name, cx, b.floors * FH + 2.8, cz, b.color, false);
}

}

function drawBridge(x1, z1, x2, z2, floor) {
  var y = (floor - 1) * FH + FH * 0.55;
  var dx = x2 - x1, dz = z2 - z1;
  var len = Math.sqrt(dx * dx + dz * dz);
  var ang = Math.atan2(dx, dz);
  var bGeo = new THREE.BoxGeometry(1.6, 0.85, len);
  var bMat = new THREE.MeshPhongMaterial({ color: 0xf59e0b, transparent: true, opacity: 0.88, emissive: 0xf59e0b, emissiveIntensity: 0.22, shininess: 90 });
  var bm = new THREE.Mesh(bGeo, bMat);
  bm.position.set((x1 + x2) / 2, y, (z1 + z2) / 2);
  bm.rotation.y = ang;
  scene.add(bm);
  var gMat = new THREE.MeshBasicMaterial({ color: 0xfbbf24, transparent: true, opacity: 0.12 });
  var gm = new THREE.Mesh(new THREE.BoxGeometry(2.8, 0.22, len), gMat);
  gm.position.copy(bm.position); gm.rotation.y = ang;
  scene.add(gm);
  var eMat = new THREE.LineBasicMaterial({ color: 0xfbbf24, transparent: true, opacity: 0.55 });
  var em = new THREE.LineSegments(new THREE.EdgesGeometry(bGeo), eMat);
  em.position.copy(bm.position); em.rotation.y = ang;
  scene.add(em);
}

var dragging = false, prevX = 0, prevY = 0;
var pinchDist = 0, touchStart = null, mDownPos = null;
canvas.addEventListener('mousedown', function(e) { dragging = true; prevX = e.clientX; prevY = e.clientY; mDownPos = { x: e.clientX, y: e.clientY }; });
window.addEventListener('mousemove', function(e) { if (!dragging) return; theta -= (e.clientX - prevX) * 0.008; phi = clamp(phi + (e.clientY - prevY) * 0.008, 0.1, 1.45); prevX = e.clientX; prevY = e.clientY; applyCamera(); });
window.addEventListener('mouseup', function(e) { if (mDownPos && Math.hypot(e.clientX - mDownPos.x, e.clientY - mDownPos.y) < 5) pick(e.clientX, e.clientY); dragging = false; mDownPos = null; });
canvas.addEventListener('wheel', function(e) { e.preventDefault(); radius = clamp(radius + e.deltaY * 0.08, 18, 200); applyCamera(); }, { passive: false });
canvas.addEventListener('touchstart', function(e) { e.preventDefault(); if (e.touches.length === 1) { dragging = true; prevX = e.touches[0].clientX; prevY = e.touches[0].clientY; touchStart = { x: prevX, y: prevY }; } else if (e.touches.length === 2) { dragging = false; touchStart = null; pinchDist = tDist(e.touches); } }, { passive: false });
canvas.addEventListener('touchmove', function(e) { e.preventDefault(); if (e.touches.length === 1 && dragging) { theta -= (e.touches[0].clientX - prevX) * 0.01; phi = clamp(phi + (e.touches[0].clientY - prevY) * 0.01, 0.1, 1.45); prevX = e.touches[0].clientX; prevY = e.touches[0].clientY; applyCamera(); } else if (e.touches.length === 2) { var d = tDist(e.touches); if (pinchDist > 0) { radius = clamp(radius * (pinchDist / d), 18, 200); applyCamera(); } pinchDist = d; } }, { passive: false });
canvas.addEventListener('touchend', function(e) { if (e.touches.length === 0 && touchStart && e.changedTouches.length === 1) { var cx = e.changedTouches[0].clientX; var cy = e.changedTouches[0].clientY; if (Math.hypot(cx - touchStart.x, cy - touchStart.y) < 12) pick(cx, cy); } dragging = false; touchStart = null; });
function tDist(t) { return Math.hypot(t[0].clientX - t[1].clientX, t[0].clientY - t[1].clientY); }

var panoMarkers = [];
function addPanoMarker(key) {

  var grp = new THREE.Group();

    color: 0xfbbf24, 
    depthTest: false, 
    transparent: true, 
    opacity: 0.95 
  });
  var sphere = new THREE.Mesh(new THREE.SphereGeometry(0.5, 20, 20), sphereMat);
  sphere.renderOrder = 999;
  grp.add(sphere);
  
  // 外圈漣漪
  var ringMat = new THREE.MeshBasicMaterial({ 
    color: 0xfbbf24, 
    transparent: true, 
    opacity: 0.55, 
    side: THREE.DoubleSide,
    depthTest: false
  });
  var ring = new THREE.Mesh(new THREE.RingGeometry(0.7, 1.0, 32), ringMat);
  ring.rotation.x = -Math.PI / 2;
  ring.renderOrder = 998;
  grp.add(ring);
  
  // 上方相機圖示
  var iconMat = new THREE.MeshBasicMaterial({ 
    color: 0xffffff, 
    depthTest: false 
  });
  var iconGeo = new THREE.BoxGeometry(0.3, 0.2, 0.05);
  var icon = new THREE.Mesh(iconGeo, iconMat);
  icon.position.y = 0.85;
  icon.renderOrder = 1000;
  grp.add(icon);
  
  grp.position.set(p.position.x, FH * 1.1, p.position.z);  // 浮在 1F 上方
  grp.userData = { panoKey: key, isPano: true };
  scene.add(grp);
  
  // 標籤

  if (lbl) {

    scene.add(lbl);
    if (typeof labelMeshes !== 'undefined') labelMeshes.push(lbl);
  }
  
  panoMarkers.push(grp);
}

// 給標籤用的 helper（如果原本沒有相容的）
function makeLabelMesh(text, color) {
  var c = document.createElement('canvas');
  c.width = 256; c.height = 64;
  var ctx = c.getContext('2d');
  ctx.fillStyle = 'rgba(0,0,0,0.8)';
  ctx.fillRect(0, 0, 256, 64);
  ctx.fillStyle = '#' + color.toString(16).padStart(6, '0');
  ctx.font = 'bold 26px sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(text, 128, 32);
  
  var tex = new THREE.CanvasTexture(c);
  var mat = new THREE.SpriteMaterial({ map: tex, depthTest: false, transparent: true });
  var sprite = new THREE.Sprite(mat);
  sprite.scale.set(3, 0.75, 1);
  sprite.renderOrder = 1001;
  return sprite;
}

// ─────────────────────────────────────────
// 環景檢視器 (Panorama Viewer)
// ─────────────────────────────────────────
var panoScene, panoCamera, panoRenderer, panoMesh;
var panoLon = 90, panoLat = 0, panoFov = 75;
var panoIsDragging = false;
var panoStartX, panoStartY, panoStartLon, panoStartLat;
var panoActive = false;

function openPano(key) {
  var data = PANORAMAS[key];
  if (!data) return;
  
  document.getElementById('pano-title').textContent = '📍 ' + data.name;
  document.getElementById('pano-loc').textContent = data.location;
  document.getElementById('panomodal').classList.add('on');
  document.getElementById('pano-loading').classList.remove('hidden');
  document.getElementById('pano-hint').classList.remove('fade');
  
  panoActive = true;
  setTimeout(function(){ initPanoViewer(data); }, 50);
}

function panoLoad(data, ok, _p, fail) {
  if (!data.gen) return new THREE.TextureLoader().load(data.image, ok, _p, fail);
  setTimeout(function () {
    try {
      var t = new THREE.CanvasTexture(PanoGen.make(data.gen));
      t.minFilter = THREE.LinearFilter; t.generateMipmaps = false;
      t.wrapS = THREE.RepeatWrapping; t.repeat.x = -1; t.offset.x = 1;
      data.haov = 360; data.vaov = 90;
      ok(t);
    } catch (e) { console.error(e); fail && fail(e); }
  }, 30);
}

function initPanoViewer(data) {
  var canvas = document.getElementById('pano-canvas');
  var W = canvas.clientWidth;
  var H = canvas.clientHeight;
  
  // 重置視角
  panoLon = (data.startLon != null ? data.startLon : 90); panoLat = 0; panoFov = 75;
  
  panoScene = new THREE.Scene();
  panoCamera = new THREE.PerspectiveCamera(panoFov, W / H, 0.1, 1000);
  
  if (!panoRenderer) {
    panoRenderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true });
    panoRenderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  }
  panoRenderer.setSize(W, H, false);
  
  // 載入材質
  var loader = new THREE.TextureLoader();
  panoLoad(data, function(texture) {
    var radius = 500;
    var cylH = 2 * radius * Math.tan((data.vaov / 2) * Math.PI / 180);
    var thetaLen = (data.haov / 360) * Math.PI * 2;
    var thetaStart = -thetaLen / 2 + Math.PI / 2;
    
    var geo = new THREE.CylinderGeometry(
      radius, radius, cylH,
      96, 1, true,
      thetaStart, thetaLen
    );
    
    var mat = new THREE.MeshBasicMaterial({
      map: texture,
      side: THREE.BackSide
    });
    
    panoMesh = new THREE.Mesh(geo, mat);
    panoScene.add(panoMesh);
    
    document.getElementById('pano-loading').classList.add('hidden');
    setTimeout(function(){ 
      document.getElementById('pano-hint').classList.add('fade'); 
    }, 4000);
  }, undefined, function(err) {
    document.getElementById('pano-loading').innerHTML = '<div style="color:#fca5a5">載入失敗</div>';
  });
  
  panoLoop();
}

function panoLoop() {
  if (!panoActive) return;
  requestAnimationFrame(panoLoop);
  
  var phi = (90 - panoLat) * Math.PI / 180;
  var theta = panoLon * Math.PI / 180;
  
  panoCamera.lookAt(
    Math.sin(phi) * Math.cos(theta) * 100,
    Math.cos(phi) * 100,
    Math.sin(phi) * Math.sin(theta) * 100
  );
  
  if (panoRenderer && panoScene && panoCamera) {
    panoRenderer.render(panoScene, panoCamera);
  }
}

function closePano() {
  panoActive = false;
  document.getElementById('panomodal').classList.remove('on');
  if (panoMesh && panoScene) {
    panoScene.remove(panoMesh);
    panoMesh.geometry.dispose();
    panoMesh.material.map && panoMesh.material.map.dispose();
    panoMesh.material.dispose();
    panoMesh = null;
  }
}

// 環景拖曳控制 — 等 DOM 載入完成才綁
function setupPanoControls() {
  var panoCanvasEl = document.getElementById('pano-canvas');
  if (!panoCanvasEl) {
    console.warn('Panorama canvas not found, skipping');
    return;
  }
  
  panoCanvasEl.addEventListener('mousedown', function(e) {
    e.preventDefault();
    panoIsDragging = true;
    panoStartX = e.clientX;
    panoStartY = e.clientY;
    panoStartLon = panoLon;
    panoStartLat = panoLat;
    var hint = document.getElementById('pano-hint');
    if (hint) hint.classList.add('fade');
  });
  window.addEventListener('mousemove', function(e) {
    if (!panoIsDragging || !panoActive) return;
    panoLon = panoStartLon - (e.clientX - panoStartX) * (panoFov / 600);
    panoLat = Math.max(-25, Math.min(25, panoStartLat + (e.clientY - panoStartY) * (panoFov / 600)));
  });
  window.addEventListener('mouseup', function() { panoIsDragging = false; });
  
  panoCanvasEl.addEventListener('touchstart', function(e) {
    e.preventDefault();
    if (e.touches.length === 1) {
      panoIsDragging = true;
      panoStartX = e.touches[0].clientX;
      panoStartY = e.touches[0].clientY;
      panoStartLon = panoLon;
      panoStartLat = panoLat;
      var hint = document.getElementById('pano-hint');
      if (hint) hint.classList.add('fade');
    }
  }, { passive: false });
  panoCanvasEl.addEventListener('touchmove', function(e) {
    e.preventDefault();
    if (e.touches.length === 1 && panoIsDragging) {
      panoLon = panoStartLon - (e.touches[0].clientX - panoStartX) * (panoFov / 600);
      panoLat = Math.max(-25, Math.min(25, panoStartLat + (e.touches[0].clientY - panoStartY) * (panoFov / 600)));
    }
  }, { passive: false });
  panoCanvasEl.addEventListener('touchend', function() { panoIsDragging = false; });
  
  window.addEventListener('resize', function() {
    if (!panoRenderer || !panoActive) return;
    var W = panoCanvasEl.clientWidth;
    var H = panoCanvasEl.clientHeight;
    panoCamera.aspect = W / H;
    panoCamera.updateProjectionMatrix();
    panoRenderer.setSize(W, H, false);
  });
}

// 等 DOM 載入完成才執行
if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', setupPanoControls);
} else {
  setupPanoControls();
}


var ray = new THREE.Raycaster();
var ndc = new THREE.Vector2();
function pick(cx, cy) {
  var rect = canvas.getBoundingClientRect();
  ndc.x =  ((cx - rect.left) / rect.width)  * 2 - 1;
  ndc.y = -((cy - rect.top)  / rect.height) * 2 + 1;
  ray.setFromCamera(ndc, camera);
  
  // 先檢查環景標記
  var panoHits = ray.intersectObjects(panoMarkers, true);
  if (panoHits.length > 0) {
    var grp = panoHits[0].object;
    while (grp.parent && !grp.userData.panoKey) grp = grp.parent;
    if (grp.userData.panoKey) {
      openPano(grp.userData.panoKey);
      return;
    }
  }
  
  var hits = ray.intersectObjects(floorMeshes);
  if (hits.length > 0) selectMesh(hits[0].object);
}
function selectMesh(mesh) {
  if (selectedMesh) selectedMesh.material = origMats.get(selectedMesh.uuid).clone();
  selectedMesh = mesh;
  var b = mesh.userData.bldg;
  var hm = mesh.material.clone();
  hm.color.set(b.hover);
  hm.emissive = new THREE.Color(b.hover);
  hm.emissiveIntensity = 0.4;
  hm.opacity = Math.max(hm.opacity, 0.55);
  hm.transparent = true;
  mesh.material = hm;
  showPanel(mesh.userData);
}

var currentSelection = null;

function getRoomsForBldgFloor(bldgId, floor) {
  if (!ROOMS[bldgId] || !ROOMS[bldgId][floor]) return [];
  return ROOMS[bldgId][floor];
}

function showPanel(ud) {
  var b = ud.bldg, f = ud.floor, ic = ud.isChuan;
  currentSelection = { bldgId: b.id, floor: f, bldg: b, isChuan: ic };

  document.getElementById('pn').textContent = b.name + (b.sub ? ' ' + b.sub : '');
  document.getElementById('pf').textContent = '第 ' + f + ' 樓' + (ic ? ' (穿堂)' : '');

  var pbr = document.getElementById('pbr');
  if (b.bridges) {
    var parts = b.bridges.split('｜');
    var html = '';
    for (var i = 0; i < parts.length; i++) html += '<span class="btag">→ ' + parts[i] + '</span> ';
    document.getElementById('bt').innerHTML = html;
    pbr.style.display = 'block';
  } else pbr.style.display = 'none';

  var pex = document.getElementById('pex');
  if (b.extra) { pex.textContent = b.extra; pex.style.display = 'block'; }
  else pex.style.display = 'none';

  // Rooms grid
  var rooms = getRoomsForBldgFloor(b.id, f);
  var grid = document.getElementById('rgrid');
  if (rooms.length === 0) {
    grid.innerHTML = '<div class="rtag" style="grid-column:span 2;color:#475569;text-align:center">（尚無教室資料）</div>';
  } else {
    var rhtml = '';
    for (var ri = 0; ri < rooms.length; ri++) {
      var r = rooms[ri];
      var isSpecial = r.indexOf('__') === 0;
      var displayText = isSpecial ? r.substring(2) : r;
      // Try to split into name and code
      var matches = displayText.match(/^(.+?)\s+(N?\d+)$/);
      if (matches) {
        rhtml += '<div class="rtag' + (isSpecial ? ' special' : '') + '"><span class="rcode">' + matches[2] + '</span><span class="rname">' + matches[1] + '</span></div>';
      } else {
        rhtml += '<div class="rtag' + (isSpecial ? ' special' : '') + '">' + displayText + '</div>';
      }
    }
    grid.innerHTML = rhtml;
  }

  document.getElementById('pst').innerHTML = '🧹 <strong style="color:#475569">掃區分配</strong>：尚未設定，分配後將顯示負責班級。';
  document.getElementById('panel').classList.add('on');
  document.getElementById('hint').style.opacity = '0';
}

function closePanel() {
  document.getElementById('panel').classList.remove('on');
  document.getElementById('hint').style.opacity = '1';
  if (selectedMesh) {
    selectedMesh.material = origMats.get(selectedMesh.uuid).clone();
    selectedMesh = null;
  }
  currentSelection = null;
}

function escapeXml(s) {
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

// ─────────────────────────────────────────
// Precise Layout Renderer (從格子座標畫圖)
// ─────────────────────────────────────────
function renderLayoutSVG(layout, highlightBldg) {
  // 細長樓（如勤學樓）：使用較寬的格子避免畫面太窄
  var cellH = 32;
  var aspect = layout.rows / layout.cols;
  var cellW = (aspect > 1.5) ? Math.min(150, Math.round(aspect * cellH / 1.5)) : cellH;
  var pad = 24;
  var W = layout.cols * cellW + pad * 2;
  var H = layout.rows * cellH + pad * 2;

  var svg = '<svg viewBox="0 0 ' + W + ' ' + H + '" xmlns="http://www.w3.org/2000/svg">';
  svg += '<rect width="' + W + '" height="' + H + '" fill="#0a1428" />';

  // Faint grid (Excel 風)
  for (var c = 0; c <= layout.cols; c++) {
    var gx = pad + c * cellW;
    svg += '<line x1="' + gx + '" y1="' + pad + '" x2="' + gx + '" y2="' + (H - pad) + '" stroke="#152038" stroke-width="0.5" />';
  }
  for (var r = 0; r <= layout.rows; r++) {
    var gy = pad + r * cellH;
    svg += '<line x1="' + pad + '" y1="' + gy + '" x2="' + (W - pad) + '" y2="' + gy + '" stroke="#152038" stroke-width="0.5" />';
  }

  // Items
  for (var i = 0; i < layout.items.length; i++) {
    var it = layout.items[i];
    var x = pad + (it.col - 1) * cellW;
    var y = pad + (it.row - 1) * cellH;
    var w = it.w * cellW;
    var h = it.h * cellH;

    var fill, stroke, txt, txt2;
    switch (it.type) {
      case 'corridor':
        fill = 'rgba(71,85,105,0.2)'; stroke = '#475569'; txt = '#94a3b8'; break;
      case 'stair':
        fill = 'rgba(245,158,11,0.10)'; stroke = '#a16207'; txt = '#fbbf24'; break;
      case 'elevator':
        fill = 'rgba(168,85,247,0.10)'; stroke = '#a855f7'; txt = '#c084fc'; break;
      case 'wash':
        fill = 'rgba(125,211,252,0.10)'; stroke = '#0891b2'; txt = '#7dd3fc'; break;
      case 'space':
        fill = 'rgba(100,116,139,0.10)'; stroke = '#64748b'; txt = '#cbd5e1'; break;
      case 'special':
        fill = 'rgba(6,182,212,0.18)'; stroke = '#06b6d4'; txt = '#22d3ee'; break;
      case 'building':
        fill = 'rgba(14,165,233,0.10)'; stroke = '#0ea5e9'; txt = '#7dd3fc'; break;
      case 'room':
      default:
        fill = 'rgba(96,165,250,0.13)'; stroke = '#3b82f6'; txt = '#dbeafe'; txt2 = '#7dd3fc'; break;
    }

    svg += '<rect x="' + (x+1) + '" y="' + (y+1) + '" width="' + (w-2) + '" height="' + (h-2) + '" fill="' + fill + '" stroke="' + stroke + '" stroke-width="1.2" rx="2" />';

    var fs = Math.min(13, Math.max(8, Math.floor(Math.min(w, h) / 3.5)));
    var cx = x + w/2, cy = y + h/2;

    if (it.type === 'corridor' && h > w * 1.5) {
      // 直立走廊：文字旋轉
      svg += '<text x="' + cx + '" y="' + cy + '" fill="' + txt + '" font-size="' + fs + '" text-anchor="middle" transform="rotate(-90 ' + cx + ' ' + cy + ')">' + escapeXml(it.name) + '</text>';
    } else if (it.code && h >= cellH * 1.8) {
      svg += '<text x="' + cx + '" y="' + (cy + fs/2 - 2) + '" fill="' + txt + '" font-size="' + fs + '" text-anchor="middle">' + escapeXml(it.name) + '</text>';
      svg += '<text x="' + cx + '" y="' + (cy + fs * 1.5) + '" fill="' + (txt2 || txt) + '" font-size="' + (fs - 1) + '" text-anchor="middle" font-weight="600">' + escapeXml(it.code) + '</text>';
    } else {
      // 緊湊版：名稱 + 編號同一行
      var label = it.name + (it.code ? ' ' + it.code : '');
      svg += '<text x="' + cx + '" y="' + (cy + fs/3) + '" fill="' + txt + '" font-size="' + fs + '" text-anchor="middle">' + escapeXml(label) + '</text>';
    }
  }

  // 北方指示
  svg += '<g transform="translate(' + (W - pad - 22) + ',' + (pad + 22) + ')">';
  svg += '<circle r="18" fill="#0a1428" stroke="#475569" stroke-width="1" />';
  svg += '<path d="M 0,-12 L 4,4 L 0,0 L -4,4 Z" fill="#7dd3fc" />';
  svg += '<text y="-15" fill="#7dd3fc" font-size="9" text-anchor="middle" font-weight="700">N</text>';
  svg += '</g>';

  svg += '</svg>';
  return svg;
}

function genFloorPlanSVG(bldgId, floor) {
  var sel = currentSelection;
  if (!sel) return '';

  // 1) 優先使用精準格子布局（如果有的話）
  var key = getLayoutKey(bldgId, floor);
  if (LAYOUTS[key]) {
    return renderLayoutSVG(LAYOUTS[key]);
  }

  // 2) 否則使用通用產生器（粗略示意）
  var bldg = sel.bldg;
  var rooms = getRoomsForBldgFloor(bldgId, floor);

  // Special handling for 誠信 (combine SA, SB, SC at same floor)
  var isChengxin = (bldgId === 'SA' || bldgId === 'SB' || bldgId === 'SC');

  if (isChengxin) {
    return genChengxinPlan(floor);
  }

  // Generic 2-column floor plan
  var SVG_W = 600, SVG_H = 400;
  var pad = 30;
  var aspect = bldg.d / bldg.w;
  var planW, planH;
  if (aspect > 1.5) {
    planH = SVG_H - 2*pad;
    planW = planH / aspect;
  } else {
    planW = SVG_W - 2*pad;
    planH = planW * aspect;
  }
  var px = (SVG_W - planW)/2;
  var py = (SVG_H - planH)/2;

  var color = '#' + bldg.color.toString(16).padStart(6, '0');
  var lightColor = adjustColor(bldg.color, 1.4);
  var darkColor = adjustColor(bldg.color, 0.4);

  var svg = '<svg viewBox="0 0 ' + SVG_W + ' ' + SVG_H + '" xmlns="http://www.w3.org/2000/svg">';
  // Background
  svg += '<rect width="' + SVG_W + '" height="' + SVG_H + '" fill="#0a1428" />';
  // Building outline
  svg += '<rect x="' + px + '" y="' + py + '" width="' + planW + '" height="' + planH + '" fill="' + darkColor + '" fill-opacity="0.5" stroke="' + color + '" stroke-width="2" rx="4" />';

  // Layout based on building shape
  if (rooms.length > 0) {
    var isVertical = aspect > 1.2;
    if (isVertical) {
      // Long narrow: corridor down middle vertically, rooms in 2 columns
      var corridorW = 30;
      var corridorX = px + planW/2 - corridorW/2;
      svg += '<rect x="' + corridorX + '" y="' + (py+10) + '" width="' + corridorW + '" height="' + (planH-20) + '" fill="#1e293b" fill-opacity="0.5" rx="3" />';
      svg += '<text x="' + (corridorX + corridorW/2) + '" y="' + (py + planH/2) + '" fill="#475569" font-size="9" text-anchor="middle" transform="rotate(-90, ' + (corridorX + corridorW/2) + ', ' + (py + planH/2) + ')">走 廊</text>';

      var roomsPerSide = Math.ceil(rooms.length / 2);
      var roomH = (planH - 20) / roomsPerSide;
      var leftRoomW = (corridorX - px - 5);
      var rightRoomW = (px + planW - corridorX - corridorW - 5);
      for (var i = 0; i < rooms.length; i++) {
        var side = i < roomsPerSide ? 0 : 1;
        var idx = side === 0 ? i : i - roomsPerSide;
        var rx = side === 0 ? (px + 5) : (corridorX + corridorW);
        var ry = py + 10 + idx * roomH;
        var rw = side === 0 ? leftRoomW : rightRoomW;
        var roomData = parseRoom(rooms[i]);
        svg += renderRoom(rx, ry, rw, roomH - 4, roomData, color);
      }
    } else {
      // Wide: corridor horizontal, rooms in 2 rows
      var corridorH = 30;
      var corridorY = py + planH/2 - corridorH/2;
      svg += '<rect x="' + (px+10) + '" y="' + corridorY + '" width="' + (planW-20) + '" height="' + corridorH + '" fill="#1e293b" fill-opacity="0.5" rx="3" />';
      svg += '<text x="' + (px + planW/2) + '" y="' + (corridorY + corridorH/2 + 4) + '" fill="#475569" font-size="9" text-anchor="middle">走  廊</text>';

      var roomsPerSide2 = Math.ceil(rooms.length / 2);
      var roomW = (planW - 20) / roomsPerSide2;
      for (var i2 = 0; i2 < rooms.length; i2++) {
        var side2 = i2 < roomsPerSide2 ? 0 : 1;
        var idx2 = side2 === 0 ? i2 : i2 - roomsPerSide2;
        var rx2 = px + 10 + idx2 * roomW;
        var ry2 = side2 === 0 ? (py + 10) : (corridorY + corridorH);
        var rh2 = (planH - corridorH) / 2 - 12;
        var roomData2 = parseRoom(rooms[i2]);
        svg += renderRoom(rx2, ry2, roomW - 4, rh2, roomData2, color);
      }
    }
  } else {
    // No rooms - show building name only
    svg += '<text x="' + (SVG_W/2) + '" y="' + (SVG_H/2) + '" fill="#475569" font-size="14" text-anchor="middle">（無教室資料）</text>';
  }

  // North arrow
  svg += '<g transform="translate(' + (SVG_W - 50) + ',40)">';
  svg += '<circle r="22" fill="#0a1428" stroke="#475569" stroke-width="1" />';
  svg += '<path d="M 0,-15 L 5,5 L 0,0 L -5,5 Z" fill="#7dd3fc" />';
  svg += '<text y="-18" fill="#7dd3fc" font-size="9" text-anchor="middle" font-weight="700">N</text>';
  svg += '</g>';

  svg += '</svg>';
  return svg;
}

// 誠信 L-shape floor plan (combines A, B, connector)
function genChengxinPlan(floor) {
  var roomsA = ROOMS['SA'][floor] || [];
  var roomsB = ROOMS['SB'][floor] || [];
  var SVG_W = 600, SVG_H = 480;
  var color = '#1d4ed8';
  var dark = '#0a1a3d';

  var svg = '<svg viewBox="0 0 ' + SVG_W + ' ' + SVG_H + '" xmlns="http://www.w3.org/2000/svg">';
  svg += '<rect width="' + SVG_W + '" height="' + SVG_H + '" fill="#0a1428" />';

  // A棟 (top right)
  var ax = 280, ay = 30, aw = 290, ah = 280;
  // B棟 (bottom)
  var bx = 30, by = 320, bw = 540, bh = 130;

  if (floor === 1) {
    // 1F: A棟 and B棟 separate (穿堂 between)
    svg += '<rect x="' + ax + '" y="' + ay + '" width="' + aw + '" height="' + ah + '" fill="' + dark + '" fill-opacity="0.5" stroke="' + color + '" stroke-width="2" rx="4" />';
    svg += '<text x="' + (ax+10) + '" y="' + (ay+18) + '" fill="' + color + '" font-size="11" font-weight="700">A棟</text>';
    svg += '<rect x="' + bx + '" y="' + by + '" width="' + bw + '" height="' + bh + '" fill="' + dark + '" fill-opacity="0.5" stroke="' + color + '" stroke-width="2" rx="4" />';
    svg += '<text x="' + (bx+10) + '" y="' + (by+18) + '" fill="' + color + '" font-size="11" font-weight="700">B棟</text>';
    // 穿堂 (between A and B)
    svg += '<rect x="' + ax + '" y="' + (ay+ah+5) + '" width="' + aw + '" height="' + (by-ay-ah-10) + '" fill="rgba(6,182,212,0.2)" stroke="#06b6d4" stroke-width="1.5" stroke-dasharray="5,3" rx="3" />';
    svg += '<text x="' + (ax+aw/2) + '" y="' + (by-3) + '" fill="#06b6d4" font-size="11" text-anchor="middle" font-weight="700">穿  堂</text>';
  } else {
    // 2F+: connected L-shape
    // A棟 + connector + B棟 as one connected shape
    svg += '<path d="M ' + ax + ' ' + ay + ' L ' + (ax+aw) + ' ' + ay + ' L ' + (ax+aw) + ' ' + (by+bh) + ' L ' + bx + ' ' + (by+bh) + ' L ' + bx + ' ' + by + ' L ' + ax + ' ' + by + ' Z" fill="' + dark + '" fill-opacity="0.5" stroke="' + color + '" stroke-width="2" />';
    svg += '<text x="' + (ax+10) + '" y="' + (ay+18) + '" fill="' + color + '" font-size="11" font-weight="700">A棟</text>';
    svg += '<text x="' + (bx+10) + '" y="' + (by+18) + '" fill="' + color + '" font-size="11" font-weight="700">B棟</text>';
    svg += '<text x="' + (ax+aw/2) + '" y="' + ((ay+ah+by)/2) + '" fill="' + color + '" font-size="9" text-anchor="middle" opacity="0.6">(連接區)</text>';
  }

  // A棟 rooms (vertical layout, 2 cols)
  if (roomsA.length > 0) {
    var corW_A = 25;
    var corX_A = ax + aw/2 - corW_A/2;
    svg += '<rect x="' + corX_A + '" y="' + (ay+25) + '" width="' + corW_A + '" height="' + (ah-30) + '" fill="#1e293b" fill-opacity="0.5" rx="2" />';
    var perSide_A = Math.ceil(roomsA.length / 2);
    var rH_A = (ah-30) / perSide_A;
    for (var i = 0; i < roomsA.length; i++) {
      var s = i < perSide_A ? 0 : 1;
      var idx = s === 0 ? i : i - perSide_A;
      var rx = s === 0 ? (ax+5) : (corX_A + corW_A);
      var ry = ay + 25 + idx * rH_A;
      var rw = (corX_A - ax - 7);
      var rData = parseRoom(roomsA[i]);
      svg += renderRoom(rx, ry, rw, rH_A - 3, rData, color);
    }
  }

  // B棟 rooms (horizontal layout, 2 rows)
  if (roomsB.length > 0) {
    var corH_B = 22;
    var corY_B = by + bh/2 - corH_B/2;
    svg += '<rect x="' + (bx+8) + '" y="' + corY_B + '" width="' + (bw-16) + '" height="' + corH_B + '" fill="#1e293b" fill-opacity="0.5" rx="2" />';
    var perSide_B = Math.ceil(roomsB.length / 2);
    var rW_B = (bw-16) / perSide_B;
    for (var i2 = 0; i2 < roomsB.length; i2++) {
      var s2 = i2 < perSide_B ? 0 : 1;
      var idx2 = s2 === 0 ? i2 : i2 - perSide_B;
      var rx2 = bx + 8 + idx2 * rW_B;
      var ry2 = s2 === 0 ? (by + 25) : (corY_B + corH_B);
      var rh2 = (bh - corH_B) / 2 - 6;
      var rData2 = parseRoom(roomsB[i2]);
      svg += renderRoom(rx2, ry2, rW_B - 3, rh2, rData2, color);
    }
  }

  // Highlight current building (A棟/B棟/連接區)
  var sel = currentSelection;
  if (sel) {
    if (sel.bldgId === 'SA') {
      svg += '<rect x="' + (ax-3) + '" y="' + (ay-3) + '" width="' + (aw+6) + '" height="' + (ah+6) + '" fill="none" stroke="#fbbf24" stroke-width="2" stroke-dasharray="4,3" rx="6" />';
    } else if (sel.bldgId === 'SB') {
      svg += '<rect x="' + (bx-3) + '" y="' + (by-3) + '" width="' + (bw+6) + '" height="' + (bh+6) + '" fill="none" stroke="#fbbf24" stroke-width="2" stroke-dasharray="4,3" rx="6" />';
    }
  }

  // 校門 marker (right of A棟)
  svg += '<rect x="' + (ax+aw+5) + '" y="' + (ay+ah/2-15) + '" width="15" height="30" fill="rgba(125,211,252,0.3)" stroke="#7dd3fc" stroke-width="1" rx="2" />';
  svg += '<text x="' + (ax+aw+12) + '" y="' + (ay+ah/2+4) + '" fill="#7dd3fc" font-size="9" text-anchor="middle">校</text>';

  // North arrow
  svg += '<g transform="translate(' + (SVG_W - 50) + ',40)">';
  svg += '<circle r="22" fill="#0a1428" stroke="#475569" stroke-width="1" />';
  svg += '<path d="M 0,-15 L 5,5 L 0,0 L -5,5 Z" fill="#7dd3fc" />';
  svg += '<text y="-18" fill="#7dd3fc" font-size="9" text-anchor="middle" font-weight="700">N</text>';
  svg += '</g>';

  svg += '</svg>';
  return svg;
}

function parseRoom(roomStr) {
  var isSpecial = roomStr.indexOf('__') === 0;
  var s = isSpecial ? roomStr.substring(2) : roomStr;
  var m = s.match(/^(.+?)\s+(N?\d+)$/);
  if (m) return { name: m[1], code: m[2], special: isSpecial };
  return { name: s, code: '', special: isSpecial };
}

function renderRoom(x, y, w, h, room, baseColor) {
  if (w < 5 || h < 5) return '';
  var fillColor = room.special ? 'rgba(245,158,11,0.18)' : 'rgba(20,40,80,0.7)';
  var strokeColor = room.special ? '#f59e0b' : adjustColor(parseColor(baseColor), 1.3);
  var nameColor = room.special ? '#fbbf24' : '#cbd5e1';
  var codeColor = room.special ? '#f59e0b' : '#7dd3fc';
  var s = '<rect x="' + x + '" y="' + y + '" width="' + w + '" height="' + h + '" fill="' + fillColor + '" stroke="' + strokeColor + '" stroke-width="0.7" rx="2" />';
  // Choose font size based on space
  var fs = Math.min(11, Math.max(8, Math.floor(Math.min(w, h) / 4)));
  if (room.code && h > 25) {
    s += '<text x="' + (x + w/2) + '" y="' + (y + h/2 - 2) + '" fill="' + nameColor + '" font-size="' + fs + '" text-anchor="middle">' + escapeXml(room.name) + '</text>';
    s += '<text x="' + (x + w/2) + '" y="' + (y + h/2 + fs + 1) + '" fill="' + codeColor + '" font-size="' + (fs-1) + '" text-anchor="middle" font-weight="600">' + escapeXml(room.code) + '</text>';
  } else {
    s += '<text x="' + (x + w/2) + '" y="' + (y + h/2 + fs/3) + '" fill="' + nameColor + '" font-size="' + fs + '" text-anchor="middle">' + escapeXml(room.name) + '</text>';
  }
  return s;
}

function parseColor(c) {
  if (typeof c === 'string') {
    return parseInt(c.replace('#', ''), 16);
  }
  return c;
}
function adjustColor(c, factor) {
  var col = new THREE.Color(c);
  col.multiplyScalar(factor);
  col.r = Math.min(1, col.r); col.g = Math.min(1, col.g); col.b = Math.min(1, col.b);
  return '#' + col.getHexString();
}

// ─────────────────────────────────────────
// Floor Plan Modal
// ─────────────────────────────────────────
// 取得指定建築的所有可用樓層（包含 B1）
function getAvailableFloors(bldgId) {
  if (bldgId === 'SA' || bldgId === 'SB' || bldgId === 'SC') return [1, 2, 3, 4, 5, 6];
  if (bldgId === 'P') return ['B1', 1, 2, 3, 4, 5];
  if (bldgId === 'Q') return [1, 2, 3, 4, 5];
  if (bldgId === 'J') return [1, 2, 3];
  return [];
}

// 在 modal 內切換樓層
function switchFloorPlan(floor) {
  if (!currentSelection) return;
  if (floor !== 'B1') floor = parseInt(floor);
  currentSelection.floor = floor;
  openFloorPlan();
}

function openFloorPlan() {
  if (!currentSelection) return;
  var sel = currentSelection;
  var key = getLayoutKey(sel.bldgId, sel.floor);
  var hasPrecise = !!LAYOUTS[key];

  // Title
  var floorLabel = (sel.floor === 'B1') ? '地下1樓 (B1)' : '第 ' + sel.floor + ' 樓';
  document.getElementById('fptitle').textContent = sel.bldg.name + (sel.bldg.sub ? ' ' + sel.bldg.sub : '') + ' - ' + floorLabel + ' 俯視圖';
  document.getElementById('fpsubtitle').textContent = hasPrecise
    ? '✨ 精準格子布局'
    : '📐 示意圖（教室位置為大略安排）';

  // Floor switcher
  var floors = getAvailableFloors(sel.bldgId);
  var swHtml = '';
  for (var i = 0; i < floors.length; i++) {
    var f = floors[i];
    var label = (f === 'B1') ? 'B1' : (f + 'F');
    var isCur = (f === sel.floor);
    var fkey = getLayoutKey(sel.bldgId, f);
    var hasL = !!LAYOUTS[fkey];
    var cls = 'fp-floor-btn' + (isCur ? ' cur' : '') + (hasL ? '' : ' no-layout');
    swHtml += '<button class="' + cls + '" onclick="switchFloorPlan(\'' + f + '\')">' + label + '</button>';
  }
  document.getElementById('fpswitcher').innerHTML = swHtml;

  // SVG
  document.getElementById('fpsvg').innerHTML = genFloorPlanSVG(sel.bldgId, sel.floor);

  // Note
  var note = document.getElementById('fpnote');
  if (hasPrecise) {
    note.textContent = '✓ 此樓層已採用精準格子座標';
    note.style.color = '#06b6d4';
  } else {
    note.textContent = '📌 此為示意圖，教室位置為大略安排，實際請以平面圖為準';
    note.style.color = '#64748b';
  }

  document.getElementById('fpmodal').classList.add('on');
}
function closeFloorPlan() {
  document.getElementById('fpmodal').classList.remove('on');
}

// Click backdrop to close
document.getElementById('fpmodal').addEventListener('click', function(e) {
  if (e.target.id === 'fpmodal') closeFloorPlan();
});

// ── Animate ──────────────────────────────
applyCamera();
var af = 0;
function loop() {
  requestAnimationFrame(loop);
  af++;
  for (var i = 0; i < labelMeshes.length; i++) labelMeshes[i].quaternion.copy(camera.quaternion);
  if (selectedMesh && af % 2 === 0) selectedMesh.material.emissiveIntensity = 0.3 + 0.12 * Math.sin(Date.now() * 0.0018);
  
  // 環景標記脈動
  var panoT = Date.now() * 0.003;
  for (var p = 0; p < panoMarkers.length; p++) {
    var grp = panoMarkers[p];
    if (grp.children[1]) {
      var s = 1 + Math.sin(panoT) * 0.3;
      grp.children[1].scale.set(s, s, 1);
      grp.children[1].material.opacity = 0.4 + 0.3 * (Math.sin(panoT) + 1) / 2;
    }
    grp.rotation.y = panoT * 0.3;
  }
  
  renderer.render(scene, camera);
}
loop();
</script>

  <div class="pano-content">
    <canvas id="pano-canvas"></canvas>
    <div class="pano-loading" id="pano-loading">
      <div class="pano-spinner"></div>
      <div>載入環景中...</div>
    </div>
    <div class="pano-header">
      <h3 id="pano-title">📍 學務處外走廊</h3>
      <p id="pano-loc">誠信A棟 1F · 中段</p><p style="font-size:10px;color:#fbbf24;margin-top:2px">🎨 虛擬街景：由程式即時繪製，不是實景照片</p>
    </div>
    <button class="pano-close" onclick="closePano()">×</button>
    <div id="pano-hint" class="pano-hint">👆 拖拉看四周（雙指縮放）</div>
  </div>
</div>
