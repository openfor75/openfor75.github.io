:root{
  --cream:#FAF5E9; --milk:#FFFCF5; --foam:#F3EAD6;
  --matcha:#7E9B60; --matcha-deep:#4E6B3B; --matcha-pale:#DCE7C9;
  --latte:#4A3B22; --latte-soft:#6E5A3A;
  --berry:#C089A3; --berry-pale:#EFDDE6;
  --caramel:#C9A24A; --caramel-pale:#F3E5C4;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#2E2617;overflow:hidden;
  font-family:'SeedDeck','LINE Seed TW_TTF','LINE Seed TW','jf-openhuninn','Microsoft JhengHei','PingFang TC',sans-serif;}
#viewport{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;cursor:pointer}
#stage{position:relative;width:1080px;height:1920px;flex:0 0 auto;transform-origin:center center;
  background:
    radial-gradient(120% 60% at 50% -10%, #FFFDF7 0%, rgba(255,253,247,0) 60%),
    radial-gradient(90% 45% at 10% 105%, var(--matcha-pale) 0%, rgba(220,231,201,0) 62%),
    radial-gradient(80% 40% at 98% 96%, var(--berry-pale) 0%, rgba(239,221,230,0) 60%),
    linear-gradient(180deg, var(--milk) 0%, var(--cream) 46%, var(--foam) 100%);
  overflow:hidden;border-radius:6px}
#stage::after{content:"";position:absolute;left:0;right:0;bottom:0;height:16px;
  background:linear-gradient(90deg,var(--matcha) 0%,var(--caramel) 50%,var(--berry) 100%);opacity:.85}

#topbar{position:absolute;top:64px;left:88px;right:88px;display:flex;align-items:center;gap:20px;z-index:5}
#dots{display:flex;gap:10px;flex:1}
.dot{width:34px;height:10px;border-radius:99px;background:rgba(74,59,34,.14);transition:.35s}
.dot.done{background:var(--caramel)}
.dot.now{background:var(--matcha-deep);transform:scaleY(1.9)}
#pageno{font-size:30px;color:var(--latte-soft);opacity:.75;letter-spacing:2px}

.slide{position:absolute;inset:0;padding:180px 92px 200px;display:none;flex-direction:column}
.slide.active{display:flex;animation:in .5s cubic-bezier(.2,.8,.25,1) both}
@keyframes in{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}

.eyebrow{align-self:flex-start;display:inline-flex;align-items:center;gap:14px;
  padding:14px 32px;border-radius:99px;font-size:32px;font-weight:700;letter-spacing:3px;
  background:var(--caramel-pale);color:#8A6A1E}
.slide[data-role=student] .eyebrow{background:var(--matcha-pale);color:var(--matcha-deep)}
.slide[data-role=teacher] .eyebrow{background:var(--berry-pale);color:#8E5872}
.eyebrow .bud{width:20px;height:20px;border-radius:50%;background:currentColor;opacity:.5}
.slide[data-role=student] .eyebrow,.slide[data-role=teacher] .eyebrow{font-size:48px;padding:18px 42px;letter-spacing:4px}
.slide[data-role=student] .eyebrow .bud,.slide[data-role=teacher] .eyebrow .bud{width:26px;height:26px}
h1{margin-top:30px;font-size:88px;line-height:1.2;font-weight:700;color:var(--latte)}
h1 em{font-style:normal;color:var(--matcha-deep)}
.slide[data-role=teacher] h1 em{color:#B4749A}
.rule{margin-top:26px;width:140px;height:12px;border-radius:99px;background:var(--caramel)}
.slide[data-role=student] .rule{background:var(--matcha)}
.slide[data-role=teacher] .rule{background:var(--berry)}
.body{margin-top:52px;flex:1;display:flex;flex-direction:column;justify-content:center;overflow:visible}
.inner{display:flow-root;width:100%;transform-origin:center center;transition:transform .2s}

.rv{opacity:0;transform:translateY(20px) scale(.97);
  transition:opacity .4s ease, transform .45s cubic-bezier(.2,.9,.3,1.25)}
.rv.show{opacity:1;transform:none}

/* 卡片格 */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:26px}
.grid.g3{grid-template-columns:1fr;gap:30px}
.card{background:var(--milk);border:6px solid var(--matcha-pale);border-radius:34px;
  padding:32px 30px;display:flex;gap:24px;align-items:flex-start;
  box-shadow:0 10px 0 rgba(74,59,34,.06)}
.slide[data-role=teacher] .card{border-color:var(--berry-pale)}
.slide[data-role=all] .card{border-color:var(--caramel-pale)}
.card .ico{flex:0 0 auto;width:86px;height:86px;border-radius:50%;background:var(--matcha-pale);
  display:flex;align-items:center;justify-content:center;font-size:46px}
.slide[data-role=teacher] .card .ico{background:var(--berry-pale)}
.slide[data-role=all] .card .ico{background:var(--caramel-pale)}
.card b{display:block;font-size:40px;color:var(--latte);font-weight:700;line-height:1.3}
.card span{display:block;margin-top:8px;font-size:30px;color:var(--latte-soft);line-height:1.45}

/* 流程 */
.flow{display:flex;flex-direction:column;gap:22px}
.step{display:flex;align-items:center;gap:26px;background:var(--milk);border-radius:30px;
  padding:26px 32px;border:6px solid var(--caramel-pale);box-shadow:0 10px 0 rgba(74,59,34,.05)}
.step .no{flex:0 0 auto;width:74px;height:74px;border-radius:50%;background:var(--caramel);
  color:#fff;font-size:40px;font-weight:700;display:flex;align-items:center;justify-content:center}
.step .em{font-size:52px}
.step b{font-size:42px;color:var(--latte);font-weight:700}
.step span{display:block;font-size:29px;color:var(--latte-soft);margin-top:4px}

/* 換算箭頭 */
.calcflow{display:flex;flex-direction:column;gap:20px;align-items:center}
.box{width:100%;background:var(--milk);border:6px solid var(--matcha-pale);border-radius:32px;
  padding:30px 36px;text-align:center}
.box .k{font-size:30px;color:var(--latte-soft);letter-spacing:2px}
.box .v{font-size:64px;font-weight:700;color:var(--latte);line-height:1.25;margin-top:6px}
.box .v em{font-style:normal;color:var(--matcha-deep)}
.arrow{display:flex;align-items:center;gap:16px;font-size:34px;color:var(--matcha-deep);font-weight:700}
.arrow i{font-style:normal;font-size:44px}
.caps{display:flex;flex-direction:column;gap:18px;margin-top:26px}
.cap1{display:flex;gap:18px;align-items:flex-start;font-size:38px;color:var(--latte);line-height:1.5}
.cap1 i{flex:0 0 auto;width:20px;height:20px;border-radius:50%;background:var(--matcha);margin-top:16px}
.cap1 b{color:var(--matcha-deep);font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:18px;justify-content:center;margin-top:8px}
.chip{display:inline-flex;align-items:center;gap:12px;padding:18px 30px;border-radius:99px;
  font-size:34px;font-weight:700;background:var(--matcha-pale);color:var(--matcha-deep)}
.chip.no{background:#F5DCDC;color:#9C4F4F}
.chip.gold{background:var(--caramel-pale);color:#8A6A1E}
.chip.berry{background:var(--berry-pale);color:#8E5872}

/* 訂價尺 */
.ruler{position:relative;margin:96px 0 116px;height:56px;border-radius:99px;
  background:linear-gradient(90deg,var(--matcha-pale),var(--matcha));border:5px solid var(--milk);
  box-shadow:0 8px 0 rgba(74,59,34,.07)}
.ruler .end{position:absolute;top:74px;font-size:38px;color:var(--latte-soft);font-weight:700}
.ruler .end.l{left:0}.ruler .end.r{right:0}
.pin{position:absolute;top:-72px;transform:translateX(-50%);text-align:center}
.pin .lab{font-size:36px;font-weight:700;padding:10px 20px;border-radius:99px;white-space:nowrap;
  background:var(--latte);color:#FFF8E7}
.pin.c .lab{background:var(--berry)}
.pin .stick{width:9px;height:62px;background:var(--latte);margin:6px auto 0;border-radius:99px}
.pin.c .stick{background:var(--berry)}
.span{position:absolute;top:8px;height:40px;border-radius:99px;background:var(--caramel);opacity:.9}
.spanlab{position:absolute;top:68px;font-size:38px;font-weight:700;color:#8A6A1E;transform:translateX(-50%)}

/* 商經幣公式 */
.coineq{display:flex;align-items:center;justify-content:center;gap:20px;flex-wrap:wrap}
.cbox{background:var(--milk);border:6px solid var(--berry-pale);border-radius:32px;padding:26px 30px;text-align:center;min-width:250px}
.cbox .n{font-size:66px;font-weight:700;color:var(--latte)}
.cbox .n em{font-style:normal;color:var(--berry)}
.cbox .t{font-size:29px;color:var(--latte-soft);margin-top:4px}
.op{font-size:56px;font-weight:700;color:var(--berry)}

/* 對比欄 */
.vs{display:grid;grid-template-columns:1fr 1fr;gap:26px}
.pane{background:var(--milk);border-radius:34px;padding:34px 30px;border:6px solid var(--caramel-pale);text-align:center}
.pane h3{font-size:38px;color:var(--latte);margin-bottom:20px;font-weight:700}
.pane .em{font-size:76px}
.pane p{font-size:32px;color:var(--latte-soft);line-height:1.5;margin-top:14px}
.pane.open{border-color:var(--matcha-pale)}

/* 表格 */
.tbl{width:100%;border-collapse:separate;border-spacing:0 16px}
.tbl td{background:var(--milk);padding:26px 30px;font-size:40px;color:var(--latte);font-weight:700}
.tbl td:first-child{border-radius:26px 0 0 26px;color:var(--latte-soft);font-size:36px;width:38%}
.tbl td:last-child{border-radius:0 26px 26px 0}
.tbl tr.rv td{box-shadow:0 8px 0 rgba(74,59,34,.05)}

/* 長條圖 */
.bars{display:flex;align-items:flex-end;justify-content:space-around;gap:26px;height:520px;margin-top:20px}
.bar{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%}
.bar .val{font-size:38px;font-weight:700;color:var(--latte);margin-bottom:12px}
.bar .col{width:100%;border-radius:24px 24px 0 0;background:var(--matcha-pale);
  transition:height .5s cubic-bezier(.2,.9,.3,1.2)}
.bar.b2 .col{background:var(--berry)}
.bar.b3 .col{background:var(--caramel)}
.bar.b1 .col{background:var(--matcha)}
.bar .cap{font-size:32px;color:var(--latte-soft);margin-top:16px;font-weight:700}

/* 時間軸 */
.tl{display:flex;flex-direction:column;gap:0}
.node{display:flex;align-items:center;gap:28px;padding:20px 0}
.node .bul{position:relative;flex:0 0 auto;width:34px;height:34px;border-radius:50%;
  background:var(--caramel);box-shadow:0 0 0 10px var(--caramel-pale)}
.node .bul::after{content:"";position:absolute;left:50%;top:44px;width:6px;height:52px;
  transform:translateX(-50%);background:rgba(74,59,34,.16);border-radius:99px}
.node:last-child .bul::after{display:none}
.node b{font-size:44px;color:var(--latte);font-weight:700;flex:1}
.node span{font-size:38px;color:var(--latte-soft);letter-spacing:3px}

/* 封面 */
.cover{justify-content:center;align-items:center;text-align:center;padding:170px 92px 200px}
.cover .school{font-size:33px;letter-spacing:5px;color:var(--latte-soft);white-space:nowrap;margin-top:44px}
.cover h1{font-size:120px;margin-top:30px}
.cover .sub{margin-top:34px;font-size:42px;color:var(--latte-soft);line-height:1.6}
.cover .rule{align-self:center}
.logo-hero{width:800px;max-width:88%}
.cover.top{justify-content:flex-start;padding-top:150px}
.cover.top .logo-hero{width:470px}
.cover.top .school{margin-top:18px;font-size:29px;letter-spacing:4px}
.mid{margin:auto 0;display:flex;flex-direction:column;align-items:center}
.pin.rv{transform:translateX(-50%) translateY(18px) scale(.96)}
.pin.rv.show{transform:translateX(-50%)}
.layer{position:absolute;inset:0}
.logo-hero.pop{animation:pop .9s cubic-bezier(.2,1.4,.4,1) both}
@keyframes pop{0%{opacity:0;transform:scale(.82) rotate(-3deg)}100%{opacity:1;transform:none}}
.ribbon{margin-top:22px;font-size:34px;letter-spacing:8px;color:var(--berry);font-weight:700}
.cover .chips{margin-top:56px}
.cover .chip{font-size:36px;padding:22px 36px}

#footer{position:absolute;left:92px;right:92px;bottom:66px;display:flex;align-items:center;
  justify-content:space-between;gap:24px;z-index:5}
#flogo{height:62px;opacity:.9}
#hint{display:flex;align-items:center;gap:14px;font-size:32px;color:var(--latte-soft);opacity:.85}
#hint .tapdot{width:26px;height:26px;border-radius:50%;background:var(--matcha);animation:tap 1.7s ease-in-out infinite}
@keyframes tap{0%,100%{transform:scale(1);opacity:.5}50%{transform:scale(1.45);opacity:1}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.08s!important}}
#help{position:fixed;bottom:14px;left:0;right:0;text-align:center;color:rgba(255,252,245,.4);
  font-size:12px;letter-spacing:1px;pointer-events:none;z-index:20;white-space:nowrap}
</style>
</head>

const slidesEl=document.getElementById('slides'),dotsEl=document.getElementById('dots'),
      pageEl=document.getElementById('pageno'),hintEl=document.getElementById('hint'),
      flogo=document.getElementById('flogo');

D.forEach(s=>{
  const el=document.createElement('section');
  el.className='slide'+(s.cover?' cover':'')+(s.top?' top':'');
  el.dataset.role=s.role;
  el.innerHTML=(s.cover?'':`<div class="eyebrow"><span class="bud"></span>${s.eyebrow}</div>
     <h1>${s.h1}</h1><div class="rule"></div>`)
    +(s.cover?s.html:`<div class="body"><div class="inner">${s.html}</div></div>`);
  slidesEl.appendChild(el);
  const d=document.createElement('div');d.className='dot';dotsEl.appendChild(d);
});
const slides=[...document.querySelectorAll('.slide')];
function groups(s){
  if(s._g) return s._g;
  const rvs=[...s.querySelectorAll('.rv')];
  const keyed=rvs.some(e=>e.dataset.o!==undefined);
  let g;
  if(keyed){
    const m=new Map();
    rvs.forEach((e,i)=>{const k=e.dataset.o!==undefined?+e.dataset.o:1000+i;
      if(!m.has(k))m.set(k,[]);m.get(k).push(e);});
    g=[...m.keys()].sort((a,b)=>a-b).map(k=>m.get(k));
  }else g=rvs.map(e=>[e]);
  return s._g=g;
}
const dots=[...document.querySelectorAll('.dot')];
let p=0,step=0;

function autofit(){
  slides.forEach(s=>{
    const b=s.querySelector('.body'), n=s.querySelector('.inner'); if(!b||!n)return;
    const prev=s.style.display; s.style.display='flex';
    n.style.transform='none';
    const avail=b.clientHeight, h=n.offsetHeight;
    if(h>0){let k=Math.min(1.07, avail/h); if(k<1) k=Math.max(.62,k);
      if(Math.abs(k-1)>.01) n.style.transform='scale('+k.toFixed(4)+')';}
    s.style.display=prev;
  });
}
function render(anim){
  slides.forEach((s,i)=>s.classList.toggle('active',i===p));
  const cur=slides[p], G=groups(cur);
  G.forEach((g,i)=>g.forEach(e=>e.classList.toggle('show',i<step)));
  cur.querySelectorAll('.bar').forEach(b=>{
    const c=b.querySelector('.col');
    c.style.height=b.classList.contains('show')? c.dataset.h+'px':'0px';
  });
  const hero=cur.querySelector('.logo-hero');
  if(hero&&anim){hero.classList.remove('pop');void hero.offsetWidth;hero.classList.add('pop');}
  flogo.style.opacity=cur.classList.contains('cover')?0:.9;
  dots.forEach((d,i)=>{d.classList.toggle('done',i<p);d.classList.toggle('now',i===p)});
  pageEl.textContent=(p+1)+' / '+slides.length;
  hintEl.style.opacity=(p===slides.length-1&&step>=G.length)?.25:.85;
}
function next(){const n=groups(slides[p]).length;
  if(step<n){step++;render(0)}else if(p<slides.length-1){p++;step=0;render(1)}}
function prev(){if(step>0){step--;render(0)}
  else if(p>0){p--;step=groups(slides[p]).length;render(1)}}
function fit(){document.getElementById('stage').style.transform='scale('+Math.min(innerWidth/1080,innerHeight/1920)+')'}
addEventListener('resize',fit);fit();autofit();render(1);
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>{autofit();render(0)});
document.getElementById('viewport').addEventListener('click',next);
addEventListener('keydown',e=>{
 if([' ','Enter','ArrowRight','ArrowDown','PageDown'].includes(e.key)){e.preventDefault();next()}
 else if(['ArrowLeft','ArrowUp','PageUp'].includes(e.key)){e.preventDefault();prev()}
 else if(e.key==='r'||e.key==='R'){p=0;step=0;render(1)}
 else if(e.key==='f'||e.key==='F'){document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen()}});
let sy=null;
addEventListener('touchstart',e=>sy=e.touches[0].clientY,{passive:true});
addEventListener('touchend',e=>{if(sy===null)return;if(e.changedTouches[0].clientY-sy>90)prev();sy=null},{passive:true});
</script>
