.sheet{background:#fff;color:#000;max-width:820px;width:100%;border-radius:6px;box-shadow:0 12px 40px rgba(0,0,0,.35);padding:20px clamp(12px,3vw,40px);display:flex;flex-direction:column;gap:14px}

<script>
(function(){
/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let seed=20251012;function rnd(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}
const pick=a=>a[Math.floor(rnd()*a.length)];
const pad=n=>String(n).padStart(2,'0');
const fmt=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const now=new Date();const TODAY=fmt(now);
const ts=d=>`${fmt(d)} ${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
function addDays(d,n){const x=new Date(d);x.setDate(x.getDate()+n);return x}
const monday=(()=>{const d=new Date(now);d.setHours(0,0,0,0);const w=(d.getDay()+6)%7;return addDays(d,-w)})();
const SEM_START=addDays(monday,-35); // 今天落在第 6 週
const weekOf=s=>Math.floor((new Date(s+'T00:00:00')-SEM_START)/864e5/7)+1;
const CUR_WEEK=weekOf(TODAY);
const rid=d=>`${fmt(d).replace(/-/g,'')}${pad(d.getHours())}${pad(d.getMinutes())}${pad(d.getSeconds())}_${Math.floor(rnd()*0xffffff).toString(16).padStart(6,'0')}`;

/* ---------- 虛構資料 ---------- */
const GRADES=['1年級','2年級','3年級'];
const CLASSES={'1年級':['商一甲','商一乙','商一丙','英一甲','資一甲','家一甲','服一甲'],'2年級':['商二甲','商二乙','商二丙','英二甲','資二甲','家二甲','服二甲'],'3年級':['商三甲','商三乙','商三丙','英三甲','資三甲','家三甲','服三甲']};
const ALL=GRADES.flatMap(g=>CLASSES[g]);
const gradeOf=c=>GRADES.find(g=>CLASSES[g].includes(c));
const ROSTER={};ALL.forEach((c,ci)=>{const g=gradeOf(c)[0];const yr={'1':'4','2':'3','3':'2'}[g];ROSTER[c]=Array.from({length:8},(_,i)=>`${yr}9${pad(ci)}${pad(i+1)}`)});
const AREAS={};const BLD=['誠信樓B棟 3F 男廁','誠信樓B棟 4F 女廁','樸實樓 2F 走廊','勤學樓 1F 洗手台','敬業樓 2F 樓梯間','戶外-校門口/川堂','戶外-籃球場/司令台','誠信樓A棟 2F 茶水間'];ALL.forEach((c,i)=>AREAS[c]=BLD[i%BLD.length]);
const OFFICES=[['教務處','商三甲'],['學務處','商三乙'],['總務處','英三甲'],['輔導室','資三甲'],['圖書館','家三甲']];
const INSPECTORS=[
 {id:'390101',role:'內掃檢查',classes:['商一甲','商一乙','商一丙','英一甲','資一甲']},
 {id:'390102',role:'外掃檢查',classes:['商二甲','商二乙','英二甲','資二甲']},
 {id:'390103',role:'內掃檢查',classes:['商三甲','商三乙','商三丙','英三甲','資三甲']},
 {id:'390104',role:'機動',classes:[]},
 {id:'390105',role:'衛生糾察隊長',classes:[]},
 {id:'490201',role:'外掃檢查',classes:['家一甲','服一甲','家二甲','服二甲']},
 {id:'490202',role:'內掃檢查',classes:['商二丙','家二甲','服二甲','家三甲','服三甲']},
 {id:'490203',role:'垃圾回收(中午)',classes:[]},
 {id:'490204',role:'環保(下午)',classes:[]},
 {id:'490205',role:'回收(中午)',classes:[]},
];
const allowed=p=>/垃圾|回收|環保/.test(p.role)?['垃圾/回收檢查']:/機動|隊長/.test(p.role)?['內掃檢查','外掃檢查']:[p.role];
const IN_POS=['走廊','黑板','地板','窗戶(窗溝)','陽台'];
const IN_ST=['髒亂','沒拖地','沒擦拭','酒精未補','掃具壞掉未換','懸掛垃圾未清除','人工垃圾','蜘蛛網','頭髮圈圈','打掃玩手機'];
const OUT_ITEMS=['男廁','女廁','茶水間','無障礙廁所','樓梯間','洗手台','天花板','走廊','地板','陽台'];
const OUT_ST=['髒亂','沒拖地','沒掃地','沒擦拭','酒精未補','掃具壞掉未換','人工垃圾','蜘蛛網','頭髮圈圈','打掃玩手機'];
const BUILDINGS={'':[''],'誠信樓A棟(各處室)':['','1F','2F','3F','4F','5F','6F'],'誠信樓B棟':['','B1','1F','2F','3F','4F','5F','6F'],'樸實樓(合作社)':['','1F','2F','3F','4F','5F'],'勤學樓(烘焙縫紉)':['','1F','2F','3F','4F','5F'],'敬業樓':['','1F','2F','3F'],'戶外-籃球場/司令台':[''],'戶外-校門口/川堂/雨庇':[''],'戶外-車棚/資收場/階梯':[''],'戶外-空橋/走道/其他':['','1F','2F','3F','4F','5F']};
const TRASH=['一般垃圾','紙類','網袋aka塑膠鐵鋁','其他'];

const S={records:[],published:{},service:[],debts:[],debtHist:[],hyTask:'今天重點檢查：黑板溝槽、窗台灰塵，拍照請拍到掃區全景！',undo:[]};
function rec(o){return Object.assign({日期:TODAY,週次:weekOf(o.日期||TODAY),班級:'',評分項目:'',檢查人員:'',內掃原始分:0,外掃原始分:0,垃圾原始分:0,手機人數:0,備註:'',違規細項:'',登錄時間:'',修正:false,紀錄ID:''},o)}
(function gen(){
  for(let w=CUR_WEEK-3;w<=CUR_WEEK;w++){
    for(let dd=0;dd<5;dd++){
      const d=addDays(SEM_START,(w-1)*7+dd);const ds=fmt(d);if(ds>TODAY)continue;
      INSPECTORS.filter(p=>p.classes.length).forEach(p=>{
        p.classes.forEach((c,ci)=>{
          if(ds===TODAY&&ci>=2)return; // 今天還沒評完，示範進度條
          const t=new Date(d);t.setHours(16,2+ci,Math.floor(rnd()*59));
          const r=rnd();const base={日期:ds,週次:w,班級:c,檢查人員:`學號: ${p.id}`,登錄時間:ts(t),紀錄ID:rid(t)};
          if(r<0.62)S.records.push(rec({...base,評分項目:`${p.role}(普通)`,備註:'本次檢查無扣分，表現普通'}));
          else if(r<0.72)S.records.push(rec({...base,評分項目:`${p.role}(${w>=CUR_WEEK-1&&rnd()<.5?'待審優良':'優良'})`,備註:'優良原因：地板乾淨、掃具整齊'}));
          else{const pts=rnd()<.7?1:2;
            if(p.role==='內掃檢查'){const pos=[pick(IN_POS)],st=[pick(IN_ST)];S.records.push(rec({...base,評分項目:'內掃檢查',內掃原始分:pts,備註:`位置：${pos.join('、')} | 狀況：${st.join('、')}`,違規細項:st.join('、')}))}
            else{const it=[pick(OUT_ITEMS)],st=[pick(OUT_ST)];S.records.push(rec({...base,評分項目:'外掃檢查',外掃原始分:pts,備註:`掃區：${AREAS[c]} | 項目：${it.join('、')} | 狀況：${st.join('、')}`,違規細項:st.join('、')}))}}
        });
      });
      if(rnd()<.6){const c=pick(ALL);const t=new Date(d);t.setHours(16,20,0);const n=rnd()<.5?1:2;S.records.push(rec({日期:ds,週次:w,班級:c,評分項目:'垃圾/回收檢查',檢查人員:'學號: 490203',垃圾原始分:n,備註:`內掃-${pick(TRASH)}(${n>1?'未倒垃圾,未做好分類':'未做好分類'})`,違規細項:'垃圾分類',登錄時間:ts(t),紀錄ID:rid(t)}))}
    }
  }
  // 服務時數 / 欠時 / 消警告
  ['392001','392003'].forEach((sid,i)=>{S.debts.push({學號:sid,班級:'商三甲',時數:2,備註:`${fmt(addDays(now,-20))} 返校打掃未到`})});
  S.debts.push({學號:'392102',班級:'商三乙',時數:1.5,備註:`${fmt(addDays(now,-20))} 返校打掃未到`});
  S.debts.push({學號:'391504',班級:'英二甲',時數:0.5,備註:`${fmt(addDays(now,-12))} 返校打掃未到`});

const isScored=r=>!/優良|普通/.test(r.評分項目)&&!r.修正&&r.評分項目!=='服務時數發放';
const dedOf=r=>Math.min(+r.內掃原始分||0,2)+Math.min(+r.外掃原始分||0,2)+Math.min(+r.垃圾原始分||0,2)+(+r.手機人數||0);
function weekStats(w){const m={};ALL.forEach(c=>m[c]={ded:0,exc:0});S.records.forEach(r=>{if(w!=null&&r.週次!==w)return;if(!m[r.班級])return;if(isScored(r))m[r.班級].ded+=dedOf(r);if(/\(優良\)/.test(r.評分項目))m[r.班級].exc++});return m}
function grade(d){return d===0?'⭐ 優良':d<=3?'✅ 普通':'⚠️ 需加強'}
function rank(w,mode){const st=weekStats(w);let rows=ALL.map(c=>({年級:gradeOf(c),班級:c,總扣分:st[c].ded,優良次數:st[c].exc,總成績:90-st[c].ded,評等:grade(st[c].ded)}));
  const doRank=list=>{list.sort((a,b)=>b.總成績-a.總成績||b.優良次數-a.優良次數);list.forEach((r,i)=>{r.排名=i&&list[i-1].總成績===r.總成績&&list[i-1].優良次數===r.優良次數?list[i-1].排名:i+1});return list};
  if(mode==='全校')return doRank(rows);return GRADES.flatMap(g=>doRank(rows.filter(r=>r.年級===g)))}

[CUR_WEEK-2,CUR_WEEK-1].forEach(w=>{S.published[w]={rows:rank(w,'年級'),mode:'年級',at:fmt(addDays(SEM_START,(w-1)*7+4))+' 17:30'}});

function bars(data,{h=300,color='#3182ce',vertical=true}={}){if(!data.length)return '';const W=Math.max(520,data.length*44),pl=40,pb=vertical?90:40,pt=14,H=h;const mx=Math.max(...data.map(d=>d[1]),1);const step=Math.ceil(mx/4)||1;const top=step*4;const bw=(W-pl-10)/data.length;
  let s=`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="長條圖">`;for(let i=0;i<=4;i++){const y=pt+(H-pt-pb)*(1-i/4);s+=`<line x1="${pl}" x2="${W-10}" y1="${y}" y2="${y}" stroke="#e2e8f0"/><text x="${pl-6}" y="${y+4}" font-size="12" text-anchor="end">${step*i}</text>`}
  data.forEach(([lab,v],i)=>{const bh=(H-pt-pb)*v/top;const x=pl+i*bw+bw*.18;s+=`<rect x="${x}" y="${H-pb-bh}" width="${bw*.64}" height="${bh}" rx="3" fill="${color}"/>`;
    if(vertical){[...lab].forEach((ch,j)=>{s+=`<text x="${x+bw*.32}" y="${H-pb+16+j*15}" font-size="13" text-anchor="middle">${esc(ch)}</text>`})}else s+=`<text x="${x+bw*.32}" y="${H-pb+18}" font-size="12" text-anchor="middle">${esc(lab)}</text>`});
  return s+'</svg>'}
function lines(series,weeks){const W=640,H=260,pl=40,pb=34,pt=12;const mx=Math.max(1,...series.flatMap(s=>s.v));const top=Math.ceil(mx/2)*2;const xs=i=>pl+(W-pl-120)*(weeks.length>1?i/(weeks.length-1):.5);const ys=v=>pt+(H-pt-pb)*(1-v/top);
  const cols=['#3182ce','#e53e3e','#38a169','#d69e2e','#805ad5','#dd6b20','#319795','#d53f8c'];
  let s=`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="近四週扣分趨勢">`;for(let i=0;i<=2;i++){const v=top*i/2;s+=`<line x1="${pl}" x2="${W-120}" y1="${ys(v)}" y2="${ys(v)}" stroke="#e2e8f0"/><text x="${pl-6}" y="${ys(v)+4}" font-size="12" text-anchor="end">${v}</text>`}
  weeks.forEach((w,i)=>s+=`<text x="${xs(i)}" y="${H-10}" font-size="12" text-anchor="middle">第${w}週</text>`);
  series.forEach((se,k)=>{const c=cols[k%cols.length];s+=`<polyline fill="none" stroke="${c}" stroke-width="2.5" points="${se.v.map((v,i)=>`${xs(i)},${ys(v)}`).join(' ')}"/>`;se.v.forEach((v,i)=>s+=`<circle cx="${xs(i)}" cy="${ys(v)}" r="3.5" fill="${c}"/>`);s+=`<rect x="${W-108}" y="${pt+k*22}" width="12" height="12" rx="2" fill="${c}"/><text x="${W-90}" y="${pt+k*22+11}" font-size="12">${esc(se.n)}</text>`});return s+'</svg>'}

 undo(){if(!U.undoReason.trim()){U.flashA[2]=['err','❌ 請填寫撤分原因'];return}if(!U.undoOk){U.flashA[2]=['warn','⚠️ 請先勾選確認'];return}const r=S.records.find(x=>x.紀錄ID===U.undoSel);if(r){r.修正=true;r.備註+=` | 【組長撤分】${U.undoReason}`}U.flashA[2]=['ok','✅ 已排入撤分佇列，約 10–30 秒後生效，儀表板與成績將自動重算。（示範版：已立即生效）'];U.undoReason='';U.undoOk=false},
 calcWeek(){U.sumShown=U.sumWeek},reload(){U.flashA[4]=['ok','已重新讀取資料。']},calcSem(){U.semShown=true},
 publish(){S.published[U.sumWeek]={rows:rank(U.sumWeek,U.sumMode),mode:U.sumMode,at:ts(new Date()).slice(0,16)};U.flashA[4]=['ok',`✅ 第 ${U.sumWeek} 週成績已發布！學生現在可以查詢。（到「班級負責人🥸 → 🏆 各週排名」就看得到）`]},
 saveTask(){S.hyTask=U.dailyIn;U.flashA[5]=['ok','✅ 糾察任務已更新！糾察隊現在起會看到最新廣播。']},
 giveCls(){const mem=ROSTER[U.shCls];const cat=U.shCat+(U.shNote?'｜'+U.shNote:'');const att=mem.filter(x=>!U.shEx.includes(x)&&!U.shAbs.includes(x));att.forEach(id=>S.service.push({日期:U.shDate,學號:id,班級:U.shCls,類別:cat,時數:+U.shHours}));
  let msg=`✅ 已發放！出席 ${att.length} 人 (${U.shHours}h)`;if(U.shCat==='返校打掃'){U.shAbs.forEach(id=>{S.debts.push({學號:id,班級:U.shCls,時數:+U.shDebt,備註:`${U.shDate} 返校打掃未到`});S.debtHist.push({學號:id,異動時數:+U.shDebt})});msg+=`　|　🏃 免除 ${U.shEx.length} 人（不處理）　|　❌ 未到 ${U.shAbs.length} 人已登記欠時 ${U.shDebt}hr`}
  U.flashA[6]=['ok',msg];U.shEx=[];U.shAbs=[]},
 giveTeam(){const team=INSPECTORS.filter(p=>!/垃圾|回收|環保/.test(p.role)).map(p=>p.id).filter(x=>!U.shAbs.includes(x));team.forEach(id=>S.service.push({日期:U.shDate,學號:id,班級:'糾察隊',類別:U.shCat,時數:+U.shHours}));U.flashA[6]=['ok',`✅ 已排程發放 ${team.length} 位 衛生糾察 各 ${U.shHours}h 時數！（類別：${U.shCat}）`];U.shAbs=[]},
 previewHours(){modal('服務學習證明登錄表（預覽）',hoursHTML())},
 dbSubmit(){const ids=U.dbIds.split(/[\s,，、]+/).map(s=>s.trim()).filter(Boolean);if(!ids.length){U.flashA[7]=['err','❌ 請輸入至少一位學號'];return}if(!U.dbWork.trim()){U.flashA[7]=['err','❌ 請填寫工作內容'];return}if(!U.dbOk){U.flashA[7]=['warn','⚠️ 請先勾選確認'];return}
  const h=+U.dbHours;if(U.dbPurpose.includes('消警告')){ids.forEach(id=>{const c=S.debts.find(d=>d.學號===id)?.班級||ALL.find(c=>ROSTER[c].includes(id))||'';S.service.push({日期:U.dbDate,學號:id,班級:`${U.dbWork}|${U.dbStart||'—'}`,類別:'愛校服務(消警告)',時數:h,核發狀態:'',realClass:c})});U.slipQuery=false}
  else{ids.forEach(id=>{let left=h;S.debts.filter(d=>d.學號===id).forEach(d=>{const x=Math.min(d.時數,left);d.時數-=x;left-=x});S.debts=S.debts.filter(d=>d.時數>0);S.service.push({日期:U.dbDate,學號:id,班級:'愛校打掃',類別:'返校打掃(補打掃)',時數:h})})}
  U.flashA[7]=['ok',`✅ 已排入處理佇列（${ids.length} 人，${U.dbPurpose.includes('消警告')?'消警告':'還時數'}）。約 10–30 秒後生效；${U.dbPurpose.includes('消警告')?'消警告請稍後至「🖨️ 銷過單核發」產製表單。':'欠時已自動扣抵。'}（示範版：已立即生效）`];U.dbIds='';U.dbWork='';U.dbOk=false;U.settle=null;U.lineTxt=null},
 settle(){U.settle=true},
 lineTxt(){const by={};S.debts.forEach(d=>(by[d.班級]=by[d.班級]||[]).push(d));const n=new Set(S.debts.map(d=>d.學號)).size;U.lineTxt=n?`⚠️ 返校打掃欠時數提醒\n\n${Object.entries(by).map(([c,l])=>`📌 ${c}\n${l.map(d=>`  • ${d.學號}（${d.時數}hr）　${d.備註}`).join('\n')}`).join('\n\n')}\n\n共 ${n} 位同學，請盡速安排補打掃。\n逾期未完成將依規定記警告處分。`:'🎉 目前沒有欠時的同學！'},
 copyLine(){const ta=$('#lineTA');const m=$('#copyMsg');const done=()=>{m.textContent='✅ 已複製，可以貼到 LINE 了'};try{navigator.clipboard.writeText(ta.value).then(done,()=>{ta.select();m.textContent='已幫你選取文字，請按 Ctrl+C（手機長按）複製'})}catch(e){ta.select();m.textContent='已幫你選取文字，請按 Ctrl+C（手機長按）複製'}},
 slipQuery(){U.slipQuery=true},
 loadRoster(){SESSION_ROSTER=buildFakeRoster()},
 clearRoster(){SESSION_ROSTER=null},
 previewForm(){if(!U.slipStu)return;modal(`愛校服務申請單（${U.slipStu}）`,formHTML(U.slipStu))},
 closeModal(){$('#modal').innerHTML=''},
};
const NORERENDER=new Set(['copyLine','closeModal','previewForm','previewHours']);

/* ---------- 渲染與事件 ---------- */
function render(){$('#nav').innerHTML=MODES.map((m,i)=>`<button type="button" aria-pressed="${U.mode===i}" data-mode="${i}">${m}</button>`).join('');
  $('#root').innerHTML=[pInspector,pClass,pAdmin][U.mode]();}
document.addEventListener('click',e=>{const m=e.target.closest('[data-mode]');if(m){U.mode=+m.dataset.mode;U.flash=null;render();window.scrollTo(0,0);return}
  const t=e.target.closest('[data-tab]');if(t){U[t.dataset.tab]=+t.dataset.i;render();return}
  const b=e.target.closest('[data-act]');if(b){const [a,arg]=b.dataset.act.split(':');if(a==='exOk'||a==='exNo'){const r=S.records.find(x=>x.紀錄ID===arg);if(r){r.評分項目=r.評分項目.replace('(待審優良)',a==='exOk'?'(優良)':'(普通)');U.flashA[3]=a==='exOk'?['ok',`✅ 已核可為優良！（${r.班級}）`]:['info',`已改為普通。（${r.班級}）`]}render();return}
    if(A[a]){A[a](arg);if(!NORERENDER.has(a))render()}return}
  if(e.target.classList.contains('mask'))A.closeModal();});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('#modal').innerHTML)A.closeModal()});
document.addEventListener('input',e=>{const el=e.target;if(el.dataset.k&&el.type!=='radio'&&el.type!=='checkbox'&&el.tagName!=='SELECT'){U[el.dataset.k]=el.type==='number'?el.value:el.value}});
document.addEventListener('change',e=>{const el=e.target;
  if(el.dataset.tm){U.trashMarks[el.dataset.tm]=el.checked;return}
  if(el.dataset.m){const k=el.dataset.m;U[k]=el.checked?[...U[k],el.value]:U[k].filter(x=>x!==el.value)}
  else if(el.dataset.k){U[el.dataset.k]=el.type==='checkbox'?el.checked:el.value;if(el.dataset.k==='bld')U.flr=''}
  else return;
  if(el.type==='radio'||el.tagName==='SELECT'||el.hasAttribute('data-re')){if(['pre','insp','role','cls','grade','result','trashCat','trashTarget'].includes(el.dataset.k))U.flash=null;if(['rcTeam','rcShift'].includes(el.dataset.k))U.rcAbsent=[];if(el.dataset.k==='shMode'||el.dataset.k==='shCls')U.shAbs=[],U.shEx=[];render()}});
U.cls='';render();
})();
</script>
