<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>教學簡報索引</title>
<style>
  :root{
    --paper:#FBFCF8;
    --bar:#E4EFE2;
    --ink:#17251D;
    --ink-soft:#5C6E62;
    --rule:#B9CDBE;
    --stamp:#B3352B;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;
    line-height:1.6;
    padding:24px 16px 64px;
  }
  .sheet{max-width:860px;margin:0 auto}
  header{padding-bottom:10px;border-bottom:3px double var(--stamp)}
  h1{margin:0;font-size:clamp(22px,5vw,30px);letter-spacing:.14em;font-weight:700}
  .sub{margin:6px 0 0;font-size:14px;color:var(--ink-soft);letter-spacing:.05em}
  .month{
    margin:28px 0 0;padding:6px 4px;font-size:13px;letter-spacing:.2em;
    color:var(--ink-soft);border-bottom:1px solid var(--rule);
    font-variant-numeric:tabular-nums;
  }
  ul{list-style:none;margin:0;padding:0}
  li a{
    display:flex;align-items:baseline;gap:14px;padding:13px 12px;
    text-decoration:none;color:inherit;
    border-bottom:1px solid var(--rule);border-left:3px solid transparent;
  }
  li:nth-child(odd) a{background:var(--bar)}
  li a:hover,li a:focus-visible{border-left-color:var(--stamp);outline:none;background:#fff}
  .date{
    flex:0 0 auto;font-family:ui-monospace,"SF Mono",Menlo,monospace;
    font-size:15px;color:var(--stamp);font-variant-numeric:tabular-nums;
  }
  .body{flex:1 1 auto;min-width:0}
  .title{display:block;font-size:16px;font-weight:600}
  .tag{display:inline-block;margin-top:3px;font-size:12px;letter-spacing:.08em;color:var(--ink-soft)}
</style>
</head>
<body>
<div class="sheet">

  <header>
    <h1>教學資料ㄉ索引</h1>
    <p class="sub">林老師和同學們的點點滴滴</p>
  </header>

     改三個地方 —— 檔名、日期、主題。不需要科目就把 tag 那行刪掉。

     <li><a href="檔名.html">
       <span class="date">月/日</span>
       <span class="body"><span class="title">主題</span>
       <span class="tag">科目</span></span></a></li>

     換月份:再複製一行 <p class="month">2026 年 09 月</p>
     和一組 <ul></ul>,整組放在最上面。
     ═══════════════════════════════════════════════════════ -->


  <p class="month">2026 年 08 月</p>
  <ul>

    <li><a href="20260815_計算機企劃.html">
      <span class="date">08/15</span>
      <span class="body"><span class="title">計算機企劃來龍去脈</span>
      <span class="tag">專題製作</span></span></a></li>

    <li><a href="20260810_reels流量分析.html">
      <span class="date">08/08</span>
      <span class="body"><span class="title">大家拍的10秒影片回饋</span>
      <span class="tag">專題製作</span></span></a></li>

  </ul>

</div>
</body>
</html>
