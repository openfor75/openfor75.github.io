<!DOCTYPE html>

<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>教學簡報索引</title>
<style>
  :root{
    --paper:#FBFCF8;
    --bar:#E4EFE2;
    --ink:#17251D;
    --ink-soft:#5C6E62;
    --rule:#B9CDBE;
    --stamp:#B3352B;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;
    line-height:1.6;
    padding:24px 16px 64px;
  }
  .sheet{max-width:860px;margin:0 auto}
  .back{display:inline-block;margin-bottom:14px;font-size:14px;color:var(--ink-soft);text-decoration:none}
  .back:hover{color:var(--stamp)}
  header{padding-bottom:10px;border-bottom:3px double var(--stamp)}
  h1{margin:0;font-size:clamp(22px,5vw,30px);letter-spacing:.14em;font-weight:700}
  .sub{margin:6px 0 0;font-size:14px;color:var(--ink-soft);letter-spacing:.05em}
  .group{
    margin:30px 0 0;padding:6px 4px;font-size:14px;font-weight:700;letter-spacing:.16em;
    color:var(--ink);border-bottom:1px solid var(--rule);
    display:flex;align-items:baseline;gap:10px;
  }
  .group small{font-weight:400;font-size:12.5px;letter-spacing:.06em;color:var(--ink-soft)}
  ul{list-style:none;margin:0;padding:0}
  li a{
    display:flex;align-items:baseline;gap:14px;padding:13px 12px;
    text-decoration:none;color:inherit;
    border-bottom:1px solid var(--rule);border-left:3px solid transparent;
  }
  li:nth-child(odd) a{background:var(--bar)}
  li a:hover,li a:focus-visible{border-left-color:var(--stamp);outline:none;background:#fff}
  .date{
    flex:0 0 3.2em;font-family:ui-monospace,"SF Mono",Menlo,monospace;
    font-size:15px;color:var(--stamp);font-variant-numeric:tabular-nums;
  }
  .body{flex:1 1 auto;min-width:0}
  .title{display:block;font-size:16px;font-weight:600}
  .tag{display:inline-block;margin-top:3px;font-size:12px;letter-spacing:.08em;color:var(--ink-soft)}
</style>
</head>
