<script>
(function(){
"use strict";
var TEACHER=/[?&]teacher=1/.test(location.search);
var ANS={}, PICK={}, loaded=false, lastAt=null;
var ui={cls:"",no:"",tcls:"商二甲",onlyBad:true};
try{ Object.assign(ui,JSON.parse(localStorage.getItem("ylhc-status")||"{}")); }catch(e){}
function saveUi(){ try{ localStorage.setItem("ylhc-status",JSON.stringify(ui)); }catch(e){} }
function esc(s){ return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
function ng(s){ var m=String(s||"").match(/\d+/); return m?"第"+(+m[0])+"組":String(s||"").trim(); }
function len(s){ return String(s||"").replace(/\s/g,"").length; }
var CIRC="①②③④⑤⑥⑦⑧";

/* ---------- 合併同班同組（與 score.html／portfolio.html 同一套） ---------- */
function groups(){
  var G={};
  for(var k in ANS){
    var A=ANS[k]||{}, cls=String(A.cls||"").trim(), grp=ng(A.grp);
    if(!cls||!grp) continue;
    var id=cls+"|"+grp, g=G[id]||(G[id]={d:{},ph:{},keys:[]});
    g.keys.push(k);
    var D=A.d||{};
    for(var q in D){
      g.d[q]=g.d[q]||{};
      for(var f in D[q]){
        var t=String(D[q][f]==null?"":D[q][f]);
        if(t.trim().length>String(g.d[q][f]||"").trim().length) g.d[q][f]=t;
      }
    }
    String(A.ph||"").split(",").filter(Boolean).forEach(function(x){ g.ph[x]=1; });
    (PICK[k]||[]).forEach(function(x){ g.ph[x]=1; });
  }
  return G;
}
function val(g,q,k){ return String(((g.d[q]||{})[k])||"").trim(); }
function anyAns(g,q){ return q.f.some(function(f){ return val(g,q.id,f.k); }); }
/* 一題缺什麼：沒填的欄位、字數不足、缺照片 */
function lack(g,q){
  var why=[];
  var empty=q.f.filter(function(f){ return !val(g,q.id,f.k); });
  if(empty.length) why.push((empty.length>3?empty.slice(0,3).map(function(f){ return f.l; }).join("、")+" 等 "+empty.length+" 格":empty.map(function(f){ return f.l; }).join("、"))+"沒填");
  q.f.forEach(function(f){
    var n=val(g,q.id,f.k).length;
    if(f.min&&n&&n<f.min) why.push("「"+f.l+"」還差 "+(f.min-n)+" 字");
  });
  if(q.id.charAt(0)==="q"&&CFG.PHOTO_REQUIRED&&!g.ph[q.id]) why.push("缺照片");
  return why;
}
function pts(g,q){ var w=lack(g,q); return w.length?(anyAns(g,q)?1:0):2; }

function groupStatus(G,cls,n){
  var g=G[cls+"|第"+n+"組"]||{d:{},ph:{},keys:[]}, items=[];
  MOGU.forEach(function(q,i){
    var w=lack(g,q);
    items.push({t:"魔菇"+CIRC.charAt(i)+"　"+q.t,ok:!w.length,why:w.join("；")});
  });
  /* 三井：八關任選四關。先算做最好的四關，不夠四關就列「還要再做一關」 */
  var tried=MITSUI.filter(function(q){ return anyAns(g,q)||g.ph[q.id]; });
  tried.sort(function(a,b){ return pts(g,b)-pts(g,a) || lack(g,a).length-lack(g,b).length || a.id.localeCompare(b.id); });
  var top=tried.slice(0,4);
  top.forEach(function(q){
    var w=lack(g,q);
    items.push({t:"三井"+CIRC.charAt(+q.id.slice(1)-1)+"　"+q.t,ok:!w.length,why:w.join("；")});
  });
  for(var i=top.length;i<4;i++) items.push({t:"三井第 "+(i+1)+" 關",ok:false,why:"還沒做（八關任選一關）"});
  return {items:items,has:g.keys.length>0,mo:items.slice(0,5).filter(function(x){ return x.ok; }).length,
          mi:items.slice(5).filter(function(x){ return x.ok; }).length};
}
function reflOf(cls,s){
  var me=(cls+"-"+s.no).replace(/[.#$\[\]\/\s]/g,""), list=[];
  for(var k in ANS){
    var A=ANS[k]||{}; if(String(A.cls||"").trim()!==cls) continue;
    var R=A.rf||{};
    for(var rid in R){ var x=R[rid]||{}; if(rid===me||String(x.nm||"").trim()===s.name) list.push(x); }
  }
  list.sort(function(a,b){ return (+b.at||0)-(+a.at||0); });
  var o={};
  CFG.REFL.forEach(function(r){
    o[r.k]="";
    for(var i=0;i<list.length;i++) if(String(list[i][r.k]||"").trim()){ o[r.k]=String(list[i][r.k]); break; }
  });
  return o;
}
function personStatus(cls,s){
  var r=reflOf(cls,s);
  return CFG.REFL.map(function(x){
    var n=len(r[x.k]);
    return {t:x.l,ok:n>=x.min,n:n,min:x.min,why:n?"還差 "+(x.min-n)+" 字（目前 "+n+" ／ "+x.min+"）":"還沒寫（至少 "+x.min+" 字）"};
  });
}
function everyone(cls){
  var G=groups(), gs={};
  for(var n=1;n<=7;n++) gs[n]=groupStatus(G,cls,n);
  return {gs:gs,list:STUDENTS[cls].map(function(s){
    var me=personStatus(cls,s), gr=gs[s.grp];
    var miss=me.filter(function(x){ return !x.ok; }).length+gr.items.filter(function(x){ return !x.ok; }).length;
    return {s:s,me:me,gr:gr,miss:miss,total:me.length+gr.items.length};
  })};
}

/* ---------- 學生畫面 ---------- */
function li(x){ return '<li class="'+(x.ok?"ok":"")+'"><i>'+(x.ok?"✓":"")+'</i><div><b>'+esc(x.t)+'</b><span>'+esc(x.why||"")+'</span></div></li>'; }
function listBlock(title,items,note){
  var bad=items.filter(function(x){ return !x.ok; }), good=items.filter(function(x){ return x.ok; });
  var h=['<div class="sec"><span>'+esc(title)+'</span><span>'+good.length+' / '+items.length+'</span></div>'];
  if(note) h.push('<p class="sub" style="margin:0 0 8px">'+note+'</p>');
  if(bad.length) h.push('<ul class="todo">'+bad.map(li).join("")+'</ul>');
  else h.push('<div class="allok">這部分全部完成 ✓</div>');
  if(good.length&&bad.length) h.push('<details class="done"><summary>已完成 '+good.length+' 項</summary><ul class="todo">'+good.map(li).join("")+'</ul></details>');
  return h.join("");
}
function studentView(){
  var h=['<div class="narrow">'];
  h.push('<div class="panel"><h2>我還差什麼？</h2><p class="sub">選好就看得到。紅色的是還沒完成的，照著做完就好。</p>');
  h.push('<div class="two"><div class="f"><label for="s-cls">班級</label><select id="s-cls"><option value="">請選擇</option>');
  Object.keys(STUDENTS).forEach(function(c){ h.push('<option'+(ui.cls===c?" selected":"")+'>'+esc(c)+'</option>'); });
  h.push('</select></div><div class="f"><label for="s-no">座號　姓名</label><select id="s-no"'+(ui.cls?"":" disabled")+'><option value="">'+(ui.cls?"請選擇":"先選班級")+'</option>');
  (STUDENTS[ui.cls]||[]).forEach(function(s){ h.push('<option value="'+esc(s.no)+'"'+(ui.no===s.no?" selected":"")+'>'+esc(s.no+"　"+s.name)+'</option>'); });
  h.push('</select></div></div></div>');
  var s=(STUDENTS[ui.cls]||[]).filter(function(x){ return x.no===ui.no; })[0];
  if(s&&loaded){
    var G=groups(), gr=groupStatus(G,ui.cls,s.grp), me=personStatus(ui.cls,s);
    var all=me.concat(gr.items), ok=all.filter(function(x){ return x.ok; }).length, p=Math.round(ok/all.length*100);
    var mates=STUDENTS[ui.cls].filter(function(x){ return x.grp===s.grp&&x.no!==s.no; }).map(function(x){ return x.name; }).join("、");
    h.push('<div class="panel"><div class="me"><div class="ring" style="--p:'+p+';--c:'+(p===100?"var(--ok)":"var(--accent)")+'"><span><div>'+ok+'/'+all.length+'<small>已完成</small></div></span></div>');
    h.push('<div><h3>'+esc(s.name)+'</h3><p>'+esc(ui.cls+"　"+s.no+" 號　第 "+s.grp+" 組")+'</p></div></div>');
    if(ok===all.length) h.push('<div class="allok">全部完成了，辛苦了！</div>');
    h.push(listBlock("我自己要寫的（個人心得）",me,"只有你自己能寫，組員幫不了你。字數不算空白和換行。"));
    h.push(listBlock("我們這組要一起完成的",gr.items,"組員：<b>"+esc(mates)+"</b>。任何一個人補上，全組都算完成。"+(gr.has?"":"<br><b style=\"color:var(--accent)\">雲端找不到你們這組的紀錄，請跟老師說。</b>")));
    if(ok<all.length) h.push('<div style="margin-top:16px"><a class="btn go" href="'+esc(CFG.MAKEUP_URL)+'">去補強頁完成它</a></div>');
    h.push('</div>');
  }
  h.push('</div>');
  return h.join("");
}

/* ---------- 老師畫面 ---------- */
function teacherView(){
  var E=everyone(ui.tcls), L=E.list, h=[];
  h.push('<div class="bar">');
  Object.keys(STUDENTS).forEach(function(c){ h.push('<button data-tc="'+esc(c)+'" class="'+(ui.tcls===c?"on":"")+'">'+esc(c)+'</button>'); });
  h.push('<label style="display:flex;gap:6px;align-items:center;font-size:14px;font-weight:600;margin-left:6px"><input type="checkbox" id="onlybad"'+(ui.onlyBad?" checked":"")+'>只看未完成</label>');
  h.push('<span style="flex:1"></span><button id="copy">複製未完成名單（貼 LINE）</button><button id="prt">列印</button><span id="st"></span></div>');

  var done=L.filter(function(x){ return !x.miss; }).length;
  var reflBad=L.filter(function(x){ return x.me.some(function(m){ return !m.ok; }); }).length;
  var gBad=Object.keys(E.gs).filter(function(n){ return E.gs[n].items.some(function(x){ return !x.ok; }); }).length;
  h.push('<div class="tiles">');
  h.push('<div class="tile"><b>'+L.length+'</b><span>全班人數</span></div>');
  h.push('<div class="tile '+(done===L.length?"good":"")+'"><b>'+done+'</b><span>全部完成</span></div>');
  h.push('<div class="tile '+(reflBad?"bad":"good")+'"><b>'+reflBad+'</b><span>個人心得未完成（人）</span></div>');
  h.push('<div class="tile '+(gBad?"bad":"good")+'"><b>'+gBad+'</b><span>小組任務未完成（組）</span></div>');
  h.push('</div>');

  /* 小組 */
  h.push('<div class="card"><h3>小組任務　<small>任何一位組員補上，全組都算</small></h3><div class="tw"><table><tr><th>組別</th><th class="c">魔菇 5 題</th><th class="c">三井 4 關</th><th>還缺什麼</th></tr>');
  for(var n=1;n<=7;n++){
    var g=E.gs[n], bad=g.items.filter(function(x){ return !x.ok; });
    if(ui.onlyBad&&!bad.length) continue;
    var mem=STUDENTS[ui.tcls].filter(function(x){ return x.grp===n; }).map(function(x){ return x.name; }).join("、");
    h.push('<tr><td style="white-space:nowrap"><b>第 '+n+' 組</b><div class="miss">'+esc(mem)+'</div></td>');
    h.push('<td class="c">'+(g.mo===5?'<span class="ck">✓</span>':'<span class="x">'+g.mo+' / 5</span>')+'</td>');
    h.push('<td class="c">'+(g.mi===4?'<span class="ck">✓</span>':'<span class="x">'+g.mi+' / 4</span>')+'</td>');
    h.push('<td class="miss">'+(bad.length?bad.map(function(x){ return '<div><b>'+esc(x.t)+'</b>　<em>'+esc(x.why)+'</em></div>'; }).join(""):'<span class="pill ok">完成</span>')+(g.has?"":'<div><em>雲端沒有這組的紀錄</em></div>')+'</td></tr>');
  }
  h.push('</table></div></div>');

  /* 個人 */
  h.push('<div class="card"><h3>個人心得　<small>字數不算空白和換行</small></h3><div class="tw"><table><tr><th>座號</th><th>姓名</th><th class="c">組</th>');
  CFG.REFL.forEach(function(r){ h.push('<th class="c">'+esc(r.l.replace("今天",""))+'<br>'+r.min+' 字</th>'); });
  h.push('<th class="c">小組</th><th class="c">狀態</th></tr>');
  L.forEach(function(x){
    if(ui.onlyBad&&!x.miss) return;
    var gb=x.gr.items.filter(function(i){ return !i.ok; }).length;
    h.push('<tr><td>'+esc(x.s.no)+'</td><td style="white-space:nowrap">'+esc(x.s.name)+'</td><td class="c">'+x.s.grp+'</td>');
    x.me.forEach(function(m){ h.push('<td class="c">'+(m.ok?'<span class="ck">✓</span>':'<span class="x">'+(m.n?m.n+' 字':'未寫')+'</span>')+'</td>'); });
    h.push('<td class="c">'+(gb?'<span class="x">缺 '+gb+'</span>':'<span class="ck">✓</span>')+'</td>');
    h.push('<td class="c">'+(x.miss?'<span class="pill bad">還差 '+x.miss+' 項</span>':'<span class="pill ok">完成</span>')+'</td></tr>');
  });
  h.push('</table></div></div>');
  return h.join("");
}
function lineText(){
  var E=everyone(ui.tcls), L=[], url=new URL(CFG.MAKEUP_URL,location.href).href, st=new URL("status.html",location.href).href;
  L.push("【"+ui.tcls+"　職場體驗　未完成名單】");
  L.push("截止："+CFG.DEADLINE_TEXT);
  L.push("查自己還差什麼："+st);
  L.push("補強："+url);
  var pr=E.list.filter(function(x){ return x.me.some(function(m){ return !m.ok; }); });
  L.push("");
  L.push("▍個人心得（"+pr.length+" 人）");
  pr.forEach(function(x){
    L.push(x.s.no+" "+x.s.name+"："+x.me.filter(function(m){ return !m.ok; }).map(function(m){ return m.t.replace("今天","")+(m.n?"差 "+(m.min-m.n)+" 字":"未寫"); }).join("、"));
  });
  if(!pr.length) L.push("全部完成");
  L.push("");
  var gl=[];
  for(var n=1;n<=7;n++){
    var bad=E.gs[n].items.filter(function(x){ return !x.ok; });
    if(bad.length) gl.push("第"+n+"組："+bad.map(function(x){ return x.t.replace("　"," ")+"（"+x.why+"）"; }).join("、"));
  }
  L.push("▍小組任務（"+gl.length+" 組）");
  L=L.concat(gl.length?gl:["全部完成"]);
  return L.join("\n");
}

/* ---------- 共用 ---------- */
function render(){
  var app=document.getElementById("app");
  if(!loaded){ app.innerHTML='<p class="sub">讀取中⋯</p>'; return; }
  var a=document.activeElement&&document.activeElement.id;
  app.innerHTML=(TEACHER?teacherView():studentView())+
    '<p class="foot">'+(lastAt?"資料更新於 "+lastAt.toLocaleTimeString("zh-TW",{hour:"2-digit",minute:"2-digit"})+"　":"")+
    (TEACHER?'<a href="status.html">學生檢視</a>':'<a href="status.html?teacher=1">老師檢視</a>')+'</p>';
  if(a&&document.getElementById(a)) document.getElementById(a).focus();
}
function clock(){
  var d=CFG.DEADLINE-new Date(), el=document.getElementById("dlc");
  if(d<=0){ el.textContent="已截止"; return; }
  var day=Math.floor(d/86400000), hr=Math.floor(d%86400000/3600000), mi=Math.floor(d%3600000/60000);
  el.textContent=day?("剩 "+day+" 天 "+hr+" 小時"):("剩 "+hr+" 小時 "+mi+" 分");
  document.getElementById("dlt").textContent="補交截止 "+CFG.DEADLINE_TEXT;
}
document.addEventListener("change",function(e){
  var t=e.target;
  if(t.id==="s-cls"){ ui.cls=t.value; ui.no=""; saveUi(); render(); }
  else if(t.id==="s-no"){ ui.no=t.value; saveUi(); render(); }
  else if(t.id==="onlybad"){ ui.onlyBad=t.checked; saveUi(); render(); }
});
document.addEventListener("click",function(e){
  var b=e.target.closest("button"); if(!b) return;
  if(b.dataset.tc){ ui.tcls=b.dataset.tc; saveUi(); render(); }
  else if(b.id==="prt") window.print();
  else if(b.id==="copy"){
    var txt=lineText(), st=document.getElementById("st");
    var ok=function(){ st.textContent="已複製"; setTimeout(function(){ st.textContent=""; },2000); };
    if(navigator.clipboard&&navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(ok).catch(fb); else fb();
    function fb(){ var ta=document.createElement("textarea"); ta.value=txt; document.body.appendChild(ta); ta.select();
      try{ document.execCommand("copy"); ok(); }catch(x){ st.textContent="複製失敗"; } ta.remove(); }
  }
});

/* ---------- 資料：答案即時監聽；照片只查「有沒有」，不下載照片本體 ---------- */
var picT=null;
function loadPicKeys(){
  var base=FB_CONFIG.databaseURL+"/e/"+EVENT_ID+"/pic/";
  return fetch(base+".json?shallow=true").then(function(r){ return r.json(); }).then(function(o){
    var ks=Object.keys(o||{});
    return Promise.all(ks.map(function(k){
      return fetch(base+encodeURIComponent(k)+".json?shallow=true").then(function(r){ return r.json(); })
        .then(function(p){ PICK[k]=Object.keys(p||{}).filter(function(z){ return z.indexOf("sheet")!==0; }); });
    }));
  }).catch(function(){});
}
try{
  firebase.initializeApp(FB_CONFIG);
  var first=true;
  firebase.database().ref("e/"+EVENT_ID+"/ans").on("value",function(s){
    ANS=s.val()||{}; lastAt=new Date();
    clearTimeout(picT);
    picT=setTimeout(function(){ loadPicKeys().then(function(){ loaded=true; render(); }); },first?0:1500);
    first=false;
  });
}catch(e){ document.getElementById("app").innerHTML='<p class="sub">連線失敗：'+esc(e.message)+'</p>'; }
clock(); setInterval(clock,30000);
})();
</script>
