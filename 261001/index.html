<title>職場體驗偵察任務</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=IBM+Plex+Mono:wght@500;600&family=Noto+Sans+TC:wght@400;500;700;900&display=swap">
<script src="https://cdn.jsdelivr.net/npm/firebase@10.12.2/firebase-app-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/firebase@10.12.2/firebase-database-compat.js"></script>

<style>
:root{
  --paper:#fbfaf7;--surface:#fff;--surface-2:#f2efe9;--line:#ddd7cc;--line-soft:#eae5db;
  --ink:#15181d;--ink-2:#4b5158;--ink-3:#787f87;
  --accent:#dd4f1f;--accent-soft:#fdeee7;--on-accent:#fff;
  --sea:#14566b;--sea-soft:#e4eff3;
  --gold:#9a6c00;--gold-soft:#fbf1d8;
  --ok:#1d6b45;--ok-soft:#e1f0e8;
  --shadow:0 1px 2px rgba(21,24,29,.06),0 6px 20px rgba(21,24,29,.08);
  --shadow-lg:0 2px 4px rgba(21,24,29,.08),0 14px 36px rgba(21,24,29,.12);
  --sans:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --disp:"Archivo Black","Noto Sans TC",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#14161a;--surface:#1d2026;--surface-2:#252930;--line:#353a43;--line-soft:#2b3038;
  --ink:#eef0f3;--ink-2:#b3bac2;--ink-3:#8a9199;
  --accent:#ff8154;--accent-soft:#33201a;--on-accent:#14161a;
  --sea:#79b9cf;--sea-soft:#182a31;--gold:#e5b458;--gold-soft:#2e2718;
  --ok:#6fc79b;--ok-soft:#16281f;
  --shadow:0 1px 2px rgba(0,0,0,.5),0 6px 20px rgba(0,0,0,.4);
  --shadow-lg:0 2px 4px rgba(0,0,0,.5),0 14px 36px rgba(0,0,0,.5);
}}
:root[data-theme="dark"]{
  --paper:#14161a;--surface:#1d2026;--surface-2:#252930;--line:#353a43;--line-soft:#2b3038;
  --ink:#eef0f3;--ink-2:#b3bac2;--ink-3:#8a9199;
  --accent:#ff8154;--accent-soft:#33201a;--on-accent:#14161a;
  --sea:#79b9cf;--sea-soft:#182a31;--gold:#e5b458;--gold-soft:#2e2718;
  --ok:#6fc79b;--ok-soft:#16281f;
  --shadow:0 1px 2px rgba(0,0,0,.5),0 6px 20px rgba(0,0,0,.4);
  --shadow-lg:0 2px 4px rgba(0,0,0,.5),0 14px 36px rgba(0,0,0,.5);
}

*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:17px;line-height:1.7;-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%}
#app{max-width:680px;margin:0 auto;padding:0 16px 150px}

/* HUD */
.hud{position:sticky;top:0;z-index:50;background:var(--ink);color:#fff;margin:0 -16px;box-shadow:var(--shadow)}
.hud-in{max-width:680px;margin:0 auto;padding:9px 16px;display:flex;align-items:center;gap:14px}
.hud .lab{font-size:10px;letter-spacing:.14em;opacity:.6;display:block;line-height:1.3}
.hud .clock{font-family:var(--mono);font-size:23px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.1}
.hud .clock.warn{color:#ff9d6e}
.hud .rank{margin-left:auto;text-align:right}
.hud .pts{font-family:var(--disp);font-size:29px;line-height:1;letter-spacing:-.02em}
.hud .pts small{font-size:13px;opacity:.55;font-family:var(--mono)}
.ticker{background:rgba(255,255,255,.08);overflow:hidden;height:0;transition:height .3s}
.ticker.on{height:30px}
.ticker div{max-width:680px;margin:0 auto;padding:5px 16px;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;opacity:.9}
.ticker b{color:#ffb38a;font-weight:600}

/* mast */
header.mast{padding:30px 0 18px}
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.16em;color:var(--ink-3);margin:0 0 9px;text-transform:uppercase}
h1{font-weight:900;font-size:clamp(31px,8.4vw,48px);line-height:1.08;margin:0 0 12px;letter-spacing:-.02em}
h1 em{font-style:normal;color:var(--accent)}
.lede{color:var(--ink-2);margin:0 0 18px;font-size:16px}
.rules{background:var(--sea-soft);border-radius:14px;padding:15px 17px;margin-bottom:8px}
.rules h3{margin:0 0 7px;font-size:15.5px;font-weight:700;color:var(--sea)}
.rules ol{margin:0;padding-left:19px;font-size:14.5px;color:var(--ink-2)}
.rules li{margin-bottom:4px}
.rules b{color:var(--ink)}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:17px;margin:13px 0;box-shadow:var(--shadow)}
.panel h2{margin:0 0 3px;font-size:18.5px;font-weight:700}
.panel p.sub{margin:0 0 13px;font-size:14px;color:var(--ink-2)}

.f{margin-bottom:11px}
.f label{display:block;font-size:13.5px;font-weight:500;color:var(--ink-2);margin-bottom:4px}
.f input,.f textarea{width:100%;font-family:inherit;font-size:17px;line-height:1.6;color:var(--ink);background:var(--surface-2);border:2px solid transparent;border-radius:10px;padding:10px 12px;resize:vertical}
.f textarea{min-height:78px}
.f input:focus,.f textarea:focus{outline:none;border-color:var(--accent);background:var(--surface)}
.f input::placeholder,.f textarea::placeholder{color:var(--ink-3);opacity:.7}
.two{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.three{display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px}
.cnt{font-family:var(--mono);font-size:11px;color:var(--ink-3);text-align:right;margin-top:2px}
.cnt.ok{color:var(--ok);font-weight:600}
.codest{font-size:13px;color:var(--ink-3);background:var(--surface-2);border-radius:9px;padding:8px 11px;margin-top:2px}
.codest.ok{background:var(--ok-soft);color:var(--ok);font-weight:600}
.prev{background:var(--sea);color:#fff;border-radius:12px;padding:12px 15px;margin:14px 0 0;font-size:14px;line-height:1.6}
.prev b{display:inline-block;margin-right:6px}
.prev code{font-family:var(--mono);font-size:12.5px;background:rgba(255,255,255,.18);padding:1px 6px;border-radius:5px}
.mic{background:var(--gold-soft);color:var(--gold);border-radius:10px;padding:10px 13px;font-size:13.5px;margin:12px 0 0;font-weight:500}

button{font-family:inherit;font-size:16.5px;font-weight:700;padding:13px 22px;border-radius:12px;border:none;cursor:pointer;transition:transform .08s}
button:active{transform:scale(.98)}
button.big{display:block;width:100%;background:var(--accent);color:var(--on-accent);box-shadow:var(--shadow);font-size:18.5px;padding:16px}
button.big:disabled{background:var(--line);color:var(--ink-3);box-shadow:none;cursor:not-allowed}
button:focus-visible{outline:3px solid var(--sea);outline-offset:2px}

/* stage tabs */
.stages{display:flex;gap:7px;margin:16px 0 4px}
.stages button{flex:1;padding:11px 6px;border-radius:12px;background:var(--surface);border:2px solid var(--line);color:var(--ink-3);font-size:14.5px;box-shadow:none}
.stages button.on{background:var(--ink);border-color:var(--ink);color:#fff}
.stages button b{display:block;font-family:var(--mono);font-size:11px;font-weight:500;opacity:.75}

/* quests */
.quest{background:var(--surface);border:1px solid var(--line);border-radius:16px;margin:12px 0;box-shadow:var(--shadow);overflow:hidden}
.quest.done{border-color:var(--ok);box-shadow:0 0 0 2px var(--ok-soft),var(--shadow)}
.qhead{display:flex;align-items:center;gap:12px;padding:15px 17px;cursor:pointer;user-select:none}
.qnum{font-family:var(--disp);font-size:18px;width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--accent);color:var(--on-accent);flex:none;line-height:1}
.quest.done .qnum{background:var(--ok)}
.qt{flex:1;min-width:0}
.qt b{display:block;font-size:18px;font-weight:700;line-height:1.3}
.qt span{display:block;font-size:13px;color:var(--ink-3);margin-top:1px}
.qpts{font-family:var(--mono);font-size:13.5px;font-weight:600;color:var(--ink-3);white-space:nowrap}
.quest.done .qpts{color:var(--ok)}
.qbody{padding:0 17px 18px;border-top:1px solid var(--line-soft);display:none}
.quest.open .qbody{display:block}
.mission{background:var(--accent-soft);border-radius:12px;padding:12px 14px;margin:15px 0;font-size:15px}
.mission b{color:var(--accent)}

/* 照片 */
.ph{margin-bottom:13px}
.ph img{display:block;width:100%;max-width:100%;border-radius:11px;margin-bottom:7px;border:1px solid var(--line)}
.ph label{display:flex;align-items:center;justify-content:center;gap:9px;background:var(--surface-2);border:2px dashed var(--line);border-radius:11px;padding:14px;cursor:pointer;font-size:15px;font-weight:600;color:var(--ink-2)}
.ph.has label{border-style:solid;border-color:var(--ok);background:var(--ok-soft);color:var(--ok);padding:9px;font-size:13.5px}
.ph input{position:absolute;opacity:0;width:0;height:0}
.ph .up{font-family:var(--mono);font-size:11.5px;color:var(--ink-3);text-align:center;margin-top:5px}

.gpsbar{display:flex;align-items:center;gap:9px;background:var(--sea-soft);color:var(--sea);border-radius:11px;padding:11px 14px;margin-bottom:9px;font-size:14.5px;font-weight:500}
.gpsbar.hit{background:var(--ok-soft);color:var(--ok)}

.terms{background:var(--gold-soft);border-radius:12px;padding:12px 14px;margin-top:13px;font-size:14px}
.terms b{color:var(--gold)}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px}
.chips i{font-style:normal;font-size:12.5px;padding:3px 9px;border-radius:99px;background:var(--surface);border:1px solid var(--line);color:var(--ink-3)}
.chips i.hit{background:var(--gold);border-color:var(--gold);color:#fff;font-weight:600}

/* 班際對抗 */
.vs{background:var(--ink);color:#fff;border-radius:14px;padding:15px 17px;margin:13px 0;box-shadow:var(--shadow)}
.vs h3{margin:0 0 11px;font-size:15px;font-weight:700;display:flex;align-items:center;gap:8px}
.vs h3 .live{width:8px;height:8px;border-radius:99px;background:#43d18b;animation:pulse 1.6s infinite}
.vs-in{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px}
.vs-c{text-align:center;min-width:0}
.vs-c .nm{font-size:15px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vs-c .av{font-family:var(--disp);font-size:36px;line-height:1.05;letter-spacing:-.02em}
.vs-c.win .av{color:#ffb38a}
.vs-c .de{font-family:var(--mono);font-size:11.5px;opacity:.6;line-height:1.5}
.vs-mid{font-family:var(--disp);font-size:15px;opacity:.4}
.vs-foot{font-size:11.5px;opacity:.55;margin-top:10px;text-align:center;font-family:var(--mono)}

/* leaderboard */
.lb{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:var(--shadow);margin:13px 0}
.lb h3{margin:0;padding:13px 16px;font-size:16px;font-weight:700;background:var(--surface-2);display:flex;align-items:center;gap:8px}
.lb h3 .live{width:8px;height:8px;border-radius:99px;background:var(--ok);animation:pulse 1.6s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.lb ol{list-style:none;margin:0;padding:0}
.lb li{display:flex;align-items:center;gap:11px;padding:10px 16px;border-top:1px solid var(--line-soft);font-size:15px}
.lb li.me{background:var(--accent-soft);font-weight:700}
.lb .p{font-family:var(--disp);font-size:16px;width:26px;color:var(--ink-3)}
.lb li:nth-child(1) .p{color:var(--gold)}
.lb .n{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lb .s{font-family:var(--mono);font-weight:600;font-variant-numeric:tabular-nums}
.lb .st{font-style:normal;font-size:11.5px;color:var(--gold);font-weight:700;font-family:var(--mono)}
.lb .empty{padding:18px 16px;color:var(--ink-3);font-size:14.5px}

/* 加碼 */
.locked{background:var(--surface-2);border:2px dashed var(--line);border-radius:14px;padding:15px 17px;margin:13px 0;font-size:14.5px;color:var(--ink-2);text-align:center}
.locked b{color:var(--ink);font-size:16px}
.locked span{font-size:13px;color:var(--ink-3)}
.unlocked{background:var(--gold);color:#fff;border-radius:12px;padding:11px;margin:16px 0 0;text-align:center;font-weight:700;letter-spacing:.06em;box-shadow:var(--shadow)}
.bonusline{background:var(--gold);color:#fff;border-radius:10px;padding:9px 13px;margin-bottom:12px;font-weight:700;font-size:14.5px}

/* result */
.res{background:var(--ink);color:#fff;border-radius:16px;padding:21px;margin-top:20px;box-shadow:var(--shadow-lg)}
.res h2{margin:0 0 3px;font-size:21px;font-weight:900}
.res p{margin:0 0 14px;font-size:14px;opacity:.7}
.bigscore{font-family:var(--disp);font-size:64px;line-height:1;letter-spacing:-.03em;margin:5px 0 2px}
.bigscore small{font-size:21px;opacity:.5}
.bd{display:flex;margin:16px 0;border-radius:11px;overflow:hidden;font-size:12.5px}
.bd div{flex:1;padding:9px 6px;text-align:center;background:rgba(255,255,255,.08)}
.bd div+div{border-left:1px solid rgba(255,255,255,.14)}
.bd b{display:block;font-family:var(--mono);font-size:18px;font-weight:600}
.bd span{opacity:.6;font-size:11px}
.teach{font-size:12.5px;opacity:.6;margin:-6px 0 14px}
#out{width:100%;min-height:190px;font-family:var(--mono);font-size:12px;line-height:1.7;background:rgba(0,0,0,.28);border:1px solid rgba(255,255,255,.16);border-radius:11px;padding:12px;color:#fff;white-space:pre}
.btns{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.btns button{flex:1;min-width:125px}
.btns button.copy{background:var(--accent);color:var(--on-accent)}
.btns button.pr{background:rgba(255,255,255,.14);color:#fff}
.sync{font-family:var(--mono);font-size:11.5px;margin-top:9px;opacity:.6}

.tn{margin-top:30px;border-top:1px solid var(--line);padding-top:16px;font-size:14px;color:var(--ink-3)}
.tn summary{cursor:pointer;font-family:var(--mono);font-size:11.5px;letter-spacing:.1em;text-transform:uppercase}
.tn p{color:var(--ink-2)}
.tn table{width:100%;border-collapse:collapse;margin:11px 0;font-size:13.5px}
.tn th,.tn td{border:1px solid var(--line);padding:6px 9px;text-align:left}
.tn th{background:var(--surface-2);font-weight:600}
.tn code{font-family:var(--mono);font-size:12px;background:var(--surface-2);padding:1px 5px;border-radius:4px;word-break:break-all}
footer{margin-top:20px;color:var(--ink-3);font-size:12px;font-family:var(--mono)}

/* print 學習單 */
#sheet{display:none}
@media print{
  .hud,header.mast,.rules,.panel,.quest,.res,.tn,footer,button,.stages,.lb,.terms,.vs,.locked,.unlocked{display:none!important}
  #sheet{display:block!important}
  body{background:#fff;font-size:11pt;color:#000}
  #app{padding:0;max-width:none}
  #sheet h1{font-size:15pt;text-align:center;margin:0 0 3px;font-weight:700}
  #sheet .sub{text-align:center;font-size:10pt;margin:0 0 10px}
  #sheet table{width:100%;border-collapse:collapse;margin-bottom:9px;font-size:10pt}
  #sheet th,#sheet td{border:1px solid #000;padding:4px 7px;vertical-align:top}
  #sheet th{background:#eee;width:88px;font-weight:600;white-space:nowrap}
  #sheet .box{border:1px solid #000;padding:7px;min-height:150px;margin-bottom:9px;font-size:10pt}
  #sheet .box .h{font-weight:700;margin-bottom:5px;border-bottom:1px solid #999;padding-bottom:3px}
  #sheet .ph2{border:1px solid #000;height:230px;margin-bottom:9px;text-align:center;color:#666;font-size:9pt;overflow:hidden;position:relative}
  #sheet .ph2 img{width:100%;height:230px;object-fit:cover;display:block}
  #sheet .ph2 .cap{font-size:8pt;padding:2px}
  #sheet .ph2.blank{padding-top:105px}
  #sheet .pg{page-break-before:always}
  #sheet .sign{display:flex;gap:10px;margin-top:10px;font-size:10pt}
  #sheet .sign div{flex:1;border:1px solid #000;padding:6px;height:52px}
}

@media (max-width:480px){
  #app{padding:0 13px 150px}
  .hud{margin:0 -13px}.hud-in{padding:9px 13px}
  .three,.two{grid-template-columns:1fr}
  .vs-c .av{font-size:29px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

/* ---------- 計分 ---------- */
function qScore(qid){
  var q=Q(qid),sc=0;
  if(qid[0]==="x"){
    q.f.forEach(function(f){ var t=v(qid,f.k); if(f.min? t.length>=f.min : t.length>0) sc+=2; });
    return Math.min(10,sc);
  }
  var filled=q.f.every(function(f){return v(qid,f.k).length>0;});
  var mins=q.f.filter(function(f){return f.min;});
  var longEnough=mins.length?mins.every(function(f){return v(qid,f.k).length>=f.min;}):filled;
  if(qid[0]==="m"){ if(filled)sc+=3; if(longEnough)sc+=3; }        /* 魔菇 6 */
  else { if(st.photo[qid])sc+=3; if(filled)sc+=4; if(longEnough)sc+=3; }  /* 三井 10 */
  return sc;
}
function qMax(qid){return qid[0]==="m"?6:10;}
function unlocked(){ if(PREVIEW)return true; return (st.picked||[]).length===4&&(st.picked||[]).every(function(id){return qScore(id)===10;}); }
var lastUnlocked=false;
function justUnlocked(){
  var u=unlocked();
  if(u&&!lastUnlocked){ lastUnlocked=true; return true; }
  if(!u) lastUnlocked=false;
  return false;
}
function hits(){
  var t="";all().forEach(function(q){q.f.forEach(function(f){t+=v(q.id,f.k)+" ";});});
  return TERMS.filter(function(w){return t.indexOf(w)>=0;});
}
function tot(){
  var mo=MOGU.reduce(function(a,q){return a+qScore(q.id);},0);
  var mi=(PREVIEW?MITSUI.map(function(q){return q.id;}):(st.picked||[])).reduce(function(a,id){return a+qScore(id);},0);
  var te=Math.min(5,hits().length);
  var gp=GPS_ON?SPOTS.reduce(function(a,s){return a+(st.spots[s.name]?s.pts:0);},0):0;
  var bo=unlocked()?qScore("x1"):0;
  return {mo:mo,mi:mi,te:te,gp:gp,bo:bo,all:mo+mi+te+gp};
}

/* ---------- Firebase ---------- */
function fnv(str){
  var h=0x811c9dc5;
  for(var i=0;i<str.length;i++){ h^=str.charCodeAt(i); h=(h*0x01000193)>>>0; }
  return ("0000000"+h.toString(16)).slice(-8);
}
function okCode(){ return /^\d{4}$/.test(st.code); }
function gkey(){ return okCode() ? fnv(st.cls+"|"+st.grp+"|"+st.code) : ""; }

function initFB(){
  if(PREVIEW)return;
  if(!FB_CONFIG.databaseURL||typeof firebase==="undefined")return;
  try{
    firebase.initializeApp(FB_CONFIG);
    db=firebase.database();
    db.ref(".info/connected").on("value",function(s){ online=!!s.val(); paintSync(); });
    db.ref("e/"+EVENT_ID+"/board").on("value",function(s){
      var o=s.val()||{},arr=[];
      for(var k in o){ arr.push(Object.assign({k:k},o[k])); }
      arr.sort(function(a,b){return (b.total||0)-(a.total||0);});
      board=arr; render();
    });
    db.ref("e/"+EVENT_ID+"/feed").limitToLast(8).on("value",function(s){
      var o=s.val()||{},arr=[];
      for(var k in o) arr.push(o[k]);
      arr.sort(function(a,b){return (a.t||0)-(b.t||0);});
      feed=arr; paintTicker();
    });
  }catch(e){ db=null; }
}
function cleanD(){
  var o={};
  all().forEach(function(q){
    var row={},any=false;
    q.f.forEach(function(f){ var t=v(q.id,f.k); if(t){ row[f.k]=t.slice(0,1200); any=true; } });
    if(any) o[q.id]=row;
  });
  return o;
}

/* ---------- 照片 ---------- */
function shrink(file,cb){
  var fr=new FileReader();
  fr.onerror=function(){cb(null);};
  fr.onload=function(){
    var img=new Image();
    img.onerror=function(){cb(null);};
    img.onload=function(){
      var m=800,w=img.width||m,h=img.height||m,s=Math.min(1,m/Math.max(w,h));
      var c=document.createElement("canvas");
      c.width=Math.max(1,Math.round(w*s)); c.height=Math.max(1,Math.round(h*s));
      try{
        c.getContext("2d").drawImage(img,0,0,c.width,c.height);
        cb(c.toDataURL("image/jpeg",0.6));
      }catch(err){ cb(null); }
    };
    img.src=fr.result;
  };
  fr.readAsDataURL(file);
}
function pushPic(k,url){
  if(PREVIEW||!db||!okCode()) return;
  if(url.length>250000){ upState[k]="too-big"; paintUp(k); return; }
  upState[k]="up";
  paintUp(k);
  db.ref("e/"+EVENT_ID+"/pic/"+gkey()+"/"+k).set(url)
    .then(function(){ upState[k]="ok"; paintUp(k); })
    .catch(function(){ upState[k]="fail"; paintUp(k); });
}
function upText(k){
  if(!pics[k]) return "";
  if(!db||!okCode()) return "已存在手機裡";
  var s=upState[k];
  return s==="ok"?"已上傳":s==="up"?"上傳中⋯":s==="fail"?"上傳失敗，回校再傳":s==="too-big"?"檔案太大，只留在手機":"已存在手機裡";
}
function paintUp(k){
  var el=document.querySelector('[data-up="'+k+'"]');
  if(el) el.textContent=upText(k);
}

/* ---------- GPS ---------- */
function dist(a,b,c,d){
  var R=6371000,p=Math.PI/180;
  var x=Math.sin((c-a)*p/2),y=Math.sin((d-b)*p/2);
  var h=x*x+Math.cos(a*p)*Math.cos(c*p)*y*y;
  return 2*R*Math.asin(Math.sqrt(h));
}
var pos=null;
function startGPS(){
  if(!GPS_ON||!navigator.geolocation)return;
  navigator.geolocation.watchPosition(function(p){
    pos=p.coords;
    var slack=Math.min(pos.accuracy||0,20);
    SPOTS.forEach(function(s){
      var d=dist(pos.latitude,pos.longitude,s.lat,s.lng);
      if(d-slack<=s.r&&!st.spots[s.name]){ st.spots[s.name]=1; save(); push("抵達「"+s.name+"」"); render(); }
    });
    paintGPS();
  },function(){},{enableHighAccuracy:true,maximumAge:15000,timeout:20000});
}

/* ---------- 倒數 ---------- */
function clk(){
  var now=new Date(),diff=DEADLINE-now;
  if(now.toDateString()!==DEADLINE.toDateString()){
    var d=Math.ceil((new Date(2026,9,1)-new Date(now.getFullYear(),now.getMonth(),now.getDate()))/86400000);
    return {t:d>0?"10/1　還有 "+d+" 天":"任務已結束",w:false};
  }
  if(diff<=0)return {t:"集合時間到！",w:true};
  var m=Math.floor(diff/60000),s=Math.floor(diff%60000/1000);
  return {t:String(m).padStart(2,"0")+":"+String(s).padStart(2,"0"),w:m<15};
}

/* ---------- 班際對抗 ---------- */
function classCard(){
  if(!db||board.length<2) return "";
  var m={};
  board.forEach(function(b){
    var c=(b.cls||"").trim(); if(!c) return;
    m[c]=m[c]||{n:0,s:0,mo:0,mi:0,te:0,gp:0,top:-1,tn:""};
    var x=m[c];
    x.n++; x.s+=(b.total||0); x.mo+=(b.mo||0); x.mi+=(b.mi||0); x.te+=(b.te||0); x.gp+=(b.gp||0);
    if((b.total||0)>x.top){ x.top=b.total||0; x.tn=b.grp||""; }
  });
  var ks=Object.keys(m);
  if(ks.length<2) return "";
  ks.sort(function(a,b){ return (m[b].s/m[b].n)-(m[a].s/m[a].n); });
  var h=['<div class="vs"><h3><span class="live"></span>班際對抗</h3><div class="vs-in">'];
  [ks[0],ks[1]].forEach(function(c,i){
    var x=m[c],av=(x.s/x.n);
    if(i===1) h.push('<div class="vs-mid">VS</div>');
    h.push('<div class="vs-c'+(i===0?" win":"")+'">');
    h.push('<div class="nm">'+esc(c)+'</div>');
    h.push('<div class="av">'+av.toFixed(1)+'</div>');
    h.push('<div class="de">總分 '+x.s+' ／ '+x.n+' 組<br>最強 '+esc(x.tn)+' '+x.top+' 分</div>');
    h.push('</div>');
  });
  h.push('</div><div class="vs-foot">以平均分定勝負，兩班組數不同也公平</div></div>');
  return h.join("");
}

  h.push('<button data-stage="mitsui" class="'+(st.stage==="mitsui"?"on":"")+'">三井 OUTLET<b>'+T.mi+' / 40</b></button>');
  h.push('<button data-stage="refl" class="'+(st.stage==="refl"?"on":"")+'">心得與照片<b>各自寫</b></button>');
  h.push('</div>');

  if(st.stage==="mogu"){
    MOGU.forEach(function(q,i){ h.push(card(q,i+1)); });
  } else if(st.stage==="mitsui"){
    if(PREVIEW){
      h.push(gpsPanel());
      MITSUI.forEach(function(q,i){ h.push(card(q,i+1)); });
      h.push('<div class="unlocked">★　加碼關</div>');
      h.push(card(BONUS,"★"));
    } else if(!st.picked){
      h.push('<div class="panel"><h2>抽任務</h2><p class="sub">8 關裡抽 4 關，每組抽到的組合不一樣。抽完就不能重抽。'+(ready?"":"<br><b>要先填完班級、組別、組員和通行碼。</b>")+'</p>');
      h.push('<button class="big" id="draw"'+(ready?"":" disabled")+'>抽 4 個任務</button></div>');
    } else {
      h.push(gpsPanel());
      st.picked.forEach(function(id,i){ h.push(card(Q(id),i+1)); });
      if(unlocked()){
        h.push('<div class="unlocked">★　加碼關已解鎖</div>');
        h.push(card(BONUS,"★"));
      } else {
        h.push('<div class="locked"><b>加碼關．總經理的位子</b><br>四關全部拿到滿分才會打開。還差 '+(40-T.mi)+' 分。<br><span>加碼分不計入排名，不影響誰贏</span></div>');
      }
    }
  } else {
    h.push(reflPanel());
  }

  if(st.stage!=="refl"){
    var ht=hits();
    h.push('<div class="terms"><b>商業名詞加分　'+Math.min(5,ht.length)+' / 5</b>　每用對一個 +1');
    h.push('<div class="chips">');
    TERMS.forEach(function(w){h.push('<i class="'+(ht.indexOf(w)>=0?"hit":"")+'">'+esc(w)+'</i>');});
    h.push('</div></div>');
  }

  h.push('<div class="res"><h2>戰績</h2><p>填完按一下，貼到班級群組。</p>');
  h.push('<div class="bigscore">'+T.all+'<small> / '+MAX+'</small></div>');
  h.push('<div class="bd"><div><b>'+T.mo+'</b><span>魔菇 30</span></div><div><b>'+T.mi+'</b><span>三井 40</span></div><div><b>'+T.te+'</b><span>名詞 5</span></div>'+(GPS_ON?'<div><b>'+T.gp+'</b><span>打卡 '+GPS_MAX+'</span></div>':'')+'</div>');
  h.push('<p class="teach">準時集合 10 分、創意分 10 分由老師另計，全部加起來滿分 100。</p>');
  h.push('<div class="bonusline" id="bl"'+(T.bo?'':' hidden')+'>★　加碼關　'+T.bo+' / 10　（另計）</div>');
  h.push('<textarea id="out" readonly placeholder="按下面的「產生戰績」"></textarea>');
  h.push('<div class="btns"><button class="copy" id="gen">產生戰績</button><button class="pr" id="cp">複製</button><button class="pr" id="prt">列印學習單</button></div>');
  h.push('<div class="sync" id="sy"></div></div>');

  h.push('<details class="tn"><summary>老師用：計分方式</summary>');
  h.push('<table><tr><th>項目</th><th>配分</th><th>怎麼算</th></tr>');
  h.push('<tr><td>魔菇 5 題</td><td>30</td><td>每題 6（填滿 3＋字數 3），全班相同</td></tr>');
  h.push('<tr><td>三井 4 關</td><td>40</td><td>每關 10（照片 3＋填滿 4＋字數 3），抽籤</td></tr>');
  h.push('<tr><td>商業名詞</td><td>5</td><td>用對一個 +1，上限 5 個</td></tr>');
  h.push('<tr><td>定點打卡</td><td>'+(GPS_ON?GPS_MAX:"未啟用")+'</td><td>大門 1／古拉爵 1／特斯拉 1／摩天輪 2</td></tr>');
  h.push('<tr><td>準時集合</td><td>10</td><td>老師另計</td></tr>');
  h.push('<tr><td>創意分</td><td>10</td><td>老師另計</td></tr>');
  h.push('<tr><td><b>合計</b></td><td><b>100</b></td><td>加碼關 10 分不計入</td></tr></table>');
  h.push('<p><b>備案：</b>現場沒網路照樣能填，資料存在手機裡，有網路時才同步。照片也一樣。</p>');
  h.push('</details>');
  h.push('<footer>115 學年度第 1 學期　商業經營科職場體驗</footer>');

  document.getElementById("app").innerHTML=h.join("");
  paintTicker(); paintSync(); paintGPS(); buildSheet();
}

function gpsPanel(){
  if(!GPS_ON)return "";
  var got=SPOTS.filter(function(s){return st.spots[s.name];}).length;
  var h=['<div class="panel"><h2>打卡地圖　'+SPOTS.reduce(function(a,s){return a+(st.spots[s.name]?s.pts:0);},0)+' / '+GPS_MAX+'</h2>'];
  h.push('<p class="sub">走到這四個地方，手機會自己跳分，不用按任何東西。'+(got===SPOTS.length?"<b>四個都到齊了。</b>":"從大門走到摩天輪大約 600 公尺，先排好順序再出發。")+'</p>');
  SPOTS.forEach(function(s){
    var ok=st.spots[s.name];
    h.push('<div class="gpsbar'+(ok?" hit":"")+'" data-spot="'+esc(s.name)+'">'+
      (ok?"✓ "+esc(s.name)+"　＋"+s.pts+" 分"
         :"<b>"+esc(s.name)+"</b>　＋"+s.pts+" 分　<span class=\"dd\">定位中…</span>")+'</div>');
  });
  return h.join("")+'</div>';
}

function card(q,n){
  var sc=qScore(q.id),mx=qMax(q.id),open=st.open===q.id;
  var h=['<section class="quest'+(sc===mx?" done":"")+(open?" open":"")+'">'];
  h.push('<div class="qhead" data-q="'+q.id+'"><span class="qnum">'+n+'</span>');
  h.push('<span class="qt"><b>'+esc(q.t)+'</b><span>'+esc(q.s)+'</span></span>');
  h.push('<span class="qpts">'+sc+' / '+mx+'</span></div><div class="qbody">');
  h.push('<div class="mission">'+q.m+'</div>');
  if(q.id[0]==="q") h.push(photoBox(q.id,"拍照　＋3 分"));
  if(q.grid===3){ for(var g=0;g<3;g++){ h.push('<div class="three">'); q.f.slice(g*3,g*3+3).forEach(function(f){h.push(fld(q.id,f));}); h.push('</div>'); } }
  else q.f.forEach(function(f){h.push(fld(q.id,f));});
  h.push('</div></section>');
  return h.join("");
}
function photoBox(k,lab){
  var has=!!pics[k];
  var h=['<div class="ph'+(has?" has":"")+'">'];
  if(has) h.push('<img src="'+pics[k]+'" alt="">');
  h.push('<label for="pic-'+k+'"><input type="file" accept="image/*" capture="environment" id="pic-'+k+'" data-pic="'+k+'">');
  h.push('<span>'+(has?"✓ 已拍　點這裡重拍":lab)+'</span></label>');
  if(has) h.push('<div class="up" data-up="'+k+'">'+upText(k)+'</div>');
  h.push('</div>');
  return h.join("");
}
function fld(qid,f){
  var val=esc(v(qid,f.k)),id="f-"+qid+"-"+f.k;
  var s='<div class="f"><label for="'+id+'">'+esc(f.l)+'</label>';
  s+=f.t==="in"?'<input id="'+id+'" data-q="'+qid+'" data-k="'+f.k+'" value="'+val+'">'
               :'<textarea id="'+id+'" data-q="'+qid+'" data-k="'+f.k+'">'+val+'</textarea>';
  if(f.min){var n=v(qid,f.k).length;s+='<div class="cnt'+(n>=f.min?" ok":"")+'">'+n+' / '+f.min+' 字</div>';}
  return s+'</div>';
}
function reflPanel(){
  var h=['<div class="panel"><h2>學習單照片</h2><p class="sub">這兩張會直接印在學習單上，<b>不用再洗照片、不用剪貼</b>。挑最能代表那個地方的一張。</p>'];
  h.push(photoBox("sheetM","魔菇部落　選一張"));
  h.push(photoBox("sheetT","三井 OUTLET　選一張"));
  h.push('</div>');
  h.push('<div class="panel"><h2>個人心得</h2><p class="sub">這一段是<b>你自己</b>寫的，不會同步給同組的人，老師端也看不到。填完按「列印學習單」就是可以交的那一份。</p>');
  h.push('<div class="f"><label for="r-a">今天印象最深的一件事</label><textarea id="r-a" data-r="a" placeholder="一個畫面、一句話、一個數字都可以">'+esc(st.refl.a)+'</textarea>'+cntR("a",50)+'</div>');
  h.push('<div class="f"><label for="r-b">參訪心得（至少 400 字）</label><textarea id="r-b" data-r="b" style="min-height:220px" placeholder="從上面的任務紀錄裡找素材：你原本以為什麼，後來發現什麼？哪個觀察讓你改變想法？">'+esc(st.refl.b)+'</textarea>'+cntR("b",400)+'</div>');
  h.push('<div class="f"><label for="r-c">對這次活動的建議</label><textarea id="r-c" data-r="c" placeholder="行程、時間、地點、任務設計都可以講">'+esc(st.refl.c)+'</textarea>'+cntR("c",30)+'</div>');
  h.push('</div>');
  return h.join("");
}
function cntR(k,min){var n=(st.refl[k]||"").trim().length;return '<div class="cnt'+(n>=min?" ok":"")+'">'+n+' / '+min+' 字</div>';}

/* ---------- paints ---------- */
function paintTicker(){
  var el=document.getElementById("tick");if(!el)return;
  if(!feed.length){el.classList.remove("on");return;}
  el.classList.add("on");
  var f=feed[feed.length-1];
  el.firstChild.innerHTML='<b>'+esc((f.c||"")+" "+(f.g||""))+'</b>　'+esc(f.x);
}
function paintSync(){
  var el=document.getElementById("sy");if(!el)return;
  el.textContent=!db?"單機模式　分數只存在這支手機"
    :(!okCode()?"尚未輸入通行碼　分數只存在這支手機"
    :(online?"已連線　分數即時同步":"離線中　有網路時會自動補傳"));
}
function paintGPS(){
  var els=document.querySelectorAll(".gpsbar .dd");
  for(var i=0;i<els.length;i++){
    (function(el){
      var bar=el.parentNode; while(bar&&!bar.dataset.spot) bar=bar.parentNode;
      if(!bar)return;
      var sp=SPOTS.filter(function(s){return s.name===bar.dataset.spot;})[0];
      if(!sp||!pos){el.textContent="定位中…";return;}
      var d=Math.round(dist(pos.latitude,pos.longitude,sp.lat,sp.lng));
      el.textContent="距離 "+d+" 公尺"+(pos.accuracy?("，誤差 ±"+Math.round(pos.accuracy)):"");
    })(els[i]);
  }
}
function paintBonus(){
  var el=document.getElementById("bl"); if(!el)return;
  var bo=tot().bo;
  el.hidden=!bo;
  el.textContent="★　加碼關　"+bo+" / 10　（另計）";
}

/* ---------- 學習單 ---------- */
function buildSheet(){
  var T=tot(),h=[];
  h.push('<h1>國立員林家商 115 學年度第 1 學期商業經營科</h1>');
  h.push('<h1>學生業界實習和職場體驗計畫－「職場體驗」學習心得</h1>');
  h.push('<p class="sub">魔菇部落生態休閒農場／三中港奧特萊斯股份有限公司</p>');
  h.push('<table><tr><th>班級</th><td>'+esc(st.cls)+'</td><th>姓名</th><td>'+esc(st.name)+'</td><th>組別</th><td>'+esc(st.grp)+'</td></tr>');
  h.push('<tr><th>參訪日期</th><td>115年10月1日</td><th>課程名稱</th><td colspan="3">專題製作－職場體驗</td></tr>');
  h.push('<tr><th>組員</th><td colspan="5">'+esc(st.mem)+'</td></tr>');
  h.push('<tr><th>任務得分</th><td colspan="5">'+T.all+' / '+MAX+'　（魔菇 '+T.mo+'／三井 '+T.mi+'／名詞 '+T.te+(GPS_ON?'／打卡 '+T.gp:'')+'）</td></tr></table>');

  h.push('<div class="box"><div class="h">參訪內容　魔菇部落生態休閒農場</div>');
  MOGU.forEach(function(q){ h.push('<p><b>'+esc(q.t)+'</b>　'+q.f.map(function(f){return esc(v(q.id,f.k));}).filter(Boolean).join('／')+'</p>'); });
  h.push('</div>');

  h.push('<div class="box"><div class="h">參訪內容　三中港奧特萊斯股份有限公司</div>');
  (st.picked||[]).forEach(function(id){ var q=Q(id);
    h.push('<p><b>'+esc(q.t)+'</b>　'+q.f.map(function(f){return esc(v(id,f.k));}).filter(Boolean).join('／')+'</p>'); });
  h.push('</div>');

  if(T.bo){
    h.push('<div class="box" style="min-height:0"><div class="h">加碼關　總經理的位子（'+T.bo+'/10）</div>');
    BONUS.f.forEach(function(f){ var t=v("x1",f.k); if(t) h.push('<p><b>'+esc(f.l)+'</b>　'+esc(t)+'</p>'); });
    h.push('</div>');
  }

  h.push('<div class="box"><div class="h">印象最深的一件事</div><p>'+esc(st.refl.a)+'</p></div>');
  h.push('<div class="box" style="min-height:330px"><div class="h">參訪心得</div><p>'+esc(st.refl.b).replace(/\n/g,"<br>")+'</p></div>');
  h.push('<div class="box" style="min-height:90px"><div class="h">建議</div><p>'+esc(st.refl.c)+'</p></div>');
  h.push('<div class="sign"><div>授課老師簽章</div><div>科主任簽章</div></div>');

  h.push('<div class="pg"><h1>115 年度商業經營科「職場體驗」活動相片紀錄</h1>');
  h.push(sheetPhoto("sheetM","魔菇部落生態休閒農場"));
  h.push(sheetPhoto("sheetT","三中港奧特萊斯股份有限公司"));
  h.push('</div>');
  document.getElementById("sheet").innerHTML=h.join("");
}
function sheetPhoto(k,cap){
  if(pics[k]) return '<div class="ph2"><img src="'+pics[k]+'" alt=""></div><div class="cap">'+esc(cap)+'</div>';
  return '<div class="ph2 blank">照片黏貼處（'+esc(cap)+'）</div>';
}

/* ---------- events ---------- */
document.addEventListener("input",function(e){
  var el=e.target;
  if(el.dataset.s){
    var val=el.value;
    if(el.dataset.s==="code"){ val=val.replace(/\D/g,"").slice(0,4); el.value=val; }
    var was=st[el.dataset.s]; st[el.dataset.s]=val; save();
    if(el.dataset.s==="code"&&val.length===4&&was.length!==4){ push("加入了任務"); render(); return; }
    push(); return;
  }
  if(el.dataset.r){
    st.refl[el.dataset.r]=el.value; save();
    var f=el.closest(".f"),c=f&&f.querySelector(".cnt");
    if(c){var mn=el.dataset.r==="b"?400:(el.dataset.r==="a"?50:30),n=el.value.trim().length;
      c.textContent=n+" / "+mn+" 字";c.className="cnt"+(n>=mn?" ok":"");}
    buildSheet(); return;
  }
  if(el.dataset.q&&el.dataset.k){
    st.d[el.dataset.q]=st.d[el.dataset.q]||{};
    st.d[el.dataset.q][el.dataset.k]=el.value; save();
    var T=tot(),p=document.getElementById("pts"); if(p)p.innerHTML=T.all+'<small>/'+MAX+'</small>';
    var f2=el.closest(".f"),c2=f2&&f2.querySelector(".cnt");
    if(c2){var q=Q(el.dataset.q),fd=q.f.filter(function(x){return x.k===el.dataset.k;})[0];
      c2.textContent=el.value.trim().length+" / "+fd.min+" 字";
      c2.className="cnt"+(el.value.trim().length>=fd.min?" ok":"");}
    var sec=el.closest(".quest"),hd=sec&&sec.querySelector(".qpts");
    if(hd){
      var sc=qScore(el.dataset.q);
      hd.textContent=sc+" / "+qMax(el.dataset.q);
      var was2=sec.classList.contains("done");
      sec.classList.toggle("done",sc===qMax(el.dataset.q));
      var ev=(!was2&&sc===qMax(el.dataset.q))?"完成了「"+Q(el.dataset.q).t+"」":null;
      if(justUnlocked()){ push("★ 解鎖了加碼關！"); render(); return; }
      push(ev); paintBonus();
    } else push();
  }
});

document.addEventListener("change",function(e){
  var t=e.target;
  if(t.dataset.pic!==undefined&&t.files&&t.files[0]){
    var k=t.dataset.pic;
    upState[k]="up";
    shrink(t.files[0],function(url){
      if(!url){ upState[k]="fail"; paintUp(k); return; }
      pics[k]=url; savePics();
      if(k.indexOf("sheet")!==0){
        st.photo[k]=1; save();
        pushPic(k,url);
        if(justUnlocked()){ push("★ 解鎖了加碼關！"); render(); return; }
        push();
      } else {
        pushPic(k,url);
      }
      render();
    });
  }
});

document.addEventListener("click",function(e){
  var t=e.target;
  var hd=t.closest(".qhead");
  if(hd){ st.open=(st.open===hd.dataset.q)?null:hd.dataset.q; save(); render(); return; }
  var sb=t.closest("[data-stage]");
  if(sb){ st.stage=sb.dataset.stage; st.open=null; save(); render(); return; }
  if(t.id==="draw"){
    var pool=MITSUI.map(function(x){return x.id;});
    for(var i=pool.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),k=pool[i];pool[i]=pool[j];pool[j]=k;}
    st.picked=pool.slice(0,4); st.open=st.picked[0]; save(); push("抽到了任務"); render(); return;
  }
  if(t.id==="gen"){ gen(); return; }
  if(t.id==="prt"){ buildSheet(); setTimeout(function(){window.print();},60); return; }
  if(t.id==="cp"){
    var o=document.getElementById("out"); if(!o.value)gen();
    var done=function(){t.textContent="已複製";setTimeout(function(){t.textContent="複製";},1800);};
    if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(o.value).then(done).catch(fb);else fb();
    function fb(){o.removeAttribute("readonly");o.select();try{document.execCommand("copy");done();}catch(x){t.textContent="請長按選取";}o.setAttribute("readonly","");}
  }
});

function gen(){
  var T=tot(),L=[];
  L.push("【職場體驗偵察任務】"+st.cls+" "+st.grp);
  L.push("組員："+st.mem);
  L.push("任務分："+T.all+" / "+MAX+"　魔菇 "+T.mo+"／三井 "+T.mi+"／名詞 "+T.te+(GPS_ON?"／打卡 "+T.gp:""));
  L.push("");
  L.push("══ 魔菇部落 ══");
  MOGU.forEach(function(q){ L.push("── "+q.t+"　"+qScore(q.id)+"/6");
    q.f.forEach(function(f){L.push("　"+f.l+"："+v(q.id,f.k));}); });
  L.push("");
  L.push("══ 三井 OUTLET ══");
  (st.picked||[]).forEach(function(id){var q=Q(id);
    L.push("── "+q.t+"　"+qScore(id)+"/10");
    q.f.forEach(function(f){L.push("　"+f.l+"："+v(id,f.k));});
    L.push("　照片："+(pics[id]?"已拍":"未拍")); });
  L.push("");
  if(T.bo){
    L.push("══ ★ 加碼關　"+T.bo+"/10（另計） ══");
    BONUS.f.forEach(function(f){L.push("　"+f.l+"："+v("x1",f.k));});
    L.push("");
  }
  var ht=hits();
  L.push("用到的商業名詞："+(ht.length?ht.join("、"):"（沒有）"));
  document.getElementById("out").value=L.join("\n");
}

lastUnlocked=unlocked();
initFB(); render(); startGPS();
setInterval(function(){var el=document.getElementById("clk");if(!el)return;var c=clk();el.textContent=c.t;el.className="clock"+(c.w?" warn":"");},1000);
})();
</script>
