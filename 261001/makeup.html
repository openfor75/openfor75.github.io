</script>
<script>
(function(){
"use strict";
var EVENT_ID="115-1-1001", KEY="ylhc-makeup";
var st={cls:"",no:"",name:"",grp:"",mem:"",stage:"mogu",open:null,refl:{a:"",b:"",c:""}};
try{ var r=localStorage.getItem(KEY); if(r) st=Object.assign(st,JSON.parse(r)||{}); }catch(e){}
function save(){ try{ localStorage.setItem(KEY,JSON.stringify(st)); }catch(e){} }

var db=null, myKey="", D={}, PH={}, PIC={}, RF={}, online=false, ready=false;
var ansRef=null, picRef=null, picKey="", pendingRender=false;
function typing(){ var a=document.activeElement; return !!(a&&/^(INPUT|TEXTAREA)$/.test(a.tagName)); }
/* 有人正在打字就絕對不重畫，只更新分數；等他離開欄位再補畫 */
function softRender(){
  if(typing()){ pendingRender=true; paintScore(); return; }
  render();
}
document.addEventListener("focusout",function(){
  if(!pendingRender) return;
  pendingRender=false;
  setTimeout(function(){ if(!typing()) render(); },160);
});
function esc(s){ return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function ALL(){ return MOGU.concat(MITSUI).concat([BONUS]); }
function Q(id){ return ALL().filter(function(x){return x.id===id;})[0]; }
function val(q,k){ return String(((D[q]||{})[k])||"").trim(); }

/* ---------- 名冊 ---------- */
function rowsOf(c){ return (STUDENTS[c]||[]); }
function meRow(){ if(!st.cls||!st.no) return null;
  return rowsOf(st.cls).filter(function(x){ return String(x.no)===String(st.no); })[0]||null; }
function mates(){ var m=meRow(); if(!m) return [];
  return rowsOf(st.cls).filter(function(x){ return String(x.grp)===String(m.grp); }); }
function fromRoster(){ var m=meRow(); if(!m) return;
  st.name=m.name; st.grp="第"+m.grp+"組"; st.mem=mates().map(function(x){return x.name;}).join("、"); }
function myId(){ return (st.cls+"-"+st.no).replace(/[.#$\[\]\/\s]/g,""); }

/* ---------- 計分（跟老師端完全一致）---------- */
function qScore(id){
  var q=Q(id); if(!q) return 0;
  if(id.charAt(0)==="x"){
    var s=0; q.f.forEach(function(f){ var t=val(id,f.k); if(f.min? t.length>=f.min : t.length>0) s+=1; });
    return Math.min(5,s);
  }
  var filled=q.f.every(function(f){ return val(id,f.k).length>0; });
  var mins=q.f.filter(function(f){ return f.min; });
  var lng=mins.length?mins.every(function(f){ return val(id,f.k).length>=f.min; }):filled;
  var s2=0;
  if(id.charAt(0)==="m"){ if(filled)s2+=4; if(lng)s2+=4; }
  else { if(PH[id])s2+=3; if(filled)s2+=4; if(lng)s2+=3; }
  return s2;
}
function qMax(id){ return id.charAt(0)==="m"?8:(id.charAt(0)==="x"?5:10); }
function topFour(){
  var a=MITSUI.map(function(q){ return {id:q.id,s:qScore(q.id)}; });
  a.sort(function(x,y){ return y.s-x.s || x.id.localeCompare(y.id); });
  return a.slice(0,4);
}
function tot(){
  var mo=0; MOGU.forEach(function(q){ mo+=qScore(q.id); });
  var mi=0; topFour().forEach(function(x){ mi+=x.s; });
  var txt=""; for(var q in D) for(var f in D[q]) txt+=String(D[q][f]||"")+" ";
  var te=Math.min(5,TERMS.filter(function(w){ return txt.indexOf(w)>=0; }).length);
  var bo=D.x1?qScore("x1"):0;
  return {mo:mo,mi:mi,te:te,bo:bo,task:mo+mi+te};
}

/* ---------- Firebase（讀寫都只用 班級+組別 定位，不需要通行碼）---------- */
function connect(){
  if(!st.cls||!st.grp){ ready=false; return; }
  try{
    if(!db){ firebase.initializeApp(FB_CONFIG); db=firebase.database();
      db.ref(".info/connected").on("value",function(s){ online=!!s.val(); paintSync(); }); }
  }catch(e){ db=null; return; }
  if(ansRef){ try{ ansRef.off(); }catch(e){} }
  ansRef=db.ref("e/"+EVENT_ID+"/ans");
  ansRef.on("value",function(sn){
    var all=sn.val()||{}, best=null, bestN=-1;
    D={}; PH={};
    for(var k in all){
      var A=all[k]||{};
      if(String(A.cls)!==st.cls||String(A.grp)!==st.grp) continue;
      var n=0, dd=A.d||{};
      for(var q in dd) for(var f in dd[q]) n+=String(dd[q][f]||"").length;
      if(n>bestN){ bestN=n; best=k; }
      for(var q2 in dd){
        D[q2]=D[q2]||{};
        for(var f2 in dd[q2]){
          var t=String(dd[q2][f2]||"");
          if(t.trim().length>String(D[q2][f2]||"").trim().length) D[q2][f2]=t;
        }
      }
      String(A.ph||"").split(",").filter(Boolean).forEach(function(x){ PH[x]=1; });
      var mine=(A.rf||{})[myId()];
      if(mine){ ["a","b","c"].forEach(function(z){
        if(String(mine[z]||"").trim() && !String(st.refl[z]||"").trim()) st.refl[z]=String(mine[z]); }); }
    }
    myKey=best||"";
    ready=!!myKey;
    watchPic(myKey);
    save();
    softRender();
  });
}
/* 照片監聽器整個分頁只掛一次，換組才換；掛太多次就是打字會跳的原因 */
function watchPic(k){
  if(!db||!k||k===picKey) return;
  if(picRef){ try{ picRef.off(); }catch(e){} }
  picKey=k;
  picRef=db.ref("e/"+EVENT_ID+"/pic/"+k);
  picRef.on("value",function(p){
    PIC=p.val()||{};
    for(var z in PIC) if(z.indexOf("sheet")!==0) PH[z]=1;
    softRender();
  });
}
function wref(){ return db&&myKey? db.ref("e/"+EVENT_ID+"/ans/"+myKey) : null; }

var tQ={}, tT=null;
function queue(path,v){
  if(!wref()) return;
  tQ[path]=v;
  clearTimeout(tT);
  tT=setTimeout(function(){
    var o=tQ; tQ={};
    o.cls=st.cls; o.grp=st.grp; o.mem=st.mem;
    o.at=firebase.database.ServerValue.TIMESTAMP;
    wref().update(o).then(function(){ flash("已存檔"); }).catch(function(){ flash("存檔失敗，再打一個字重試","bad"); });
  },700);
}
function pushRefl(){
  if(!wref()) return;
  var o={}; o["rf/"+myId()]={ no:String(st.no), nm:String(st.name),
    a:String(st.refl.a||"").slice(0,3000), b:String(st.refl.b||"").slice(0,3000),
    c:String(st.refl.c||"").slice(0,3000), at:firebase.database.ServerValue.TIMESTAMP };
  o.cls=st.cls; o.grp=st.grp;
  wref().update(o).then(function(){ flash("心得已上傳"); }).catch(function(){});
}
var flashT=null;
function flash(msg,kind){
  var el=document.getElementById("sync"); if(!el) return;
  el.textContent=msg; el.className="sync"+(kind==="bad"?"":" ok");
  clearTimeout(flashT);
  flashT=setTimeout(paintSync,2200);
}
function paintSync(){
  var el=document.getElementById("sync"); if(!el) return;
  el.className="sync";
  el.textContent=!ready?"":(online?"已連線　全組即時同步":"離線中　連上網路會自動補傳");
}

/* ---------- 照片 ---------- */
function shrink(file,cb){
  var fr=new FileReader();
  fr.onerror=function(){ cb(null,"讀不到這個檔案"); };
  fr.onload=function(){
    var img=new Image();
    img.onerror=function(){ cb(null,"這張圖手機打不開（HEIC 格式請改用『拍照』或先存成 JPG）"); };
    img.onload=function(){
      try{
        var m=1000,w=img.width||m,h=img.height||m,sc=Math.min(1,m/Math.max(w,h));
        var c=document.createElement("canvas");
        c.width=Math.max(1,Math.round(w*sc)); c.height=Math.max(1,Math.round(h*sc));
        c.getContext("2d").drawImage(img,0,0,c.width,c.height);
        var url="", qy=0.62;
        for(var i=0;i<6;i++){
          url=c.toDataURL("image/jpeg",qy);
          if(url.length<=200000) break;
          qy-=0.1;
          if(qy<0.25){
            c.width=Math.round(c.width*0.72); c.height=Math.round(c.height*0.72);
            c.getContext("2d").drawImage(img,0,0,c.width,c.height);
            qy=0.5;
          }
        }
        if(url.length>280000) return cb(null,"壓縮後還是太大，換一張試試");
        cb(url,null);
      }catch(err){ cb(null,"手機記憶體不足，關掉其他 App 再試"); }
    };
    img.src=fr.result;
  };
  fr.readAsDataURL(file);
}
function setUp(k,txt,kind){
  var el=document.querySelector('[data-up="'+k+'"]');
  if(el){ el.textContent=txt; el.className="up"+(kind?" "+kind:""); }
}
function sendPic(k,url){
  if(!db||!myKey){ setUp(k,"還沒選好身分",'bad'); return; }
  setUp(k,"上傳中⋯ "+Math.round(url.length/1024)+" KB",'go');
  db.ref("e/"+EVENT_ID+"/pic/"+myKey+"/"+k).set(url)
    .then(function(){
      PH[k]=1; PIC[k]=url;
      queue("ph",Object.keys(PH).filter(function(z){return PH[z];}).join(","));
      setUp(k,"✓ 已上傳",'ok'); softRender();
    })
    .catch(function(e){ setUp(k,"上傳失敗："+(e&&e.message?e.message:"請檢查網路"),'bad'); });
}

/* ---------- 畫面 ---------- */
function fld(q,f){
  var id="f-"+q.id+"-"+f.k, v=val(q.id,f.k), n=v.length;
  var h='<div class="f"><label for="'+id+'">'+esc(f.l)+(f.min?'　<span style="font-weight:400;color:var(--ink-3)">至少 '+f.min+' 字</span>':'')+'</label>';
  h+= f.t==="ta"
    ? '<textarea id="'+id+'" data-q="'+q.id+'" data-k="'+f.k+'">'+esc(v)+'</textarea>'
    : '<input id="'+id+'" data-q="'+q.id+'" data-k="'+f.k+'" value="'+esc(v)+'">';
  if(f.min) h+='<div class="cnt '+(n>=f.min?"ok":(n?"bad":""))+'" data-c="'+q.id+'-'+f.k+'">'+n+' / '+f.min+' 字</div>';
  h+='</div>';
  return h;
}
function card(q,label){
  var s=qScore(q.id), mx=qMax(q.id), op=st.open===q.id;
  var h=['<section class="quest'+(s===mx?" done":"")+(op?" open":"")+'">'];
  h.push('<div class="qh" data-open="'+q.id+'"><span class="n">'+label+'</span>');
  h.push('<span class="t"><b>'+esc(q.t)+'</b><span>'+esc(q.s)+'</span></span>');
  h.push('<span class="p">'+s+' / '+mx+'</span></div>');
  h.push('<div class="qb">');
  h.push('<div class="mission">'+q.m+'</div>');
  if(q.id.charAt(0)==="q"||q.id.charAt(0)==="m"){
    var has=PIC[q.id];
    h.push('<div class="ph">');
    if(has) h.push('<img src="'+has+'" alt="">');
    h.push('<label class="pick" for="pic-'+q.id+'"><input type="file" accept="image/*" id="pic-'+q.id+'" data-pic="'+q.id+'">');
    h.push('<span>'+(has?"✓ 已有照片　點這裡換一張":(q.id.charAt(0)==="q"?"從相簿選或拍照　＋3 分":"配一張照片（選填，不計分）"))+'</span></label>');
    h.push('<div class="up" data-up="'+q.id+'">'+(has?"✓ 已上傳":"")+'</div>');
    h.push('</div>');
  }
  q.f.forEach(function(f){ h.push(fld(q,f)); });
  h.push('</div></section>');
  return h.join("");
}
function paintScore(){
  var T=tot(), el=document.getElementById("sc");
  if(el) el.innerHTML=T.task+'<i>/85</i>';
  MOGU.concat(MITSUI).concat([BONUS]).forEach(function(q){
    var sec=document.querySelector('[data-open="'+q.id+'"]');
    if(!sec) return;
    var p=sec.querySelector(".p"), s=qScore(q.id), mx=qMax(q.id);
    if(p) p.textContent=s+" / "+mx;
    sec.parentNode.classList.toggle("done",s===mx);
  });
  var t4=topFour(), bt=document.querySelector('[data-stage="mitsui"] b');
  if(bt) bt.textContent=t4.reduce(function(a,x){return a+x.s;},0)+" / 40";
  var bm=document.querySelector('[data-stage="mogu"] b');
  if(bm) bm.textContent=tot().mo+" / 40";
}
function render(){
  var h=[], T=tot();
  var picked=!!(st.cls&&st.no);
  /* 身分 */
  h.push('<div class="panel'+(picked?'':' gate')+'">');
  h.push('<h2>你是誰</h2>');
  h.push('<p class="sub">選好就會自動帶出你這一組目前的所有資料。<b>不用通行碼了。</b></p>');
  h.push('<div class="f"><label for="i-cls">班級</label><select id="i-cls"><option value="">請選擇⋯</option>');
  Object.keys(STUDENTS).forEach(function(c){ h.push('<option value="'+esc(c)+'"'+(st.cls===c?" selected":"")+'>'+esc(c)+'</option>'); });
  h.push('</select></div>');
  h.push('<div class="f"><label for="i-no">座號　姓名</label><select id="i-no"'+(st.cls?"":" disabled")+'><option value="">'+(st.cls?"請選擇⋯":"請先選班級")+'</option>');
  rowsOf(st.cls).forEach(function(x){ h.push('<option value="'+esc(x.no)+'"'+(String(st.no)===String(x.no)?" selected":"")+'>'+esc(x.no)+'　'+esc(x.name)+'　（第'+x.grp+'組）</option>'); });
  h.push('</select></div>');
  if(picked) h.push('<div class="auto"><b>'+esc(st.cls+"　"+st.grp)+'</b>'+esc(st.mem)+'</div>');
  h.push('</div>');

  if(!picked){ document.getElementById("app").innerHTML=h.join(""); paintSync(); return; }
  if(!ready){
    h.push('<div class="panel gate"><h2>讀取中⋯</h2><p class="sub">正在把你這一組的資料抓下來。如果一直停在這裡，表示這一組今天沒有任何紀錄，請跟老師說。</p></div>');
    document.getElementById("app").innerHTML=h.join(""); paintSync(); return;
  }

  h.push('<div class="tabs">');
  h.push('<button data-stage="mogu" class="'+(st.stage==="mogu"?"on":"")+'">魔菇部落<b>'+T.mo+' / 40</b></button>');
  h.push('<button data-stage="mitsui" class="'+(st.stage==="mitsui"?"on":"")+'">三井 OUTLET<b>'+T.mi+' / 40</b></button>');
  h.push('<button data-stage="refl" class="'+(st.stage==="refl"?"on":"")+'">我的心得<b>各自寫</b></button>');
  h.push('</div>');

  if(st.stage==="mogu"){
    h.push('<div class="note">這裡是<b>全組共用</b>的。你打的字組員會看到，他們打的你也會看到，不會互相蓋掉。</div>');
    MOGU.forEach(function(q,i){ h.push(card(q,i+1)); });
  } else if(st.stage==="mitsui"){
    var t4=topFour();
    h.push('<div class="note">八關全部開放，<b>做滿四關就夠了</b>。系統自動取你們分數最高的四關計分，所以多做不會吃虧，做錯關也不會白做。</div>');
    MITSUI.forEach(function(q,i){
      var inTop=t4.some(function(x){ return x.id===q.id&&x.s>0; });
      h.push(card(q,inTop?"✓":(i+1)));
    });
    h.push('<div style="margin-top:18px">');
    h.push('<div class="note" style="background:var(--surface-2);color:var(--ink-2)">★ 加碼關（另計 5 分，四關做滿才建議挑戰）</div>');
    h.push(card(BONUS,"★"));
    h.push('</div>');
  } else {
    h.push('<div class="note">心得是<b>你自己的</b>，組員看不到，只有老師看得到。打字就會自動上傳。</div>');
    h.push('<div class="panel">');
    h.push('<div class="f"><label for="r-a">今天印象最深的一件事</label><textarea id="r-a" data-r="a">'+esc(st.refl.a)+'</textarea><div class="cnt" data-cr="a"></div></div>');
    h.push('<div class="f"><label for="r-b">參訪心得（至少 400 字）</label><textarea id="r-b" data-r="b" style="min-height:230px">'+esc(st.refl.b)+'</textarea><div class="cnt" data-cr="b"></div></div>');
    h.push('<div class="f"><label for="r-c">給這次活動的建議</label><textarea id="r-c" data-r="c">'+esc(st.refl.c)+'</textarea><div class="cnt" data-cr="c"></div></div>');
    h.push('</div>');
  }
  h.push('<div class="sync" id="sync"></div>');
  document.getElementById("app").innerHTML=h.join("");
  var el=document.getElementById("sc"); if(el) el.innerHTML=T.task+'<i>/85</i>';
  if(st.stage==="refl") ["a","b","c"].forEach(cntR);
  paintSync();
}
function cntR(k){
  var mn=k==="b"?400:(k==="a"?50:30), n=String(st.refl[k]||"").trim().length;
  var el=document.querySelector('[data-cr="'+k+'"]');
  if(el){ el.textContent=n+" / "+mn+" 字"; el.className="cnt"+(n>=mn?" ok":(n?" bad":"")); }
}

/* ---------- 事件 ---------- */
document.addEventListener("change",function(e){
  var el=e.target;
  if(el.id==="i-cls"){ st.cls=el.value; st.no=""; st.grp=""; st.mem=""; st.name=""; ready=false; save(); render(); connect(); return; }
  if(el.id==="i-no"){ st.no=el.value; fromRoster(); ready=false; save(); render(); connect(); return; }
  if(el.dataset && el.dataset.pic!==undefined && el.files && el.files[0]){
    var k=el.dataset.pic;
    setUp(k,"處理中⋯",'go');
    shrink(el.files[0],function(url,err){
      if(!url){ setUp(k,"✗ "+err,'bad'); return; }
      sendPic(k,url);
    });
  }
});
document.addEventListener("input",function(e){
  var el=e.target;
  if(el.dataset && el.dataset.q && el.dataset.k){
    var q=el.dataset.q,k=el.dataset.k,v=el.value;
    D[q]=D[q]||{}; D[q][k]=v;
    queue("d/"+q+"/"+k, v);
    var f=(Q(q).f.filter(function(x){return x.k===k;})[0])||{};
    if(f.min){
      var c=document.querySelector('[data-c="'+q+'-'+k+'"]');
      if(c){ c.textContent=v.trim().length+" / "+f.min+" 字";
             c.className="cnt"+(v.trim().length>=f.min?" ok":(v.length?" bad":"")); }
    }
    paintScore();
    return;
  }
  if(el.dataset && el.dataset.r){
    st.refl[el.dataset.r]=el.value; save(); cntR(el.dataset.r);
    clearTimeout(window.__rt); window.__rt=setTimeout(pushRefl,900);
  }
});
document.addEventListener("click",function(e){
  var t=e.target;
  var sb=t.closest&&t.closest("[data-stage]");
  if(sb){ st.stage=sb.dataset.stage; st.open=null; save(); render(); return; }
  var qh=t.closest&&t.closest("[data-open]");
  if(qh){ var id=qh.dataset.open; st.open=(st.open===id)?null:id; save(); render(); return; }
});

if(st.cls&&st.no) fromRoster();
render();
connect();
})();

</script>
</body>
</html>
