<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>學習歷程輸出</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap">
<style>
:root{
  --paper:#fbfaf7;--surface:#fff;--surface-2:#f2efe9;--line:#ddd7cc;
  --ink:#15181d;--ink-2:#4a5059;--ink-3:#7b828c;
  --accent:#dd4f1f;--accent-soft:#fdeee7;--ok:#1d6b45;--ok-soft:#e1f0e8;
  --gold:#9a6c00;--gold-soft:#fbf1d8;--sea:#14566b;--sea-soft:#e4eff3;
  --sans:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --mono:ui-monospace,Consolas,monospace;
  --shadow:0 1px 2px rgba(21,24,29,.06),0 6px 20px rgba(21,24,29,.08);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#14161a;--surface:#1d2026;--surface-2:#252930;--line:#353a43;
  --ink:#eef0f3;--ink-2:#b3bac2;--ink-3:#8a9199;
  --accent:#ff8154;--accent-soft:#33201a;--ok:#6fc79b;--ok-soft:#16281f;
  --gold:#e5b458;--gold-soft:#2e2718;--sea:#79b9cf;--sea-soft:#182a31;
  --shadow:0 1px 2px rgba(0,0,0,.5),0 6px 20px rgba(0,0,0,.4);
}}
:root[data-theme="dark"]{
  --paper:#14161a;--surface:#1d2026;--surface-2:#252930;--line:#353a43;
  --ink:#eef0f3;--ink-2:#b3bac2;--ink-3:#8a9199;
  --accent:#ff8154;--accent-soft:#33201a;--ok:#6fc79b;--ok-soft:#16281f;
  --gold:#e5b458;--gold-soft:#2e2718;--sea:#79b9cf;--sea-soft:#182a31;
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.6}
.wrap{max-width:1400px;margin:0 auto;padding:18px 16px 60px}
h1.t{font-size:22px;margin:0 0 2px}
.sub{color:var(--ink-2);font-size:14px;margin:0 0 14px}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:0 0 14px}
button{font-family:inherit;font-size:14px;font-weight:600;padding:8px 13px;border-radius:10px;
  border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
button.on,button.go{background:var(--ink);border-color:var(--ink);color:var(--paper)}
button.acc{background:var(--accent);border-color:var(--accent);color:#fff}
button:disabled{opacity:.5;cursor:default}
#st{font-size:13px;color:var(--ink-3);font-family:var(--mono)}
.grid{display:grid;grid-template-columns:minmax(0,470px) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:980px){.grid{grid-template-columns:1fr}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);overflow:hidden;margin-bottom:14px}
.card h3{margin:0;padding:11px 14px;font-size:14px;background:var(--surface-2);display:flex;justify-content:space-between;gap:8px;align-items:center}
.card h3 small{font-weight:500;color:var(--ink-3);font-size:12px}
.scroll{max-height:62vh;overflow:auto}
table.l{width:100%;border-collapse:collapse}
table.l th,table.l td{padding:6px 8px;border-bottom:1px solid var(--line);font-size:13.5px;text-align:left;vertical-align:middle}
table.l th{font-size:11.5px;color:var(--ink-3);font-weight:600;position:sticky;top:0;background:var(--surface)}
table.l td.n,table.l th.n{text-align:right;font-family:var(--mono);white-space:nowrap}
table.l tr.s{cursor:pointer}
table.l tr.s:hover{background:var(--surface-2)}
table.l tr.cur{background:var(--accent-soft)}
.numin{width:48px;font-family:var(--mono);font-size:13px;padding:3px 5px;border-radius:7px;border:1px solid var(--line);background:var(--surface-2);color:var(--ink);text-align:center}
.pill{display:inline-block;font-size:11px;padding:0 6px;border-radius:20px;margin-left:4px;background:var(--surface-2);color:var(--ink-3);border:1px solid var(--line)}
.pill.warn{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.pill.ok{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.dl{padding:3px 8px;font-size:12px;border-radius:7px}
.note{font-size:13px;color:var(--ink-2);background:var(--sea-soft);border-radius:12px;padding:11px 14px;margin-bottom:14px}
.note b{color:var(--sea)}
.pvbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:10px 14px;border-bottom:1px solid var(--line)}
.pvbar b{flex:1;min-width:140px}
#pv{background:#8a8f96;padding:14px 0;overflow:hidden}
#pv .zoomer{transform-origin:top left}
#pv .page{margin:0 auto 14px;box-shadow:0 4px 18px rgba(0,0,0,.35)}
#pv .empty{color:#fff;text-align:center;padding:60px 16px;font-size:14px}
#stage{position:absolute;left:-30000px;top:0;width:210mm}
#printbox{display:none}
.prog{height:6px;background:var(--surface-2);border-radius:9px;overflow:hidden;flex:1;min-width:120px;display:none}
.prog i{display:block;height:100%;width:0;background:var(--accent);transition:width .2s}

/* ===================== A4 頁面（固定淺色，給列印與 PDF 用） ===================== */
.page{width:210mm;height:297mm;background:#fff;color:#1a1d22;display:flex;flex-direction:column;
  padding:12mm 15mm 9mm;overflow:hidden;position:relative;font-family:var(--sans);
  -webkit-print-color-adjust:exact;print-color-adjust:exact}
.page .hd{display:flex;justify-content:space-between;font-size:8pt;color:#6b7280;
  border-bottom:0.35mm solid #1a1d22;padding-bottom:1.6mm;margin-bottom:5mm;flex:none}
.page .hd b{color:#1a1d22}
.page .ft{display:flex;justify-content:space-between;font-size:7.5pt;color:#8a9199;
  border-top:0.2mm solid #d0d4da;padding-top:1.6mm;margin-top:3mm;flex:none}
.page .body{flex:1;min-height:0;overflow:hidden;font-size:10.5pt;line-height:1.72}
.page p{margin:0}
.page .kick{font-size:.78em;color:#dd4f1f;font-weight:700}
.page h1{font-size:2.5em;font-weight:900;margin:.1em 0 .1em;line-height:1.15;color:#15181d}
.page .lead{font-size:1.05em;color:#4a5059;font-weight:500}
.page h2{font-size:1.16em;font-weight:900;margin:1.05em 0 .5em;padding-left:.55em;
  border-left:.3em solid #dd4f1f;line-height:1.3;color:#15181d}
.page h2.first{margin-top:0}
.page h2 small{font-weight:500;color:#7b828c;font-size:.72em;margin-left:.5em}
.page table.info{width:100%;border-collapse:collapse;font-size:.9em;margin-top:1.1em}
.page table.info th{background:#f1f2f4;font-weight:700;text-align:left;width:5.2em;padding:.32em .6em;
  border:0.2mm solid #c9ced6;white-space:nowrap;color:#33383f}
.page table.info td{padding:.32em .6em;border:0.2mm solid #c9ced6}
.page .intro{font-size:.93em;color:#33383f;text-align:justify}
.page .scorebox{display:flex;gap:1.1em;align-items:stretch}
.page .big{flex:none;width:8.6em;background:#15181d;color:#fff;border-radius:.6em;padding:.7em .5em;
  text-align:center;display:flex;flex-direction:column;justify-content:center}
.page .big b{font-size:3.3em;line-height:1.05;font-weight:900}
.page .big span{font-size:.78em;color:#c9ced6}
.page table.sc{flex:1;border-collapse:collapse;font-size:.86em}
.page table.sc td{padding:.22em .5em;border-bottom:0.2mm solid #e1e4e8}
.page table.sc td.n{text-align:right;white-space:nowrap}
.page table.sc td.d{color:#7b828c;font-size:.9em}
.page table.sc tr.mid td{font-weight:700;background:#f6f7f8}
.page table.sc tr.tot td{font-weight:900;border-top:0.45mm solid #15181d;border-bottom:none;font-size:1.08em}
.page .duo{display:flex;gap:4mm;margin-top:.4em}
.page .duo figure{flex:1;margin:0;min-width:0}
.page .pic{background-size:cover;background-position:center;background-repeat:no-repeat;
  border-radius:1.6mm;border:0.2mm solid #c9ced6;background-color:#f1f2f4}
.page .duo .pic{height:64mm}
.page .duo.one .pic{height:80mm}
.page figcaption{font-size:.78em;color:#4a5059;margin-top:.25em;text-align:center}
.page .free{text-align:justify;word-break:break-word}
.page .none{color:#9aa0a8}
.page .meta{font-size:.76em;color:#7b828c;margin-top:.2em}
.page .chips{margin-top:.3em}
.page .chips span{display:inline-block;border:0.25mm solid #9a6c00;color:#7a5600;border-radius:99px;
  padding:0 .65em;margin:0 .3em .3em 0;font-size:.8em;line-height:1.7}
.page .qa{display:flex;gap:.9em;margin:0 0 .85em;padding-bottom:.75em;border-bottom:0.2mm dashed #d0d4da}
.page .qa:last-child{border-bottom:none}
.page .qa .tx{flex:1;min-width:0}
.page .qa .qt{font-weight:900;font-size:1.02em;color:#15181d}
.page .qa .qt i{font-style:normal;color:#dd4f1f;margin-right:.35em}
.page .qa .mi{font-size:.78em;color:#7b828c;margin:.1em 0 .3em;line-height:1.55}
.page .qa .an{margin:0 0 .12em;word-break:break-word}
.page .qa .an .lb{color:#14566b;font-weight:700;margin-right:.45em;font-size:.86em}
.page .qa .pic{flex:none;width:12.5em;height:9.2em}
.page .grpnote{font-size:.82em;color:#4a5059;background:#f4f5f7;border-radius:1.4mm;padding:.45em .8em;margin-bottom:.9em}

@media print{
  @page{size:A4;margin:0}
  body{background:#fff}
  body > *:not(#printbox){display:none!important}
  #printbox{display:block!important}
  #printbox .page{margin:0;box-shadow:none;break-after:page;page-break-after:always}
  #printbox .page:last-child{break-after:auto;page-break-after:auto}
}
</style>
</head>
<body>
<div class="wrap">
  <h1 class="t">學習歷程輸出</h1>
  <p class="sub">每位學生一份 A4、固定 4 頁的 PDF：成績總覽＋照片、個人心得、魔菇任務紀錄、三井任務紀錄。資料直接從雲端讀，同組重複紀錄會自動合併。</p>

  <div class="note" id="rule"></div>

  <div class="bar">
    <button class="on" data-cls="">全部</button>
    <button data-cls="商二甲">商二甲</button>
    <button data-cls="商二乙">商二乙</button>

      <input type="checkbox" id="pf">照片分一律給</label>
    <label style="display:flex;align-items:center;gap:6px;font-size:13.5px;font-weight:600">
      <input type="checkbox" id="showsc" checked>PDF 印出分數</label>
    <span style="flex:1"></span>
    <button id="reload">重新讀取</button>
    <button class="acc" id="zip" disabled>批次下載（ZIP）</button>
    <div class="prog" id="prog"><i></i></div>
    <span id="st">連線中⋯</span>
  </div>

  <div class="grid">
    <div>
      <div class="card">
        <h3>小組成績 <small>創意分／GPS 補分在這裡或 score.html 輸入都可以（同一台電腦同一個瀏覽器會共用）</small></h3>
        <div class="scroll" style="max-height:34vh"><table class="l"><thead><tr>
          <th>組別</th><th class="n">任務/85</th><th class="n">創意/10</th><th class="n">GPS/5</th><th class="n">小組/100</th><th class="n">照片</th>
        </tr></thead><tbody id="gt"></tbody></table></div>
      </div>
      <div class="card">
        <h3>學生 <small id="cnt"></small></h3>
        <div class="scroll"><table class="l"><thead><tr>
          <th>座號 姓名</th><th>組別</th><th class="n">心得字數</th><th class="n">心得/30</th><th class="n">總分</th><th></th>
        </tr></thead><tbody id="tb"><tr><td colspan="6" style="color:var(--ink-3)">讀取中⋯</td></tr></tbody></table></div>
      </div>
    </div>
    <div class="card" style="margin-bottom:0">
      <div class="pvbar"><b id="pvt">預覽</b>
        <button id="pdf1" disabled>下載這位的 PDF</button>
        <button id="prt1" disabled>列印／另存 PDF（文字向量）</button></div>
      <div id="pv"><div class="empty">在左邊點一位學生就會出現預覽</div></div>
    </div>
  </div>
</div>
<div id="stage"></div>
<div id="printbox"></div>

/* ---------- 合併同班同組（同 score.html，另外把照片本體也收進來） ---------- */
function newGroup(cls,grp){ return {id:cls+"|"+grp,cls:cls,grp:grp,keys:[],d:{},ph:{},pics:{}}; }
function buildGroups(){
  G={};
  for(var k in ANS){
    var A=ANS[k]||{}, cls=String(A.cls||"").trim(), grp=ng(A.grp);
    if(!cls||!grp) continue;
    var id=cls+"|"+grp, g=G[id]||(G[id]=newGroup(cls,grp));
    g.keys.push(k);
    var D=A.d||{};
    for(var q in D){
      g.d[q]=g.d[q]||{};
      for(var f in D[q]){
        var t=String(D[q][f]==null?"":D[q][f]);
        if(t.trim().length>String(g.d[q][f]||"").trim().length) g.d[q][f]=t;
      }
    }
    String(A.ph||"").split(",").filter(Boolean).forEach(function(x){ g.ph[x]=1; });
    var P=PIC[k]||{};
    for(var z in P){ if(!g.pics[z]) g.pics[z]=P[z]; if(z.indexOf("sheet")!==0) g.ph[z]=1; }
  }
  for(var id2 in G) score(G[id2]);
}
function score(g){
  function val(q,f){ return String(((g.d[q]||{})[f])||"").trim(); }
  function sc(qid){
    var q=Q(qid); if(!q) return 0;
    if(qid.charAt(0)==="x"){
      var s=0; q.f.forEach(function(f){ var t=val(qid,f.k); if(f.min? t.length>=f.min : t.length>0) s+=1; });
      return Math.min(5,s);
    }
    var filled=q.f.every(function(f){ return val(qid,f.k).length>0; });
    var mins=q.f.filter(function(f){ return f.min; });
    var lng=mins.length?mins.every(function(f){ return val(qid,f.k).length>=f.min; }):filled;
    var s2=0;
    if(qid.charAt(0)==="m"){ if(filled)s2+=4; if(lng)s2+=4; }
    else { if(PF||g.ph[qid])s2+=3; if(filled)s2+=4; if(lng)s2+=3; }
    return s2;
  }
  g.sc=sc;
  g.mo=0; MOGU.forEach(function(q){ g.mo+=sc(q.id); });
  var qs=[]; for(var z in g.d) if(z.charAt(0)==="q") qs.push({id:z,s:sc(z)});
  qs.sort(function(a,b){ return b.s-a.s || a.id.localeCompare(b.id); });
  g.qtop=qs.slice(0,4).map(function(x){ return x.id; });
  g.mi=qs.slice(0,4).reduce(function(a,x){ return a+x.s; },0);
  g.bo=g.d.x1?sc("x1"):0;
  var txt=""; for(var q in g.d) for(var f in g.d[q]) txt+=String(g.d[q][f]||"")+" ";
  g.terms=TERMS.filter(function(w){ return txt.indexOf(w)>=0; });
  g.te=Math.min(5,g.terms.length);
  g.task=g.mo+g.mi+g.te;
  g.nq=Object.keys(g.ph).filter(function(z){ return z.charAt(0)==="q"; }).length;
  g.nreal=Object.keys(g.pics).filter(function(z){ return z.charAt(0)==="q"; }).length;
  return g;
}
function grp(cls,n){ var id=cls+"|第"+n+"組"; return G[id]||score(newGroup(cls,"第"+n+"組")); }

/* ---------- 個人心得：同一人可能散在好幾筆，每格取最新且非空 ---------- */
function refl(cls,s){
  var me=(cls+"-"+s.no).replace(/[.#$\[\]\/\s]/g,""), list=[];
  for(var k in ANS){
    var A=ANS[k]||{}; if(String(A.cls||"").trim()!==cls) continue;
    var R=A.rf||{};
    for(var rid in R){ var x=R[rid]||{}; if(rid===me||String(x.nm||"").trim()===s.name) list.push(x); }
  }
  list.sort(function(a,b){ return (+b.at||0)-(+a.at||0); });
  var o={a:"",b:"",c:"",n:list.length};
  ["a","b","c"].forEach(function(z){
    for(var i=0;i<list.length;i++) if(String(list[i][z]||"").trim()){ o[z]=String(list[i][z]); break; }
  });
  return o;
}
function reflScore(r){
  var R=CFG.REFL, la=len(r.a), lb=len(r.b), lc=len(r.c);
  function part(n,x){ return Math.min(x.pts,Math.floor(n/x.min*x.pts)); }
  var all=r.a+" "+r.b+" "+r.c;
  var terms=TERMS.filter(function(w){ return all.indexOf(w)>=0; });
  var o={a:part(la,R.a),b:part(lb,R.b),t:Math.min(R.terms,terms.length),c:part(lc,R.c),terms:terms,la:la,lb:lb,lc:lc};
  o.sum=o.a+o.b+o.t+o.c;
  return o;
}
function student(cls,s){
  var g=grp(cls,s.grp), r=refl(cls,s), rs=reflScore(r);
  var gc=man(g.id,"c"), gg=man(g.id,"g"), grand=g.task+gc+gg;
  var gp=Math.round(grand*CFG.GROUP_WEIGHT*10)/10;
  var fin=Math.min(100,Math.round(gp+rs.sum+(CFG.BONUS_ADD?g.bo:0)));
  var mem=STUDENTS[cls].filter(function(x){ return x.grp===s.grp; }).map(function(x){ return x.name; }).join("、");
  return {cls:cls,s:s,g:g,r:r,rs:rs,gc:gc,gg:gg,grand:grand,gp:gp,fin:fin,mem:mem};
}

function firstPic(g,pref){
  var ks=Object.keys(g.pics).filter(function(z){ return z.charAt(0)===pref; }).sort();
  if(pref==="q") ks.sort(function(a,b){ return (g.qtop.indexOf(a)<0)-(g.qtop.indexOf(b)<0) || a.localeCompare(b); });

}
function answers(q,row){
  row=row||{};

    ["a","b","c"].forEach(function(p,i){

    var head=q.f.slice(0,q.inline).map(function(f){ var t=String(row[f.k]||"").trim(); return t?'<span class="lb">'+esc(f.l)+'</span>'+esc(t):""; }).filter(Boolean);
    if(head.length) h.push('<p class="an">'+head.join("　　")+'</p>');
    q.f.slice(q.inline).forEach(function(f){ var t=String(row[f.k]||"").trim(); if(t) h.push('<p class="an"><span class="lb">'+esc(f.l)+'</span>'+br(t)+'</p>'); });
  } else {
    q.f.forEach(function(f){ var t=String(row[f.k]||"").trim(); if(t) h.push('<p class="an"><span class="lb">'+esc(f.l)+'</span>'+br(t)+'</p>'); });
  }
  return h.length?h.join(""):'<p class="an none">（本組未作答）</p>';

function fit(root){

    var b=p.querySelector(".body"), fs=CFG.FS;
    b.style.fontSize=fs+"pt";
    while(b.scrollHeight>b.clientHeight+1&&fs>CFG.FS_MIN){ fs=Math.round((fs-0.25)*100)/100; b.style.fontSize=fs+"pt"; }
  });
}

  root.querySelectorAll(".pic").forEach(function(el){
    var m=/url\('(.*)'\)/.exec(el.getAttribute("style")||""); if(!m) return;
    ps.push(new Promise(function(res){ var i=new Image(); i.onload=i.onerror=function(){ res(); }; i.src=m[1]; }));
  });
  return Promise.all(ps).then(function(){ return new Promise(function(r){ requestAnimationFrame(function(){ r(); }); }); });
}

/* ---------- PDF ---------- */
async function makePdf(D){
  var st=$("stage");
  st.innerHTML=pagesHTML(D).join("");
  await settle(st);
  fit(st);
  var pages=st.querySelectorAll(".page"), blob=null;
  var tries=[{s:2,q:0.82},{s:1.6,q:0.72},{s:1.3,q:0.6}];
  for(var t=0;t<tries.length;t++){
    var pdf=new jspdf.jsPDF({unit:"mm",format:"a4",compress:true});
    pdf.setProperties({title:D.cls+" "+D.s.no+" "+D.s.name+" 職場體驗學習成果",author:CFG.SCHOOL});
    for(var i=0;i<pages.length;i++){
      var cv=await html2canvas(pages[i],{scale:tries[t].s,backgroundColor:"#ffffff",logging:false,useCORS:true});
      if(i) pdf.addPage();
      pdf.addImage(cv.toDataURL("image/jpeg",tries[t].q),"JPEG",0,0,210,297,undefined,"FAST");
    }
    blob=pdf.output("blob");
    if(blob.size<=CFG.MAX_BYTES) break;
  }
  st.innerHTML="";
  return blob;
}
function save(blob,name){
  var a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=name;
  a.style.display="none"; document.body.appendChild(a); a.click();
  setTimeout(function(){ try{ a.remove(); URL.revokeObjectURL(a.href); }catch(e){} },2000);
}

/* ---------- 畫面 ---------- */
function list(){
  var out=[];
  Object.keys(STUDENTS).forEach(function(c){
    if(filt&&c!==filt) return;
    STUDENTS[c].forEach(function(s){ out.push(student(c,s)); });
  });
  return out;
}
function paintRule(){
  var R=CFG.REFL;
  $("rule").innerHTML='<b>個人總分</b> ＝ 小組成績（任務 85＋創意 10＋GPS 補分 5，滿分 100）× '+Math.round(CFG.GROUP_WEIGHT*100)+'%'
    +'　＋　<b>個人心得 30</b>（印象最深 '+R.a.min+' 字 '+R.a.pts+' 分、參訪心得 '+R.b.min+' 字 '+R.b.pts+' 分、心得中用到商業名詞每個 1 分最多 '+R.terms+' 分、建議 '+R.c.min+' 字 '+R.c.pts+' 分，字數不足按比例）'
    +(CFG.BONUS_ADD?'　＋　加碼關（上限 100）':'')+'。權重在檔案最上面的 CFG 可以改。';
}
function paintGroups(){
  var h=[];
  Object.keys(STUDENTS).forEach(function(c){
    if(filt&&c!==filt) return;
    for(var n=1;n<=7;n++){
      var g=grp(c,n), id=g.id;
      h.push('<tr><td>'+esc(c+" 第"+n+"組")+(g.keys.length>1?'<span class="pill">合併 '+g.keys.length+'</span>':'')+(!g.keys.length?'<span class="pill warn">無紀錄</span>':'')+'</td>');
      h.push('<td class="n">'+g.task+'</td>');
      h.push('<td class="n"><input class="numin" data-id="'+esc(id)+'" data-f="c" type="number" min="0" max="10" value="'+man(id,"c")+'"></td>');
      h.push('<td class="n"><input class="numin" data-id="'+esc(id)+'" data-f="g" type="number" min="0" max="5" value="'+man(id,"g")+'"></td>');
      h.push('<td class="n"><b>'+(g.task+man(id,"c")+man(id,"g"))+'</b></td>');
      h.push('<td class="n">'+(g.nreal<g.nq?'<span class="pill warn" title="學生手機上有拍，但沒有傳上雲端">'+g.nreal+'/'+g.nq+'</span>':g.nreal)+'</td></tr>');
    }
  });
  $("gt").innerHTML=h.join("");
}
function paintList(){
  var L=list(), h=[], wrote=0;
  L.forEach(function(D){
    var k=D.cls+"|"+D.s.no, warn=[];
    if(D.rs.lb>0) wrote++;
    if(!D.r.n) warn.push('<span class="pill warn">心得未上傳</span>');
    else if(D.rs.lb<CFG.REFL.b.min) warn.push('<span class="pill warn">心得不足</span>');
    h.push('<tr class="s'+(cur===k?" cur":"")+'" data-k="'+esc(k)+'"><td>'+esc(D.s.no+"　"+D.s.name)+warn.join("")+'</td>');
    h.push('<td>'+esc((filt?"":D.cls.slice(-1)+" ")+"第"+D.s.grp+"組")+'</td>');
    h.push('<td class="n">'+D.rs.lb+'</td><td class="n">'+D.rs.sum+'</td><td class="n"><b>'+D.fin+'</b></td>');
    h.push('<td class="n"><button class="dl" data-pdf="'+esc(k)+'">PDF</button></td></tr>');
  });
  $("tb").innerHTML=h.join("")||'<tr><td colspan="6">沒有資料</td></tr>';
  $("cnt").textContent=L.length+" 人，"+wrote+" 人有寫心得";
}
function paint(){ paintGroups(); paintList(); if(cur) preview(cur); }
function find(k){ var p=k.split("|"); var s=(STUDENTS[p[0]]||[]).filter(function(x){ return x.no===p[1]; })[0]; return s?student(p[0],s):null; }
async function preview(k){
  var D=find(k); if(!D) return;
  cur=k;
  document.querySelectorAll("tr.s").forEach(function(tr){ tr.classList.toggle("cur",tr.dataset.k===k); });
  $("pvt").textContent=D.cls+"　"+D.s.no+"　"+D.s.name+"　個人總分 "+D.fin;
  $("pdf1").disabled=false; $("prt1").disabled=false;
  var pv=$("pv");
  pv.innerHTML='<div class="zoomer">'+pagesHTML(D).join("")+'</div>';
  var z=pv.firstChild;
  await settle(z); fit(z); zoom();
}
function zoom(){
  var pv=$("pv"), z=pv.firstChild; if(!z||!z.classList||!z.classList.contains("zoomer")) return;
  var pw=z.querySelector(".page"); if(!pw) return;
  var w=pw.offsetWidth, s=Math.min(1,(pv.clientWidth-24)/w);
  z.style.transform="scale("+s+")";
  z.style.width=(pv.clientWidth/s)+"px";
  pv.style.height=(z.scrollHeight*s+28)+"px";
}
window.addEventListener("resize",zoom);

function setProg(p,txt){
  var b=$("prog"); b.style.display=p==null?"none":"block"; if(p!=null) b.firstChild.style.width=Math.round(p*100)+"%";
  if(txt!=null) $("st").textContent=txt;
}
async function one(k){
  if(busy) return; busy=true;
  var D=find(k);
  setProg(0.3,"產生中⋯ "+D.s.name);
  try{ var b=await makePdf(D); save(b,fname(D)); setProg(null,"已下載 "+fname(D)+"（"+(b.size/1048576).toFixed(1)+" MB）"); }
  catch(e){ setProg(null,"失敗："+e.message); }
  busy=false;
}
async function batch(){
  if(busy) return; busy=true;
  var L=list(), zip=new JSZip(), big=0;
  $("zip").disabled=true;
  for(var i=0;i<L.length;i++){
    setProg(i/L.length,"產生中 "+(i+1)+" / "+L.length+"　"+L[i].cls+" "+L[i].s.name);
    try{ var b=await makePdf(L[i]); if(b.size>CFG.MAX_BYTES) big++; zip.file(fname(L[i]),b); }
    catch(e){ console.error(e); }
  }
  setProg(1,"壓縮中⋯");
  var z=await zip.generateAsync({type:"blob"});
  save(z,"職場體驗學習成果_"+(filt||"全部")+".zip");
  setProg(null,"完成 "+L.length+" 份"+(big?"（有 "+big+" 份超過 4MB）":""));
  $("zip").disabled=false; busy=false;
}

/* ---------- 事件 ---------- */
document.addEventListener("click",function(e){
  var b=e.target.closest("button");
  if(b&&b.dataset.cls!==undefined){
    filt=b.dataset.cls;
    document.querySelectorAll("[data-cls]").forEach(function(x){ x.classList.toggle("on",x===b); });
    paint(); return;
  }
  if(b&&b.dataset.pdf){ one(b.dataset.pdf); return; }
  if(b&&b.id==="pdf1"&&cur){ one(cur); return; }
  if(b&&b.id==="prt1"&&cur){
    var z=$("pv").querySelector(".zoomer"); if(!z) return;
    $("printbox").innerHTML=z.innerHTML;
    setTimeout(function(){ window.print(); },80); return;
  }
  if(b&&b.id==="zip"){ batch(); return; }
  if(b&&b.id==="reload"){ load(); return; }
  var tr=e.target.closest("tr.s");
  if(tr){ preview(tr.dataset.k); }
});
document.addEventListener("change",function(e){
  if(e.target.id==="pf"){ PF=e.target.checked; try{ localStorage.setItem("ylhc-photofree",PF?"1":"0"); }catch(x){} buildGroups(); paint(); }
  if(e.target.id==="showsc"){ SHOWSC=e.target.checked; try{ localStorage.setItem("ylhc-pf-showsc",SHOWSC?"1":"0"); }catch(x){} if(cur) preview(cur); }
  var el=e.target;
  if(el.classList&&el.classList.contains("numin")){
    var mx=el.dataset.f==="c"?10:5, v=Math.max(0,Math.min(mx,+el.value||0));
    el.value=v; manual[el.dataset.id]=manual[el.dataset.id]||{}; manual[el.dataset.id][el.dataset.f]=v; saveMan(); paint();
  }
});

/* ---------- 讀資料（一次讀完，不掛即時監聽） ---------- */
var db=null;
function load(){
  try{
    if(!db){ firebase.initializeApp(FB_CONFIG); db=firebase.database(); }
    $("st").textContent="讀取答案⋯";
    db.ref("e/"+EVENT_ID+"/ans").once("value").then(function(s){
      ANS=s.val()||{};
      $("st").textContent="讀取照片⋯（照片比較大，要等一下）";
      return db.ref("e/"+EVENT_ID+"/pic").once("value");
    }).then(function(s){
      PIC=s.val()||{};
      buildGroups(); paint();
      $("st").textContent="已讀取 "+Object.keys(ANS).length+" 筆紀錄";
      $("zip").disabled=false;
    }).catch(function(e){ $("st").textContent="讀取失敗："+e.message; });
  }catch(e){ $("st").textContent="連線失敗："+e.message; }
}
$("pf").checked=PF; $("showsc").checked=SHOWSC;
paintRule();
load();
})();
</script>
