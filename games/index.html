<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f8f6f0">
<title>ㄊㄩ的遊戲大廳 · 今天也玩懂一點</title>
<style>
:root{--paper:#f8f6f0;--ink:#292631;--muted:#706b79;--purple:#7052b5;--line:#dedbd4;--lilac:#e8def7;--green:#dce9d9}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:"Microsoft JhengHei","PingFang TC",sans-serif;line-height:1.6}
button,input{font:inherit}
button,a{-webkit-tap-highlight-color:transparent}
button{cursor:pointer}
a{color:inherit}
button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid var(--purple);outline-offset:5px}
.shell{max-width:1200px;margin:auto;padding:0 40px}
.topbar{display:flex;align-items:center;justify-content:space-between;min-height:94px;border-bottom:1px solid var(--line);gap:16px}
.brand{text-decoration:none;font-weight:900;letter-spacing:.03em;display:flex;align-items:center;gap:12px}
.brand-mark{display:grid;place-items:center;background:var(--purple);color:white;width:40px;height:40px;border-radius:13px;font-size:19px;transform:rotate(-7deg)}
.top-note{font-size:12px;letter-spacing:.12em;color:var(--muted)}
.top-note i{display:inline-block;width:7px;height:7px;border-radius:50%;background:#71946a;margin-right:8px}
.hero{display:grid;grid-template-columns:1.25fr 1fr;gap:24px;align-items:center;padding:54px 0 46px}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.19em;color:var(--purple);display:flex;align-items:center;gap:10px}
.eyebrow:before{content:"";height:1px;width:28px;background:var(--purple)}
h1{font-size:clamp(36px,4.5vw,58px);line-height:1.3;letter-spacing:-.045em;margin:20px 0 17px;font-weight:900}
h1 em{font-style:normal;color:var(--purple);position:relative;white-space:nowrap}
h1 em:after{content:"";position:absolute;left:0;right:0;bottom:-7px;height:5px;background:#d5c3ef;transform:rotate(-2deg);border-radius:50%}
.intro{font-size:14px;line-height:1.9;color:var(--muted);margin:22px 0}
.hero-meta{display:flex;gap:18px;font-size:12px;align-items:center}
.hero-meta b{font-size:18px;color:var(--purple);margin-right:4px}
.hero-meta span+span{border-left:1px solid var(--line);padding-left:18px}
.art{height:282px;position:relative;isolation:isolate;display:flex;align-items:center;justify-content:center}
.orbit{position:absolute;width:270px;height:250px;background:#eee8f4;border-radius:50%;transform:rotate(-15deg)}
.orbit:after{content:"";position:absolute;inset:-15px;border:1px dashed #c9bddd;border-radius:50%}
.ticket{position:absolute;right:6%;top:19px;z-index:3;background:#e2edcc;border:1.5px solid var(--ink);padding:8px 13px;border-radius:8px;transform:rotate(10deg);font-size:12px;font-weight:900;box-shadow:3px 3px 0 var(--ink)}
.calc{width:151px;height:198px;background:#9678cd;border:2px solid var(--ink);border-radius:22px;padding:18px;box-shadow:7px 8px 0 #45395d;transform:rotate(-12deg);position:relative;z-index:2}
.screen{height:44px;background:#ecf2d9;border:2px solid var(--ink);border-radius:7px;font-family:monospace;text-align:right;padding:5px 8px;font-size:23px;font-weight:700;letter-spacing:2px}
.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.keys span{height:22px;border:1.5px solid var(--ink);background:#f8f4eb;border-radius:6px;box-shadow:0 2px 0 #493d5b}
.keys span:last-child{background:#efbfa4}
.book{position:absolute;width:121px;height:155px;background:#bdd3b5;border:2px solid var(--ink);border-radius:6px 14px 14px 6px;transform:rotate(13deg);left:15%;bottom:8px;box-shadow:5px 5px 0 #475442;z-index:1}
.book:before{content:"";position:absolute;left:13px;top:0;bottom:0;border-left:2px solid #758d6e}
.book:after{content:"ABC";position:absolute;bottom:12px;right:10px;font:bold 22px Georgia;color:#354d34}
.spark{position:absolute;font-size:38px;color:var(--purple);right:12%;bottom:30px}
.spark.small{left:13%;top:27px;font-size:25px}
.art-label{position:absolute;bottom:-9px;right:19%;font-size:11px;color:#776987;letter-spacing:.16em;transform:rotate(-5deg)}
.reminder{display:flex;align-items:center;gap:12px;background:#eeebe4;border:1px solid #e2ded4;padding:13px 19px;border-radius:12px;font-size:13px;margin-bottom:40px}
.reminder .badge{font-size:17px}
.reminder strong{font-weight:700}
.reminder .end{margin-left:auto;color:var(--muted);font-size:11px;white-space:nowrap}
.library-heading{display:flex;align-items:baseline;gap:12px;margin-bottom:19px}
h2{font-size:23px;letter-spacing:-.03em;margin:0}
.library-heading span{font-size:11px;letter-spacing:.12em;color:var(--muted)}
.toolbar{display:flex;justify-content:space-between;align-items:center;gap:18px;margin-bottom:28px}
.tabs{display:flex;gap:7px;flex-wrap:wrap}
.tab{border:1px solid var(--line);background:transparent;border-radius:30px;padding:9px 17px;font-size:13px;color:#615b6c;display:flex;align-items:center;gap:8px;transition:.18s}
.tab span{font-size:10px;opacity:.8}
.tab[aria-pressed="true"]{background:var(--ink);color:white;border-color:var(--ink)}
.tab:hover{border-color:var(--purple)}
.search{display:flex;align-items:center;gap:10px;border-bottom:1px solid #b8b1c2;padding:9px 2px;min-width:240px}
.search svg{width:17px;height:17px;flex-shrink:0;color:#71677d}
.search input{width:100%;min-width:0;background:none;border:0;color:var(--ink);font-size:13px}
.search input:focus{outline:none}
.search:focus-within{border-color:var(--purple);box-shadow:0 2px 0 var(--purple)}
.group{margin-bottom:35px}
.section-head{display:flex;align-items:center;gap:10px;margin:0 0 14px;font-size:13px;font-weight:700}
.section-head:after{content:"";height:1px;background:var(--line);flex:1}
.section-head small{color:var(--muted);font-size:10px;font-weight:400}
.section-dot{height:8px;width:8px;border-radius:3px;background:#9678cd}
.group.biz .section-dot{background:#7a9872}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.card{display:flex;flex-direction:column;text-decoration:none;background:#fffefa;border:1px solid var(--line);border-radius:18px;padding:21px;min-height:226px;transition:transform .18s,box-shadow .18s,border-color .18s;position:relative}
.card:hover{transform:translateY(-4px);box-shadow:0 9px 0 -4px #d8cbea;border-color:#aa90cf}
.biz .card:hover{box-shadow:0 9px 0 -4px #cfddc9;border-color:#97b28b}
.card-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
.icon{background:var(--lilac);border-radius:12px;width:42px;height:42px;display:grid;place-items:center;font-size:20px;font-weight:700;color:#70529b;font-family:Georgia,serif}
.biz .icon{background:var(--green);color:#55764b}
.card-no{font-size:10px;color:#96909c;letter-spacing:.13em}
.card h3{font-size:16px;line-height:1.55;margin:0 0 8px;letter-spacing:.01em}
.card p{font-size:12px;color:var(--muted);line-height:1.8;margin:0 0 18px}
.card-foot{margin-top:auto;display:flex;align-items:center;justify-content:space-between;font-size:10px;color:#877a9a}
.card-foot .arrow{display:grid;place-items:center;border:1px solid #ddd5e8;border-radius:50%;width:25px;height:25px;font-size:15px;color:var(--purple);transition:.18s}
.card:hover .arrow{background:var(--purple);color:white;border-color:var(--purple)}
.card.soon{opacity:.6}
.empty{padding:65px 20px;text-align:center;border:1px dashed #c8bfd2;border-radius:18px;color:var(--muted)}
.empty strong{display:block;color:var(--ink);font-size:19px;margin-bottom:8px}
.reset{margin-top:17px;padding:9px 18px;border:0;border-radius:25px;background:var(--purple);color:white}
.result{font-size:12px;color:var(--muted);margin:-10px 0 20px}
.footer{border-top:1px solid var(--line);padding:24px 0 32px;display:flex;justify-content:space-between;gap:12px;font-size:11px;color:var(--muted)}
.footer b{color:var(--purple);font-weight:500}
@media(min-width:1400px){
  .hero{padding-top:66px;padding-bottom:58px}
}
@media(max-width:850px){
  .shell{padding:0 25px}
  .grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .hero{grid-template-columns:1.2fr 1fr}
  .art{transform:scale(.85)}
  .ticket{right:-5%}
  .book{left:0}
  .toolbar{align-items:stretch;flex-direction:column}
  .search{max-width:none}
  .top-note{letter-spacing:0}
}
@media(max-width:540px){
  .shell{padding:0 20px}
  .topbar{min-height:76px}
  .brand{font-size:14px;gap:9px}
  .brand-mark{width:33px;height:33px;font-size:16px}
  .top-note{font-size:10px}
  .hero{grid-template-columns:1fr;padding:34px 0 25px;gap:0}
  h1{font-size:40px;margin-top:16px}
  .intro{font-size:13px}
  .art{height:226px;transform:scale(.85);margin-top:5px;margin-bottom:0}
  .ticket{right:9%;top:0}
  .book{left:18%;bottom:-3px}
  .art-label{bottom:-27px}
  .reminder{margin-bottom:31px;align-items:flex-start;padding:12px;font-size:12px}
  .reminder .end{display:none}
  .library-heading span{font-size:10px}
  .toolbar{gap:15px;margin-bottom:23px}
  .tab{padding:8px 14px}
  .grid{grid-template-columns:1fr;gap:12px}
  .card{min-height:0;padding:19px;display:grid;grid-template-columns:43px 1fr;column-gap:15px}
  .card-top{display:contents}
  .icon{grid-column:1;grid-row:1 / 4}
  .card-no{display:none}
  .card h3{grid-column:2;font-size:16px;margin-bottom:6px}
  .card p{grid-column:2;margin-bottom:12px}
  .card-foot{grid-column:2}
  .footer{font-size:10px;align-items:center}
  .footer span:last-child{max-width:115px;text-align:right}
}
@media(prefers-reduced-motion:reduce){
  *{transition:none!important;scroll-behavior:auto!important}
}
</style>
</head>
<body>
<div class="shell">
  <header class="topbar">
    <a class="brand" href="./" aria-label="ㄊㄩ的遊戲大廳首頁">
      <span class="brand-mark" aria-hidden="true">ㄊㄩ</span>
      ㄊㄩ的遊戲大廳
    </a>
    <span class="top-note">
      <i aria-hidden="true"></i>Accounting oh ya
    </span>
  </header>

  <main>
    <section class="hero" aria-labelledby="hero-title">
      <div>
        <div class="eyebrow">LEARN A LITTLE. PLAY A LOT.</div>
        <h1 id="hero-title">今天也，<br><em>玩懂一點。</em></h1>
        <p class="intro">
          把課本裡的「蛤？」變成「喔！」<br>
          選一個遊戲，開始你的商業與會計小冒險。
        </p>
        <div class="hero-meta">
          <span><b>19</b> 個遊戲入口</span>
          <span><b>2</b> 大學習科目</span>
        </div>
      </div>

      <div class="art" aria-hidden="true">
        <div class="orbit"></div>
        <div class="ticket">學習中，請勿無聊 ✦</div>
        <div class="book"></div>
        <div class="calc">
          <div class="screen">OH YA!</div>
          <div class="keys">
            <span></span><span></span><span></span>
            <span></span><span></span><span></span>
            <span></span><span></span><span></span>
          </div>
        </div>
        <span class="spark">✦</span>
        <span class="spark small">✧</span>
        <span class="art-label">A LITTLE PLAY, A LITTLE PROGRESS.</span>
      </div>
    </section>

    <aside class="reminder">
      <span class="badge" aria-hidden="true">✉</span>
      <span>
        <strong>玩完別忘了領成績卡！</strong>
        產生後傳給老師加分。
      </span>
      <span class="end">每一次練習，都算數。</span>
    </aside>

    <section aria-labelledby="library-title">
      <div class="library-heading">
        <h2 id="library-title">挑一個，開玩。</h2>
        <span>THE GAME COLLECTION</span>
      </div>

      <div class="toolbar">
        <div class="tabs" role="group" aria-label="依科目篩選">
          <button class="tab" data-filter="all" aria-pressed="true">
            全部遊戲 <span>19</span>
          </button>
          <button class="tab" data-filter="acc" aria-pressed="false">
            會計學 <span>8</span>
          </button>
          <button class="tab" data-filter="biz" aria-pressed="false">
            商業概論 <span>11</span>
          </button>
        </div>

        <label class="search">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="1.7" aria-hidden="true">
            <circle cx="10" cy="10" r="6.5"/>
            <path d="m15 15 6 6"/>
          </svg>
          <input id="search" type="search"
                 placeholder="搜尋遊戲、章節或關鍵字…"
                 aria-label="搜尋遊戲、章節或關鍵字">
        </label>
      </div>

      <p class="result" id="result" role="status" aria-live="polite"></p>
      <div id="menu"></div>
    </section>
  </main>

  <footer class="footer">
    <span>ㄊㄩ的遊戲大廳 <b> / 2.0</b></span>
    <span>Made for curious minds.<br>Powered by ㄊㄩ</span>
  </footer>
</div>

<script>
const SUBJECTS = [
  {
    subject: "會 計 學",
    items: [
      {
        url: "./acc/account-sort.html",
        title: "會計項目分類挑戰",
        desc: "162 項目考五大類別|字首字尾特訓|街機:會計方塊"
      },
      {
        url: "./acc/journal-rules.html",
        title: "借貸法則大挑戰",
        desc: "分錄式作答!三條命限時挑戰,FEVER 連擊拚高分"
      },
      {
        url: "./acc/transaction-type.html",
        title: "交易鑑定所",
        desc: "一筆傳票連判三關:對內外、簡單複雜、現金轉帳混合"
      },
      {
        url: "./acc/accounting-equation01.html",
        title: "衛生組長的雜貨鋪",
        desc: "老師陪你弄懂會計方程式的大架構!"
      },
      {
        url: "./acc/accounting-equation02.html",
        title: "會計方程式小練習",
        desc: "會計方程式，熟能生巧!"
      },
      {
        url: "./journal-practice/index.html",
        title: "日常分錄全部擊破",
        desc: "日常分錄!"
      },
      {
        url: "./ais/index.html",
        title: "會計資訊檢定丙級手機練習用系統",
        desc: "解決學生分錄不熟的問題，但還是得上機練喔！"
      },
      {
        url: "./ais-grader/index.html",
        title: "會計資訊丙級電腦評分系統",
        desc: "已上線，學生都說好用!"
      }
    ]
  },
  {
    subject: "商 業 概 論",
    items: [
      {
        url: "./biz/biz-review.html",
        title: "★ 商概總複習大挑戰",
        desc: "跨十章統測高頻考點總驗收|六大關卡制"
      },
      {
        url: "./biz/biz01.html",
        title: "CH1 商業基本概念",
        desc: "翻轉商店街|四要件、生產效用、Carroll 四責任、社會企業"
      },
      {
        url: "./biz/biz02.html",
        title: "CH2 創業與企業家精神",
        desc: "Boba Lab 創業大冒險|SWOT、SOHO/斜槓族、保險與危機管理"
      },
      {
        url: "./biz/biz03.html",
        title: "CH3 商業現代化",
        desc: "桃記柑仔店轉型記|五流四卡、POS/EOS/EDI/RFID、消保法"
      },
      {
        url: "./biz/biz04.html",
        title: "CH4 商業經營型態",
        desc: "金桃柑仔店重生記|業種業態、店鋪與無店鋪、批發業、PDC/DC"
      },
      {
        url: "./biz/biz05.html",
        title: "CH5 連鎖與加盟經營",
        desc: "柑仔店大冒險|FIFO、加盟四要件、FC1/FC2、三金、3S 原則"
      },
      {
        url: "./biz/biz06.html",
        title: "CH6 行銷管理",
        desc: "桃氣手搖翻身戰|行銷觀念演進、產品五層次、PS/SP/PR/DM"
      },
      {
        url: "./biz/biz07.html",
        title: "CH7 人力資源管理",
        desc: "請人風雲|選用育晉留、工作說明書vs規範、月暈效應、勞基法"
      },
      {
        url: "./biz/biz08.html",
        title: "CH8 財務管理",
        desc: "小桃第二季|5C 信用、16 項財務比率、ROA/ROE/EPS/P/E"
      },
      {
        url: "./biz/biz09.html",
        title: "CH9 商業法律",
        desc: "嬤嬤辣創業記|著作權、營業秘密、先申請主義、消保法、公平法"
      },
      {
        url: "./biz/biz10.html",
        title: "CH10 商業未來發展",
        desc: "阿嬤的古早味・電商創業記|行動支付四類、電商平台、Glueck 策略"
      }
    ]
  }
];

const icons = {
  acc: ["≡", "±", "⇄", "⌂", "＝", "✎", "▦", "✓"],
  biz: ["★", "01", "02", "03", "04", "05", "06", "07", "08", "09", "10"]
};

let filter = "all";
const search = document.getElementById("search");

const escapeHTML = s => s.replace(/[&<>"']/g, c => ({
  "&": "&amp;",
  "<": "&lt;",
  ">": "&gt;",
  '"': "&quot;",
  "'": "&#39;"
}[c]));

function render() {
  const q = search.value.trim().toLocaleLowerCase();
  let total = 0;

  const output = SUBJECTS.map((s, si) => {
    const key = si === 0 ? "acc" : "biz";

    if (filter !== "all" && filter !== key) {
      return "";
    }

    const items = s.items
      .map((g, i) => ({ ...g, index: i }))
      .filter(g =>
        (
          g.title + " " +
          g.desc + " " +
          s.subject.replaceAll(" ", "")
        ).toLocaleLowerCase().includes(q)
      );

    total += items.length;

    if (!items.length) {
      return "";
    }

    return (
      '<section class="group ' + key + '" aria-label="' +
      s.subject.replaceAll(" ", "") + '">' +
      '<h3 class="section-head">' +
      '<span class="section-dot"></span>' +
      s.subject.replaceAll(" ", "") +
      ' <small>' + items.length + ' 個遊戲</small></h3>' +
      '<div class="grid">' +
      items.map(g => {
        const tag = g.soon ? "div" : "a";

        return (
          '<' + tag + ' class="card' + (g.soon ? ' soon' : '') + '" ' +
          (
            g.soon
              ? 'aria-disabled="true"'
              : 'href="' + escapeHTML(g.url) + '"'
          ) + '>' +
          '<div class="card-top">' +
          '<span class="icon" aria-hidden="true">' +
          icons[key][g.index] + '</span>' +
          '<span class="card-no">' + key.toUpperCase() + ' / ' +
          String(g.index + 1).padStart(2, "0") + '</span>' +
          '</div>' +
          '<h3>' + escapeHTML(g.title) + '</h3>' +
          '<p>' + escapeHTML(g.desc) + '</p>' +
          '<div class="card-foot"><span>' +
          (
            g.soon
              ? '製作中，敬請期待'
              : si === 0
                ? 'ACCOUNTING · 會計練功'
                : 'BUSINESS · 商業探索'
          ) +
          '</span><span class="arrow" aria-hidden="true">' +
          (g.soon ? '…' : '↗') +
          '</span></div></' + tag + '>'
        );
      }).join("") +
      '</div></section>'
    );
  }).join("");

  document.getElementById("result").textContent =
    q ? '找到 ' + total + ' 個符合的遊戲' : "";

  document.getElementById("result").hidden = !q;

  document.getElementById("menu").innerHTML = total
    ? output
    : '<div class="empty">' +
      '<strong>這個關鍵字還沒有找到遊戲</strong>' +
      '試試「分錄」、「行銷」或「CH1」。<br>' +
      '<button class="reset" id="reset">查看全部遊戲</button>' +
      '</div>';

  const reset = document.getElementById("reset");

  if (reset) {
    reset.onclick = () => {
      search.value = "";
      setFilter("all");
      search.focus();
    };
  }
}

function setFilter(value) {
  filter = value;

  document.querySelectorAll(".tab").forEach(b =>
    b.setAttribute(
      "aria-pressed",
      String(b.dataset.filter === value)
    )
  );

  render();
}

document.querySelectorAll(".tab").forEach(b =>
  b.addEventListener("click", () => setFilter(b.dataset.filter))
);

search.addEventListener("input", render);
render();
</script>
</body>
</html>
