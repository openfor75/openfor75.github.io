<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>會計資訊丙級 分錄練習｜會計資訊系統(手機版)</title>
<meta name="description" content="勞動部會計資訊丙級術科的分錄練習工具。用手機逐題登入傳票或日記簿分錄,隨時查帳看各會計項目餘額,全部登完自動對帳找錯。收錄 14902 系列題組,免費、免註冊、不蒐集個人資料。designed by 教會計的林ㄊㄩ。">
<meta name="author" content="林亭妤">
<meta property="og:type" content="website">
<meta property="og:title" content="會計資訊丙級 分錄練習｜會計資訊系統(手機版)">
<meta property="og:description" content="用手機練會計資訊丙級分錄:選傳票別、登分錄、隨時查帳、自動對帳找錯。免費免註冊。">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Huninn&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#FAF7F0; --ink:#1F1B18; --ink2:#5C534A; --ink3:#9C9188;
  --line:rgba(60,50,40,.09); --margin:rgba(206,116,116,.55);
  --amber:#FFF0C9; --amber-b:#E0A02A;
  --red:#C62828; --green:#2E7D5B; --blue:#1F5E8C;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  font-family:'Huninn','jf-openhuninn','LiHei Pro','PingFang TC','Microsoft JhengHei',sans-serif;
  font-size:17px; line-height:1.6; color:var(--ink);
  background-color:var(--paper);
  background-image:
    repeating-linear-gradient(to bottom, transparent 0 27px, var(--line) 27px 28px),
    linear-gradient(to right, transparent 0 25px, var(--margin) 25px 26.5px, transparent 26.5px);
  background-attachment:local;
  touch-action:manipulation;
  -webkit-text-size-adjust:100%;
}
button,input{font-family:inherit;font-size:17px;color:var(--ink)}
button{cursor:pointer}
.wrap{max-width:560px;margin:0 auto;padding:0 14px 0 40px}
.mono{font-variant-numeric:tabular-nums}

/* ---------- 通用元件 ---------- */
.btn{min-height:46px;padding:0 16px;border:2.5px solid var(--ink);border-radius:14px;background:#fff;font-weight:800;
     box-shadow:3px 3px 0 rgba(31,27,24,.12)}
.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 rgba(31,27,24,.12)}
.btn.primary{background:var(--ink);color:#FFFDF8}
.btn.ghost{border-width:2px;box-shadow:none;font-weight:700;color:var(--ink2);min-height:40px;padding:0 12px;font-size:15px}
.btn.wide{width:100%}
.btn[disabled]{opacity:.4;pointer-events:none}
.pill{display:inline-block;border:2px solid var(--ink);border-radius:999px;padding:2px 11px;font-size:14px;font-weight:800;background:#fff;margin:0 5px 5px 0}
.pill.soft{border-color:var(--ink3);color:var(--ink2);font-weight:700}
.muted{color:var(--ink2)}
.small{font-size:14.5px}
.hr{height:0;border-top:2px dashed #D8CFC4;margin:18px 0}

/* ---------- 頂部 ---------- */
#top{position:sticky;top:0;z-index:30;background:#FFFDF8;border-bottom:3px solid var(--ink)}
#top .bar{max-width:560px;margin:0 auto;padding:8px 14px}
#top .row1{display:flex;align-items:center;gap:8px}
#top .title{font-weight:900;font-size:18px;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#top .notes{font-size:13.5px;color:var(--ink2);margin-top:4px;line-height:1.5}
#top .row1 .title{flex:none}
#top .byline{flex:1;min-width:0;font-size:11.5px;color:var(--ink3);white-space:nowrap;line-height:1.2}
#top .byline b{display:block;font-size:13px;font-weight:900;color:var(--ink);letter-spacing:.01em}
.prog{height:9px;background:#EDE6DB;border:2px solid var(--ink);border-radius:999px;margin-top:7px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--ink);width:0}

/* ---------- 首頁 ---------- */
.hero{padding:26px 0 10px}
.hero h1{font-size:31px;font-weight:900;margin:0;letter-spacing:.06em;line-height:1.25}
.hero .sub1{margin:9px 0 0;font-size:16.5px;font-weight:900;letter-spacing:.04em;color:var(--ink);
   border-bottom:2.5px solid var(--amber-b);display:inline-block;padding-bottom:2px}
.hero p{margin:9px 0 0;color:var(--ink2);font-size:15.5px}
.resume{margin-bottom:14px}
.setline{display:flex;gap:7px;align-items:stretch;margin-bottom:9px}
.setrow{flex:1;min-width:0;text-align:left;background:#fff;border:2.5px solid var(--ink);border-radius:15px;
        box-shadow:3px 4px 0 rgba(31,27,24,.10);padding:11px 13px;font-family:inherit;font-size:17px}
.setrow:active{transform:translate(2px,2px);box-shadow:1px 2px 0 rgba(31,27,24,.10)}
.sr-t{font-size:17.5px;font-weight:900;display:flex;align-items:baseline;gap:7px;flex-wrap:wrap}
.sr-no{font-size:12.5px;font-weight:700;color:var(--ink3)}
.sr-b{height:7px;background:#EDE6DB;border:1.5px solid var(--ink);border-radius:999px;margin-top:8px;overflow:hidden}
.sr-b i{display:block;height:100%;background:var(--ink)}
.sr-m{display:flex;justify-content:space-between;gap:8px;font-size:12.5px;color:var(--ink2);margin-top:5px}
.setclear{flex:none;width:48px;border:2px solid var(--ink3);border-radius:13px;background:#fff;color:var(--ink2);
        font-size:13px;font-weight:800;font-family:inherit;padding:0}
.chips{display:flex;gap:6px;margin:2px 0 13px;overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:2px}
.chips button{flex:none;min-height:40px;padding:0 14px;border:2.5px solid var(--ink);border-radius:999px;background:#fff;
        font-weight:800;font-size:14.5px;font-family:inherit}
.chips button.on{background:var(--ink);color:#FFFDF8}
.setcard{background:#fff;border:3px solid var(--ink);border-radius:20px;box-shadow:5px 6px 0 rgba(31,27,24,.10);padding:16px;margin:16px 0}
.setcard h2{margin:0;font-size:22px;font-weight:900}
.setcard .no{font-size:14px;color:var(--ink2);margin-top:2px}

/* ---------- 日記簿卡 ---------- */
.qbox{background:#fff;border:3px solid var(--ink);border-radius:18px;padding:13px 15px;margin:14px 0 4px;box-shadow:5px 6px 0 rgba(31,27,24,.10)}
.qbox .qno{font-weight:900;font-size:15px;color:var(--ink2);letter-spacing:.08em}
.qbox .qdate{color:var(--ink);font-size:16px;border-bottom:2px solid var(--amber-b);padding-bottom:1px}
.qbox .qtx{margin-top:5px;font-size:17.5px;line-height:1.75}
.cardlabel{font-size:14px;font-weight:800;color:var(--ink2);margin:16px 0 -6px 2px}
.jcard{background:#fff;border:3px solid var(--ink);border-radius:20px;box-shadow:5px 6px 0 rgba(31,27,24,.10);padding:13px 14px 14px;margin:12px 0}
.jhead{display:flex;align-items:baseline;justify-content:space-between;border-bottom:3px solid var(--ink);padding-bottom:9px}
.jhead .t{font-size:21px;font-weight:900;letter-spacing:.32em}
.jhead .d{font-size:16.5px;font-weight:800;color:#4A423B}
.jrow{display:flex;align-items:center;gap:7px;margin-top:11px}
.jrow.cr{padding-left:26px}
.mk{width:23px;flex:none;font-size:19px;font-weight:900;text-align:center}
.fld{flex:1;min-width:0;min-height:44px;display:flex;align-items:center;padding:0 5px;font-size:17px;
     border-bottom:2.5px dashed #C0B7AC;background:none;text-align:left;border-radius:7px 7px 0 0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.amt{width:106px;flex:none;min-height:44px;display:flex;align-items:center;justify-content:flex-end;padding:0 5px;font-size:18px;
     border-bottom:2.5px dashed #C0B7AC;background:none;border-radius:7px 7px 0 0;font-variant-numeric:tabular-nums}
.fld.ph,.amt.ph{color:#BDB4A9;font-weight:400}
.fld.on,.amt.on{background:var(--amber);border-bottom-color:var(--amber-b)}
.del{width:26px;flex:none;border:none;background:none;color:var(--ink3);font-size:19px;line-height:1;padding:0}
.addrow{margin:7px 0 0 30px;border:none;background:none;color:var(--ink2);font-size:14.5px;font-weight:700;padding:6px 4px}
.jsum{display:flex;justify-content:space-between;align-items:center;margin-top:12px;padding-top:9px;border-top:2px dashed #D8CFC4;font-size:15px;font-weight:800}
.jsum .bal{color:var(--green)} .jsum .off{color:var(--red)}
.vpick{display:grid;gap:5px;margin:11px 0 3px}
.vpick.c4{grid-template-columns:repeat(4,1fr)} .vpick.c3{grid-template-columns:repeat(3,1fr)}
.nav4{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:16px 0 8px}
.nav4 .btn{min-height:58px;padding:0 3px;font-size:13.5px;line-height:1.25;box-shadow:2px 3px 0 rgba(31,27,24,.12)}
.delrow{text-align:right;margin:2px 0 0}
.modebtn{display:block;width:100%;text-align:left;border:2.5px solid var(--ink);border-radius:15px;background:#fff;
  padding:12px 14px;margin-bottom:9px;box-shadow:3px 3px 0 rgba(31,27,24,.12);font-family:inherit}
.modebtn b{display:block;font-size:18px} .modebtn span{display:block;font-size:13.5px;color:var(--ink2);margin-top:2px}
.modebtn.on{background:var(--ink);color:#FFFDF8} .modebtn.on span{color:#E8E0D4}
.vpick button{min-height:42px;border:2.5px solid var(--ink);border-radius:11px;background:#fff;font-size:14px;font-weight:800;padding:2px}
.vpick button.on{background:var(--ink);color:#FFFDF8}
.vhint{font-size:13px;color:var(--ink2);margin:2px 0 0 2px}
.lk{border:none;background:none;padding:0;font:inherit;color:var(--ink);font-weight:800;text-decoration:underline}
.fld.fixed{background:#F3EFE7;border-bottom-style:solid;border-bottom-color:var(--ink3);font-weight:800;color:var(--ink2)}
.lockmk{font-size:12px}
.vwarn{margin-top:10px;background:#FDECEA;border:2px solid var(--red);border-radius:11px;padding:7px 10px;font-size:14.5px;color:var(--red);font-weight:700}
.vsw{display:inline-block;border:2px solid var(--ink3);background:#fff;border-radius:999px;padding:2px 10px;font-size:13px;font-weight:800;color:var(--ink2);margin-left:4px}
.vsw.on{background:var(--ink);color:#FFFDF8;border-color:var(--ink)}
#toast{position:fixed;left:50%;transform:translateX(-50%) translateY(14px);bottom:calc(50% - 20px);z-index:60;background:var(--ink);color:#FFFDF8;
       padding:11px 20px;border-radius:999px;font-weight:800;font-size:15.5px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s}
#toast.on{opacity:.96;transform:translateX(-50%) translateY(0)}
.cardbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:10px 0 4px}
.cardbar .sp{flex:1;min-width:0}
.navrow{display:flex;gap:9px;margin:18px 0 6px}
.navrow .btn{flex:1}

/* ---------- 底部工具列 ---------- */
#dock{position:fixed;left:0;right:0;bottom:0;z-index:40;background:#FFFDF8;border-top:3px solid var(--ink);
      padding:7px 10px calc(7px + env(safe-area-inset-bottom));display:none}
#dock.on{display:block}
.dockbar{max-width:540px;margin:0 auto;display:flex;align-items:center;gap:7px}
.dockbar .disp{flex:1;min-height:42px;border:2.5px solid var(--ink);border-radius:12px;background:#fff;display:flex;align-items:center;
      justify-content:flex-end;padding:0 10px;font-size:22px;font-weight:900;font-variant-numeric:tabular-nums;overflow:hidden}
.dockbar .mini{min-height:42px;padding:0 11px;border:2.5px solid var(--ink);border-radius:12px;background:#fff;font-weight:800;font-size:15px;flex:none}
#padwrap{max-width:540px;margin:7px auto 0;display:none}
#padwrap.on{display:block}
#pad{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
#pad button{min-height:44px;border:2.5px solid var(--ink);border-radius:12px;background:#fff;font-size:19px;font-weight:800;padding:0}
#pad button.op{background:#F3EDE2} #pad button.fn{background:#EFE7DA;font-size:16px}
#pad button.go{background:var(--ink);color:#FFFDF8;font-size:17px}
#pad button:active{background:var(--amber)}
.hint{font-size:13px;color:var(--ink2);text-align:center;margin-top:5px}
.foot{margin-top:24px;padding-top:15px;border-top:2px dashed #D8CFC4;line-height:1.75}
.foot .fby{font-size:18px;font-weight:900;color:var(--ink);letter-spacing:.04em;margin-bottom:4px}
.foot .fsub{font-size:12.5px;color:var(--ink3)}
.foot .fsite{font-size:14px;font-weight:800;color:var(--ink2);margin-bottom:6px}
.foot a{color:var(--ink3)}
.scby{margin-top:13px;padding-top:10px;border-top:2px dashed #D8CFC4;font-size:12px;color:var(--ink2);line-height:1.7}
.scby b{font-size:14px;color:var(--ink)}

/* ---------- 抽屜 / 彈層 ---------- */
.scrim{position:fixed;inset:0;background:rgba(31,27,24,.42);z-index:50;display:none}
.scrim.on{display:block}
.sheet{position:fixed;left:0;right:0;bottom:0;max-height:86vh;z-index:51;background:var(--paper);
       border-top:3px solid var(--ink);border-radius:22px 22px 0 0;display:none;flex-direction:column;
       padding-bottom:env(safe-area-inset-bottom)}
.sheet.on{display:flex}
.sheet .sh{padding:12px 14px 8px;border-bottom:2.5px solid var(--ink);display:flex;align-items:center;gap:8px;flex:none}
.sheet .sh b{flex:1;font-size:18px}
.sheet .sb{overflow:auto;-webkit-overflow-scrolling:touch;padding:12px 14px 22px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.tabs button{flex:1;min-width:60px;min-height:42px;border:2.5px solid var(--ink);border-radius:12px;background:#fff;font-weight:800;font-size:15px}
.tabs button.on{background:var(--ink);color:#FFFDF8}
.srch{width:100%;min-height:46px;border:2.5px solid var(--ink);border-radius:13px;padding:0 12px;background:#fff;margin-bottom:10px}
.optlist{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.optlist button{min-height:48px;border:2.5px solid var(--ink);border-radius:13px;background:#fff;font-size:16px;font-weight:700;padding:4px 6px;line-height:1.25}
.acctrow{width:100%;display:flex;justify-content:space-between;align-items:center;gap:10px;min-height:48px;background:#fff;
         border:2.5px solid var(--ink);border-radius:13px;padding:6px 12px;margin-bottom:7px;font-size:16px;font-weight:700;text-align:left}
.acctrow .v{font-variant-numeric:tabular-nums;font-weight:900;white-space:nowrap}
.grid9{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}
.grid9 button{min-height:48px;border:2.5px solid var(--ink);border-radius:12px;background:#fff;font-weight:800;font-size:16px;position:relative}
.grid9 button.done{background:#E7F1EA} .grid9 button.cur{background:var(--ink);color:#FFFDF8}

/* ---------- 報表 ---------- */
.rep{background:#fff;border:3px solid var(--ink);border-radius:18px;box-shadow:5px 6px 0 rgba(31,27,24,.10);padding:15px;margin:14px 0}
.rep h3{margin:0 0 2px;font-size:20px;font-weight:900;text-align:center}
.rep .sub{text-align:center;font-size:13.5px;color:var(--ink2);margin-bottom:10px}
.rl{display:flex;justify-content:space-between;gap:10px;padding:3px 0;font-size:16px;line-height:1.55}
.rl .n{flex:1;min-width:0}
.rl .v{font-variant-numeric:tabular-nums;white-space:nowrap;font-weight:700}
.rl.ind .n{padding-left:16px} .rl.ind2 .n{padding-left:32px}
.rl.tot{border-top:2px solid var(--ink);margin-top:5px;padding-top:5px;font-weight:900}
.rl.tot2{border-top:2px solid var(--ink);border-bottom:4px double var(--ink);margin-top:5px;font-weight:900}
.rl .bad{color:var(--red);font-weight:900}
.fix{font-size:13px;color:var(--red);font-weight:700}
.sec{font-weight:900;margin-top:10px;border-bottom:2px dashed #D8CFC4;padding-bottom:2px}
.errcard{background:#FFF4F2;border:3px solid var(--red);border-radius:16px;padding:13px 14px;margin:11px 0}
.errcard b{color:var(--red)}
.stdje{background:#fff;border:2px dashed #C0B7AC;border-radius:11px;padding:9px 11px;margin:8px 0 0}
.stdje .l{display:flex;justify-content:space-between;font-size:15.5px;font-variant-numeric:tabular-nums}
.stdje .l.c{padding-left:24px}
.badge{display:inline-block;border-radius:999px;padding:3px 12px;font-size:14px;font-weight:900;border:2px solid}
.badge.ok{border-color:var(--green);color:var(--green);background:#EAF4EF}
.badge.ng{border-color:var(--red);color:var(--red);background:#FDECEA}
.card-score{background:#fff;border:3px solid var(--ink);border-radius:20px;padding:20px 18px;text-align:center;box-shadow:5px 6px 0 rgba(31,27,24,.10)}
.vcode{margin-top:14px;border-top:2px dashed #D8CFC4;padding-top:11px}
.vcode .cd{font-size:26px;font-weight:900;letter-spacing:.16em;font-variant-numeric:tabular-nums}
.strbox{margin-top:12px;background:#fff;border:2px dashed #C0B7AC;border-radius:12px;padding:10px 12px}
.strbox code{display:block;margin-top:5px;font-size:14px;word-break:break-all;line-height:1.6}
.card-score .big{font-size:27px;font-weight:900;margin:6px 0}
@media (max-width:360px){ .amt{width:92px} .wrap{padding-left:34px} }
@media (prefers-reduced-motion:no-preference){ .jcard,.qbox{animation:pop .18s ease-out} @keyframes pop{from{opacity:0;transform:translateY(6px)}} }
</style>
</head>
<body>

<div id="top"><div class="bar" id="topbar"></div></div>
<div class="wrap" id="app"></div>

<!-- ============ 底部常駐工具列(查帳 + 計算機) ============ -->
<div id="dock">
  <div class="dockbar">
    <button class="mini" id="btnAudit">🔍 查帳</button>
    <div class="disp" id="calcDisp">0</div>
    <button class="mini" id="btnDiff">補差額</button>
    <button class="mini" id="btnFold">⌄</button>
  </div>
  <div id="padwrap">
    <div id="pad">
      <button data-k="7">7</button><button data-k="8">8</button><button data-k="9">9</button><button class="op" data-k="÷">÷</button>
      <button data-k="4">4</button><button data-k="5">5</button><button data-k="6">6</button><button class="op" data-k="×">×</button>
      <button data-k="1">1</button><button data-k="2">2</button><button data-k="3">3</button><button class="op" data-k="−">−</button>
      <button data-k="0">0</button><button data-k="00">00</button><button data-k=".">.</button><button class="op" data-k="+">+</button>
      <button class="fn" data-k="C">C</button><button class="fn" data-k="B">⌫</button><button class="fn" data-k="%">%</button><button class="op" data-k="=">=</button>
      <button class="go" data-k="FILL" style="grid-column:span 4">填入金額</button>
    </div>
    <div class="hint" id="calcHint">先點分錄上的金額欄,再按「填入金額」</div>
  </div>
</div>

<!-- ============ 彈層 ============ -->
<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet">
  <div class="sh"><b id="sheetTitle"></b><button class="btn ghost" id="sheetClose">關閉</button></div>
  <div class="sb" id="sheetBody"></div>
</div>

<!-- ▼▼▼ 題組檔:新增一個題組就在這裡加一行 ▼▼▼ -->
<script src="accounts.js"></script>
<!-- 已預先列到 set40。檔案不存在只會在瀏覽器 console 出現 404,對頁面完全無影響,
     所以以後新增題組「只要把 sets/setXX.js 上傳」就會自動出現在首頁,不必再改這裡。 -->
<script src="sets/set01.js"></script>
<script src="sets/set02.js"></script>
<script src="sets/set03.js"></script>
<script src="sets/set04.js"></script>
<script src="sets/set05.js"></script>
<script src="sets/set06.js"></script>
<script src="sets/set07.js"></script>

/* 驗證碼:把成績卡上每一個字都算進去,改任何一項碼就對不上 */
function h32(str,seed){ var h=seed>>>0; for(var i=0;i<str.length;i++){ h^=str.charCodeAt(i); h=Math.imul(h,16777619)>>>0; } return h>>>0; }
function sig(name,setId,first,last,date){
  var raw=[name,setId,first,last,date,SALT].join('|');
  var A='0123456789ABCDEFGHJKMNPQRSTVWXYZ', out='', n;
  n=h32(raw,2166136261); for(var i=0;i<4;i++){ out+=A.charAt(n%32); n=Math.floor(n/32); }
  out+='-';
  n=h32(SALT+'#'+raw,987654321); for(var j=0;j<4;j++){ out+=A.charAt(n%32); n=Math.floor(n/32); }
  return out;
}

function baseChart(){
  if (window.ACCOUNTS && window.ACCOUNTS.length) {
    return window.ACCOUNTS.map(function(a){ return {name:a.name, cls:a.cls}; });
  }
  var out=[]; ['A','L','C','R','E'].forEach(function(c){
    FB[c].split(',').forEach(function(n){ out.push({name:n, cls:c}); });
  });
  return out;
}
function inferCls(n){
  if(/^累計折舊|^備抵|^預付|^應收|^暫付|^存出保證金|^進項稅額|成本$/.test(n)) return 'A';
  if(/^應付|^預收|^代收|^存入保證金|^銷項稅額/.test(n)) return 'L';
  if(/^業主/.test(n)) return 'C';
  if(/收入$|^銷貨退回|^銷貨折讓/.test(n)) return 'R';
  return 'E';
}
var CHART=[], POS={}, PICKABLE=null;
function buildChart(set){
  CHART = baseChart();
  var names = {}; CHART.forEach(function(a){ names[a.name]=1; });
  function insert(item){
    if(names[item.name]) return;
    names[item.name]=1;
    var at=-1;
    if(item.after){ for(var i=0;i<CHART.length;i++) if(CHART[i].name===item.after) at=i+1; }
    if(at<0){ for(var j=0;j<CHART.length;j++) if(CHART[j].cls===item.cls) at=j+1; }
    if(at<0) at=CHART.length;
    CHART.splice(at,0,{name:item.name, cls:item.cls});
  }
  SUPPLEMENT.forEach(insert);
  if(set){
    var used=[];
    (set.opening||[]).forEach(function(o){ used.push(o.acct); });
    (set.txns||[]).forEach(function(t){ (t.entries||[]).forEach(function(e){
      (e.dr||[]).forEach(function(l){used.push(l.acct);});
      (e.cr||[]).forEach(function(l){used.push(l.acct);});
    });});
    (set.extraAccounts||[]).forEach(insert);
    used.forEach(function(n){
      if(!names[n]){ console.warn('[會計項目庫] 題組使用了未收錄的項目:'+n+' → 自動歸為'+CLSNAME[inferCls(n)]); insert({name:n, cls:inferCls(n)}); }
    });
  }
  if(set && set.opening && set.opening.length){        // 依試算表順序呈現(試題要求不得增設、依試算表順序作答)
    var ord={}; set.opening.forEach(function(o,i){ ord[o.acct]=i; });
    var head=[], tail=[];
    CHART.forEach(function(a){ (ord[a.name]!==undefined? head : tail).push(a); });
    head.sort(function(x,y){ return ord[x.name]-ord[y.name]; });
    CHART=head.concat(tail);
  }
  PICKABLE=null;
  if(set && set.onlySetAccounts){
    var ok={};
    (set.opening||[]).forEach(function(o){ ok[o.acct]=1; });
    (set.txns||[]).forEach(function(t){ (t.entries||[]).forEach(function(e){
      (e.dr||[]).forEach(function(l){ ok[l.acct]=1; });
      (e.cr||[]).forEach(function(l){ ok[l.acct]=1; });
    });});
    PICKABLE=ok;
  }
  POS={}; CHART.forEach(function(a,i){ POS[a.name]={cls:a.cls, i:i}; });
}
function usable(){ return PICKABLE? CHART.filter(function(a){ return PICKABLE[a.name]; }) : CHART; }

var $=function(s){return document.querySelector(s);};
function fmt(n){ if(n===null||n===undefined||isNaN(n)) return ''; var s=Math.round(Math.abs(n)).toString().replace(/\B(?=(\d{3})+(?!\d))/g,','); return (n<0?'-':'')+s; }
function esc(s){ return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }

var S={screen:'home', set:null, idx:0, ans:{}, checks:0, name:'', checked:false, cell:null, vs:0, first:null, last:null, sent:false, mail:''};

function blankCard(){ return {dr:[{acct:'',amt:null}], cr:[{acct:'',amt:null}]}; }
function ensure(no){
  if(!S.ans[no]) S.ans[no]={cards:[],noEntry:false};
  if(S.ans[no].cards.length===0 && !S.ans[no].noEntry) S.ans[no].cards.push(blankCard());
  return S.ans[no];
}
function fullDate(t){                       // 民國102年12月2日 — 年份取自題組的 period
  var d=(t.date||''), p=d.split('/');
  if(!p[0]) return '';
  var tail=parseInt(p[0],10)+'月'+(p[1]?parseInt(p[1],10)+'日':'');
  var y=(S.set.period||'').match(/民國\s*(\d+)\s*年/);
  return y ? '民國'+y[1]+'年'+tail : tail;
}
function txnOf(no){ var r=null; S.set.txns.forEach(function(t){ if(t.no===no) r=t; }); return r; }
function lineOK(l){ return l.acct && l.amt!==null && l.amt!==undefined && l.amt!==0; }
function cardFilled(c){ return c.dr.some(lineOK) && c.cr.some(lineOK); }
function cardEmpty(c){ var f=function(l){ return l.acct||l.amt; }; return !c.dr.some(f) && !c.cr.some(f); }
function doneOf(a,vm){
  if(!a) return false;
  if(a.noEntry) return true;
  var cs=(a.cards||[]).filter(function(c){ return !cardEmpty(c); });
  if(!cs.length) return false;
  return cs.every(function(c){ return cardFilled(c) && (!vm || (!!c.v && (VSETS[vm]||[]).indexOf(c.v)>=0)); });
}
function isDone(no){ return doneOf(S.ans[no], S.vs); }
function hasCash(c){ return c.dr.concat(c.cr).some(function(l){ return l.acct==='現金'; }); }
/* 四種傳票互斥判定:借方只有現金→現金收入;貸方只有現金→現金支出;
   有現金但不是單純收付→現金轉帳;完全沒有現金→分錄轉帳 */
function vtypeOf(dr,cr){
  var d=(dr||[]).filter(function(l){ return l.acct; }), c=(cr||[]).filter(function(l){ return l.acct; });
  var dc=d.some(function(l){ return l.acct==='現金'; }), cc=c.some(function(l){ return l.acct==='現金'; });
  if(!dc && !cc) return 'JT';
  if(dc && !cc && d.length===1) return 'CI';
  if(cc && !dc && c.length===1) return 'CO';
  return 'CT';
}
function vWarn(c){
  if(S.vs!==4||!c.v) return '';
  if(c.v==='CT' && !hasCash(c)) return '現金轉帳傳票必須有「現金」,這張沒有。';
  if(c.v==='JT' && hasCash(c))  return '分錄轉帳傳票不可以出現「現金」。';
  return '';
}
function doneCount(){ var n=0; S.set.txns.forEach(function(t){ if(isDone(t.no)) n++; }); return n; }

/* ==========================================================
   4. 過帳引擎(借正貸負)
   ========================================================== */
function post(useStandard){
  var bal={}, led={};
  function add(acct,amt,meta){ if(!acct) return; bal[acct]=(bal[acct]||0)+amt; (led[acct]=led[acct]||[]).push(meta); }
  (S.set.opening||[]).forEach(function(o){
    add(o.acct, o.side==='dr'?o.amt:-o.amt, {no:'期初',date:'開帳',side:o.side,amt:o.amt});
  });
  S.set.txns.forEach(function(t){
    if(useStandard){
      (t.entries||[]).forEach(function(e){
        (e.dr||[]).forEach(function(l){ add(l.acct,  l.amt, {no:t.no,date:t.date,side:'dr',amt:l.amt}); });
        (e.cr||[]).forEach(function(l){ add(l.acct, -l.amt, {no:t.no,date:t.date,side:'cr',amt:l.amt}); });
      });
    } else {
      var a=S.ans[t.no]; if(!a||a.noEntry) return;
      a.cards.forEach(function(c){
        c.dr.forEach(function(l){ if(lineOK(l)) add(l.acct,  l.amt, {no:t.no,date:t.date,side:'dr',amt:l.amt}); });
        c.cr.forEach(function(l){ if(lineOK(l)) add(l.acct, -l.amt, {no:t.no,date:t.date,side:'cr',amt:l.amt}); });
      });
    }
  });
  return {bal:bal, led:led};
}

  return {done:done, n:n, first:(st&&st.first!==undefined)?st.first:null};
}

        '<div class="sub1">勞動部　會計資訊丙級　分錄練習</div>'+
        '<p>選一個題組,照題目逐筆登入分錄。</p></div>';
  if(lastSet){
    h+='<button class="btn primary wide resume" data-open="'+lastSet.id+'">▶ 繼續 '+esc(lastSet.title)+
       '(已登 '+stats[lastSet.id].done+' / '+stats[lastSet.id].n+')</button>';
  }
  if(SETS.length>6){
    h+='<input class="srch" id="sq" placeholder="搜尋題組名稱或試題編號" autocomplete="off" value="'+esc(HS.q)+'">';
  }
  h+='<div class="chips">'+[['all','全部'],['todo','未開始'],['doing','進行中'],['done','已完成']].map(function(c){
      return '<button data-f="'+c[0]+'" class="'+(HS.f===c[0]?'on':'')+'">'+c[1]+'</button>'; }).join('')+'</div>';

  var rows='', shown=0;
  all.forEach(function(x){

  else if(act==='prev'){ leave(); S.idx--; renderWork(); }

function autoDiff(no){
  var a=S.ans[no]; if(!a||a.noEntry) return 0;
  var filled=0;
  a.cards.forEach(function(c){
    if(cardEmpty(c)) return;
    var blanks=[], d=0, cr=0;
    ['dr','cr'].forEach(function(sd){
      c[sd].forEach(function(l,i){
        if(l.acct && !l.amt) blanks.push({s:sd,i:i});
        else if(lineOK(l)){ if(sd==='dr') d+=l.amt; else cr+=l.amt; }
      });
    });
    if(blanks.length===1){                       // 只有一格金額空著才自動補
      var need = blanks[0].s==='dr' ? cr-d : d-cr;
      if(need>0){ c[blanks[0].s][blanks[0].i].amt=need; filled+=need; }
    }
  });
  if(filled) save();
  return filled;
}
function leave(){
  var f=autoDiff(S.set.txns[S.idx].no);
  if(f) toast('已自動補上差額 '+fmt(f));
  save();

  var e=document.getElementById('toast');
  if(!e){ e=document.createElement('div'); e.id='toast'; document.body.appendChild(e); }
  e.textContent=m; e.className='on';
  clearTimeout(e._t); e._t=setTimeout(function(){ e.className=''; }, 2400);

   8. 計算機(常駐、不彈窗)
   ========================================================== */
var C={acc:null, op:null, buf:''};
function calcReset(){ C={acc:null,op:null,buf:''}; paintCalc(); }
function calcVal(){ return C.buf!=='' ? parseFloat(C.buf) : (C.acc!==null?C.acc:0); }
function paintCalc(){
  var v = C.buf!=='' ? C.buf : (C.acc!==null? String(C.acc) : '0');
  var neg = v.charAt(0)==='-'; var body = neg? v.slice(1): v;
  var p=body.split('.'); p[0]=p[0].replace(/\B(?=(\d{3})+(?!\d))/g,',');
  $('#calcDisp').textContent=(neg?'-':'')+p.join('.');
}
function apply(a,op,b){
  if(op==='+') return a+b; if(op==='−') return a-b;
  if(op==='×') return a*b; if(op==='÷') return b===0?0:a/b; return b;
}
function calcKey(k){
  if(/^[0-9]$|^00$/.test(k)){ if(C.buf==='0') C.buf=''; C.buf+=k; }
  else if(k==='.'){ if(C.buf.indexOf('.')<0) C.buf=(C.buf===''?'0':C.buf)+'.'; }
  else if(k==='B'){ C.buf=C.buf.slice(0,-1); }
  else if(k==='C'){ C={acc:null,op:null,buf:''}; }
  else if(k==='%'){
    var b=parseFloat(C.buf||'0');
    if(C.op==='+'||C.op==='−') C.buf=String((C.acc||0)*b/100); else C.buf=String(b/100);
  }
  else if(k==='+'||k==='−'||k==='×'||k==='÷'){
    if(C.buf!==''){ C.acc = (C.acc===null||C.op===null)? parseFloat(C.buf) : apply(C.acc,C.op,parseFloat(C.buf)); C.buf=''; }
    else if(C.acc===null) C.acc=0;
    C.op=k;
  }
  else if(k==='='){
    if(C.op!==null&&C.buf!==''){ C.acc=apply(C.acc,C.op,parseFloat(C.buf)); }
    else if(C.buf!==''){ C.acc=parseFloat(C.buf); }
    C.op=null; C.buf='';
  }
  paintCalc();
}

function stdV(e){ return e.vtype || vtypeOf(e.dr,e.cr); }
function wantV(e){                                   // 該制度下的標準傳票別
  var k=stdV(e);
  if(S.vs===3) return (k==='CI'||k==='CO')? k : 'TR';
  return k;
}
function vMatch(sv,e){
  if(!S.vs) return true;
  if(S.vs===3) return sv===wantV(e) || sv==='TR';    // 轉帳傳票不受限,一律接受
  return sv===wantV(e);

function canonJE(dr,cr){
  function f(ls){ return (ls||[]).filter(lineOK).map(function(l){ return l.acct+'@'+l.amt; }).sort().join('|'); }
  return 'D['+f(dr)+']C['+f(cr)+']';
}
function cmp(t,a){
  var std=(t.entries||[]).map(function(e){ return {k:canonJE(e.dr,e.cr), e:e}; });
  var stu=(a&&!a.noEntry? a.cards:[]).map(function(c){ return {k:canonJE(c.dr,c.cr), v:c.v}; })
          .filter(function(x){ return x.k!=='D[]C[]'; });
  if(std.length!==stu.length) return false;
  var used=[];
  for(var i=0;i<std.length;i++){
    var hit=-1;
    for(var j=0;j<stu.length;j++){ if(!used[j] && stu[j].k===std[i].k){ hit=j; break; } }
    if(hit<0) return false;
    used[hit]=true;
    if(!vMatch(stu[hit].v, std[i].e)) return false;
  }
  return true;
}

  h+='<div class="rl tot"><span class="n">銷貨淨額</span><span class="v">'+fmt(net)+'</span></div>';

  if(CA){                                   // 銷貨成本法:直接印調整分錄結轉出來的餘額
    cogs=B(CA);
    h+='<div class="sec">銷貨成本</div>';
    h+=line(CA,fmt(cogs),'tot',(CA in bad),bad[CA]);
  } else {
  var bi=openingOf('存貨'), pu=B('進貨'), pf=B('進貨費用'), pr=-B('進貨退出'), pa=-B('進貨折讓');
  var pnet=pu+pf-pr-pa, avail=bi+pnet; cogs=avail-EI;
  h+='<div class="sec">銷貨成本</div>';
  h+=line('期初存貨',fmt(bi),'ind');
  h+=line('進貨',fmt(pu),'ind',('進貨' in bad),bad['進貨']);
  if(pf) h+=line('加:進貨費用',fmt(pf),'ind2',('進貨費用' in bad),bad['進貨費用']);
  if(pr) h+=line('減:進貨退出','('+fmt(pr)+')','ind2',('進貨退出' in bad),bad['進貨退出']);
  if(pa) h+=line('減:進貨折讓','('+fmt(pa)+')','ind2',('進貨折讓' in bad),bad['進貨折讓']);
  h+=line('進貨淨額',fmt(pnet),'ind');
  h+=line('可供銷售商品總額',fmt(avail),'ind');
  h+=line('減:期末存貨','('+fmt(EI)+')','ind');
  h+='<div class="rl tot"><span class="n">銷貨成本</span><span class="v">'+fmt(cogs)+'</span></div>';
  }
  var gp=net-cogs;
  h+='<div class="rl tot"><span class="n">'+(gp>=0?'營業毛利':'營業毛損')+'</span><span class="v">'+fmt(Math.abs(gp))+'</span></div>';
  var opx=0;
  h+='<div class="sec">營業費用</div>';
  CHART.forEach(function(a){
    if(a.cls!=='E'||PURCH.indexOf(a.name)>=0||NONOPE.indexOf(a.name)>=0||a.name===CA) return;
    var v=B(a.name); if(!v && !(a.name in bad)) return; opx+=v;
    h+=line(a.name,fmt(v),'ind',(a.name in bad),bad[a.name]);
  });
  h+='<div class="rl tot"><span class="n">營業費用合計</span><span class="v">'+fmt(opx)+'</span></div>';
  var oi=gp-opx;
  h+='<div class="rl tot"><span class="n">'+(oi>=0?'營業淨利':'營業淨損')+'</span><span class="v">'+fmt(Math.abs(oi))+'</span></div>';
  var nr=0,ne=0,tmp='';
  CHART.forEach(function(a){
    if(a.cls==='R'&&SALES.indexOf(a.name)<0){ var v=-B(a.name); if(v){ nr+=v; tmp+=line(a.name,fmt(v),'ind',(a.name in bad),bad[a.name]); } }
  });
  CHART.forEach(function(a){
    if(NONOPE.indexOf(a.name)>=0){ var v=B(a.name); if(v){ ne+=v; tmp+=line(a.name,'('+fmt(v)+')','ind',(a.name in bad),bad[a.name]); } }
  });
  if(tmp) h+='<div class="sec">營業外收益及費損</div>'+tmp;
  var ni=oi+nr-ne;
  h+='<div class="rl tot2"><span class="n">'+(ni>=0?'本期淨利':'本期淨損')+'</span><span class="v">'+fmt(Math.abs(ni))+'</span></div>';
  return h+'</div>';
}

/* ==========================================================

   ========================================================== */
function openLedgerRE(){
  var P=post(false), bal=P.bal, led=P.led, h='';
  var list=CHART.filter(function(a){ return (a.cls==='R'||a.cls==='E') && ((bal[a.name]||0)!==0 || (led[a.name]||[]).length); });
  h+='<div class="rep"><h3>總分類帳</h3><div class="sub">'+esc(S.set.title)+'　收益及費損類帳戶　'+esc(S.set.period||'')+'</div>';
  list.forEach(function(a){
    var rows=led[a.name]||[], run=0, dsum=0, csum=0;
    h+='<div class="sec">'+esc(a.name)+'('+((bal[a.name]||0)>=0?'借':'貸')+')</div>';
    rows.forEach(function(r){
      run += (r.side==='dr'? r.amt : -r.amt);
      if(r.no==='期初'){   // 官方總分類帳格式:上期結轉本來就印在餘額欄
        h+='<div class="rl ind"><span class="n">上期結轉</span>'+
           '<span class="v" style="width:96px"></span><span class="v" style="width:96px"></span>'+
           '<span class="v" style="width:104px;text-align:right">'+fmt(r.amt)+'</span></div>'; }
      else{
        if(r.side==='dr') dsum+=r.amt; else csum+=r.amt;
        h+='<div class="rl ind"><span class="n">'+esc(r.date)+'　第'+r.no+'題</span>'+
           '<span class="v" style="width:96px;text-align:right">'+(r.side==='dr'?fmt(r.amt):'')+'</span>'+
           '<span class="v" style="width:96px;text-align:right">'+(r.side==='cr'?fmt(r.amt):'')+'</span>'+
           '<span class="v muted" style="width:104px;text-align:right">'+sv(run)+'</span></div>';
      }
    });
    if(dsum||csum) h+='<div class="rl ind" style="font-weight:900"><span class="n">累計</span>'+
      '<span class="v" style="width:96px;text-align:right">'+(dsum?fmt(dsum):'')+'</span>'+
      '<span class="v" style="width:96px;text-align:right">'+(csum?fmt(csum):'')+'</span>'+
      '<span class="v" style="width:104px;text-align:right">'+sv(bal[a.name]||0)+'</span></div>';
  });
  sheet('收益及費損類總分類帳', h+'</div>', null);
}
function allResults(){
  var out=[];
  SETS.forEach(function(x){
    if(x.demo) return;                                  // 示範題組不列入成績回報
    var st=load(x.id); if(!st || st.first===undefined || st.first===null) return;
    var done=0, vm=st.vs||(st.vmode?4:0);
    x.txns.forEach(function(t){ if(doneOf(st.ans&&st.ans[t.no], vm)) done++; });
    out.push({ id:x.id, title:x.title, first:st.first,
               last:(st.last===undefined||st.last===null)?st.first:st.last,
               date:(st.date||'').replace(/[^0-9]/g,''),   // 第一次對帳的日期 → 老師可查是否準時
               checks:st.checks||0, name:st.name||'', done:done, n:x.txns.length });
  });
  return out;
}
function sigBatch(name, field, date){                 // 一次涵蓋所有題組的總驗證碼
  var raw=['V1',name,field,date,SALT].join('|');
  var A='0123456789ABCDEFGHJKMNPQRSTVWXYZ', out='', k;
  k=h32(raw,2166136261); for(var i=0;i<4;i++){ out+=A.charAt(k%32); k=Math.floor(k/32); }
  out+='-';
  k=h32(SALT+'#B#'+raw,987654321); for(var j=0;j<4;j++){ out+=A.charAt(k%32); k=Math.floor(k/32); }
  return out;
}
function reportOf(name, rows, date){
  var f=rows.map(function(r){ return r.id+':'+r.first+':'+r.last+(r.date?':'+r.date:''); }).join(',');
  return 'V1|'+name+'|'+f+'|'+date+'|'+sigBatch(name,f,date);
}
function copyText(t){
  try{ if(navigator.clipboard&&navigator.clipboard.writeText){ navigator.clipboard.writeText(t); toast('已複製'); return; } }catch(e){}
  toast('請長按下方文字自行複製');
}
function openSummary(){
  var rows=allResults();
  if(!rows.length){
    sheet('我的成績總表','<div class="rep" style="text-align:center;padding:22px"><b>還沒有任何成績</b>'+
      '<div class="small muted" style="margin-top:6px">完成一個題組並按過「對帳」之後,成績才會出現在這裡。</div></div>', null);
    return;
  }
  var nm=(S.rname||rows.filter(function(r){return r.name;}).map(function(r){return r.name;}).pop()||'').replace(/[|｜\s]/g,'');
  var date=today();
  var line = nm ? reportOf(nm, rows, date) : '';
  var body='<input class="srch" id="rn" placeholder="輸入你的姓名(回報碼會綁定姓名)" value="'+esc(S.rname||nm)+'">'+
    '<div class="rep"><h3>我的成績總表</h3><div class="sub" id="rnm">'+(nm?esc(nm):'請先填姓名')+'　·　'+esc(date)+'</div>'+
    '<div class="rl" style="font-weight:900"><span class="n">題組</span>'+
      '<span class="v" style="width:78px;text-align:right">完成日</span>'+
      '<span class="v" style="width:52px;text-align:right">正式</span>'+
      '<span class="v" style="width:52px;text-align:right">訂正</span></div>';
  var sum=0;
  rows.forEach(function(r){
    sum+=r.first;
    body+='<div class="rl"><span class="n">'+esc(r.title)+' <span class="small muted">'+esc(r.id)+'</span></span>'+
      '<span class="v muted" style="width:78px;text-align:right;font-size:13px">'+
        (r.date?esc(r.date.slice(4,6)+'/'+r.date.slice(6,8)):'—')+'</span>'+
      '<span class="v" style="width:52px;text-align:right">'+r.first+'</span>'+
      '<span class="v" style="width:52px;text-align:right">'+r.last+'</span></div>';
  });
  body+='<div class="rl tot"><span class="n">共 '+rows.length+' 組　平均</span>'+
    '<span class="v" style="width:78px"></span>'+
    '<span class="v" style="width:52px;text-align:right">'+Math.round(sum/rows.length)+'</span>'+
    '<span class="v" style="width:52px"></span></div></div>';
  body+='<div id="rbox">'+
    '<div class="strbox"><div class="small muted">成績回報碼(一次涵蓋全部題組,交這一行就好)</div><code id="rline"></code></div>'+
    '<div style="display:flex;gap:8px;margin-top:10px">'+
      '<button class="btn" style="flex:1" id="rcopy">複製回報碼</button>'+
      (FORM_URL?'<button class="btn primary" style="flex:1" id="rform">開表單送出</button>':'')+
    '</div>'+
    (TEACHER_EMAIL||S.mail?'<button class="btn wide" style="margin-top:8px" id="rmail">✉ 用郵件寄給老師</button>':
      '<input class="srch" id="rtm" style="margin-top:8px" placeholder="老師的信箱(要用郵件寄才需要填)" value="'+esc(S.mail)+'">')+
    '<p class="small muted" style="margin-top:10px">整學期只要交這一行,不必每個題組各寄一次。回報碼綁定姓名、每一組的分數<b>與完成日期</b>,改任何一個數字老師都驗得出來,老師也查得到每一組是哪天完成的。</p>'+
    '</div>';
  sheet('我的成績總表', body, function(root){
    var paint=function(){
      var v=(S.rname||'').replace(/[|｜\s]/g,''), dt=today();
      var l=v?reportOf(v,rows,dt):'';
      root.querySelector('#rnm').textContent=(v||'請先填姓名')+'　·　'+dt;
      root.querySelector('#rline').textContent=l;
      root.querySelector('#rbox').style.display=v?'':'none';
      return l;
    };
    if(S.rname===undefined) S.rname=nm;
    paint();
    root.addEventListener('input', function(e){
      if(e.target.id==='rn'){ S.rname=e.target.value; paint(); }
      if(e.target.id==='rtm'){ S.mail=e.target.value; }
    });
    var c=root.querySelector('#rcopy'); if(c) c.onclick=function(){ copyText(paint()); };
    var f=root.querySelector('#rform');
    if(f) f.onclick=function(){ var l=paint(); if(!l){ toast('請先填姓名'); return; }
      w_open(FORM_URL.indexOf('{{DATA}}')>=0 ? FORM_URL.replace('{{DATA}}', encodeURIComponent(l)) : FORM_URL); };
    var m=root.querySelector('#rmail');
    if(m) m.onclick=function(){
      var l=paint(), to=TEACHER_EMAIL||S.mail;
      if(!l){ toast('請先填姓名'); return; }
      if(!to){ toast('請先填老師的信箱'); return; }
      w_open('mailto:'+encodeURIComponent(to)+'?subject='+encodeURIComponent('【會計資訊系統】成績回報 - '+(S.rname||''))+
             '&body='+encodeURIComponent('姓名:'+S.rname+'\n共 '+rows.length+' 組\n\n'+l));
    };
  });
}
function scoreData(){
  var sc=scoreNow(), nm=(S.name||'').replace(/[|｜\s]/g,''), date=S.date||today();
  var code = nm ? sig(nm,S.set.id,S.first,sc.pct,date) : '';
  return { sc:sc, nm:nm, date:date, code:code, pass:(S.first>=PASS_LINE),
           str: nm ? [nm,S.set.id,S.first,sc.pct,date,code].join('|') : '' };
}
function refreshScore(root){
  var D=scoreData();
  root.querySelector('#scn').textContent = D.nm || '請先填姓名';
  root.querySelector('#vcode').textContent = D.code || '—';
  root.querySelector('#vcbox').style.display = D.code ? '' : 'none';
  root.querySelector('#vstr').textContent = D.str;
  root.querySelector('#mailbox').style.display = D.nm ? '' : 'none';
}
function openScore(){
  if(S.first===null){
    sheet('成績卡','<div class="rep" style="text-align:center;padding:22px"><b>還沒有成績</b>'+
      '<div class="small muted" style="margin-top:6px">先在報表頁按一次「對帳」,系統才會鎖定正式成績並發驗證碼。</div></div>', null);
    return;
  }
  var D=scoreData();
  var h='<input class="srch" id="nm" placeholder="輸入你的姓名(驗證碼會綁定姓名)" value="'+esc(S.name)+'">'+
   '<div class="card-score" id="sc">'+
     '<div class="small muted">'+esc(S.set.title)+'　'+esc(S.set.examNo||'')+'</div>'+
     '<div class="big" id="scn"></div>'+
     '<div class="small muted">正式成績(第一次對帳)</div>'+
     '<div style="font-size:38px;font-weight:900;line-height:1.1">'+S.first+' 分</div>'+
     '<div style="margin:6px 0 12px">'+(D.pass?'<span class="badge ok">及格</span>':'<span class="badge ng">不及格</span>')+'</div>'+
     '<div class="rl" style="justify-content:center;gap:16px;font-size:15px">'+
       '<span>訂正後 <b>'+D.sc.pct+' 分</b></span><span class="muted">對帳 '+S.checks+' 次</span></div>'+
     '<div class="small muted" style="margin-top:2px">'+D.sc.right+' / '+D.sc.total+' 題正確　·　'+esc(D.date)+'</div>'+
     '<div class="vcode" id="vcbox"><div class="small">驗證碼</div><div class="cd" id="vcode"></div></div>'+
     '<div class="scby">'+esc(APP.name)+'(手機版)　·　<b>'+esc(APP.author)+'</b>'+
       '<br>著作人 '+esc(APP.owner)+'　·　'+esc(APP.pubDate)+'　'+esc(APP.pubPlace)+
       (APP.site?'<br>'+esc(APP.site):'')+'</div>'+
   '</div>'+
   '<p class="small muted" style="margin-top:12px">截圖這張卡片傳給老師。驗證碼綁定姓名與分數,改任何一項老師都驗得出來。</p>'+
   '<div id="mailbox"><div class="hr"></div>'+
     (TEACHER_EMAIL?'':'<input class="srch" id="tm" placeholder="老師的信箱(問老師)" value="'+esc(S.mail)+'">')+
     (S.sent
       ? '<div class="rep" style="text-align:center;padding:14px"><b>已經寄出過了</b><div class="small muted" style="margin-top:4px">每個題組只能寄一次。</div></div>'
       : '<button class="btn primary wide" id="mailbtn">✉ 寄成績給老師(只能寄一次)</button>')+
     '<div class="strbox"><div class="small muted">驗證串(寄信會自動附上,老師貼進驗證頁一次核對)</div><code id="vstr"></code></div>'+
   '</div>';
  sheet('成績卡', h, function(root){

      if(e.target.id==='nm'){ S.name=e.target.value; save(); refreshScore(root); }   // 只更新文字,不動輸入框
      if(e.target.id==='tm'){ S.mail=e.target.value; save(); }
    });
    var mb=root.querySelector('#mailbtn');
    if(mb) mb.onclick=function(){
      var X=scoreData(), to=TEACHER_EMAIL||S.mail;
      if(!X.nm){ toast('請先填姓名'); return; }
      if(!to){ toast('請先填老師的信箱'); return; }
      if(!confirm('寄出後這個題組就不能再寄了。確定已經訂正完成?')) return;
      var body=['姓名:'+X.nm,'題組:'+S.set.title+'('+S.set.id+')',
                '正式成績(第一次對帳):'+S.first+' 分　'+(X.pass?'及格':'不及格'),
                '訂正後成績:'+X.sc.pct+' 分('+X.sc.right+'/'+X.sc.total+' 題)',
                '對帳次數:'+S.checks+' 次','完成日期:'+X.date,'驗證碼:'+X.code,'','驗證串:'+X.str].join('\n');
      w_open('mailto:'+encodeURIComponent(to)+'?subject='+encodeURIComponent('【會計資訊系統】'+S.set.title+' 成績回報 - '+X.nm)+'&body='+encodeURIComponent(body));
      S.sent=true; save(); openScore();
    };
  });
}
function w_open(u){ try{ window.location.href=u; }catch(e){ toast('這台裝置沒有設定郵件 App'); } }

/* ==========================================================
   13. 抽屜控制
   ========================================================== */
function sheet(title, html, wire){
  $('#sheetTitle').textContent=title;
  var old=$('#sheetBody');                      // 換掉整個節點,避免監聽器越疊越多
  var b=document.createElement('div'); b.className='sb'; b.id='sheetBody'; b.innerHTML=html;
  old.parentNode.replaceChild(b, old);
  $('#sheet').classList.add('on'); $('#scrim').classList.add('on');
  if(wire) wire(b);
  if(title==='選會計項目') paintAcct(b);
}
function closeSheet(){ $('#sheet').classList.remove('on'); $('#scrim').classList.remove('on'); }
$('#scrim').onclick=closeSheet; $('#sheetClose').onclick=closeSheet;
