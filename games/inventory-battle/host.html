<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>鳳姨搶答・老師端</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap">
<link rel="stylesheet" href="style.css">
<style>
/* 老師端：投影用，16:9 大字 */
body{font-size:clamp(16px,1.35vw,26px);padding:2vh 3vw}
.wrap{max-width:1600px;margin:0 auto;display:flex;flex-direction:column;gap:2vh;min-height:96vh}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
header h1{margin:0;font-size:1.6em;font-weight:900}
.pill{background:var(--card);border:2px solid var(--ink);border-radius:999px;padding:2px 14px;font-weight:900;font-variant-numeric:tabular-nums}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}

/* setup */
#setup{max-width:860px;margin:3vh auto;display:flex;flex-direction:column;gap:16px}
.rounds{display:flex;flex-direction:column;gap:8px}
.rounds label{display:flex;align-items:center;gap:10px;font-weight:800;border:2px solid var(--line);border-radius:12px;padding:8px 12px;background:#fff;cursor:pointer}
.rounds input{width:22px;height:22px;accent-color:var(--yes)}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.field select{font-family:var(--font);font-size:1.15rem;font-weight:800;border:3px solid var(--ink);border-radius:12px;padding:8px 12px;background:#fff;color:var(--ink)}

/* lobby */
#lobby{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);gap:3vw;flex:1}
.joinbox{display:flex;flex-direction:column;align-items:center;gap:1.5vh;text-align:center}
.code{font-size:4.6em;font-weight:900;letter-spacing:.12em;line-height:1;font-variant-numeric:tabular-nums}
.qr{background:#fff;border:3px solid var(--ink);border-radius:16px;padding:10px;width:min(30vh,320px)}
.qr svg{display:block;width:100%;height:auto}
.url{font-weight:800;word-break:break-all;font-size:.85em}
.players{display:flex;flex-wrap:wrap;gap:8px;align-content:flex-start}
.chip{font-weight:900;background:#fff;border:2.5px solid var(--ink);border-radius:999px;padding:2px 14px;cursor:pointer;font-size:.95em;font-variant-numeric:tabular-nums}
.chip.kill{background:var(--no-soft);border-color:var(--no);color:var(--no)}

/* grouping */
#grouping{display:flex;flex-direction:column;gap:2vh;flex:1}
#grouping h2{margin:0;font-size:1.8em;font-weight:900}
.teams{display:grid;grid-template-columns:repeat(var(--cols,3),minmax(0,1fr));gap:1.6vw}
.team{background:#fff;border:3px solid var(--ink);border-radius:18px;overflow:hidden;box-shadow:0 5px 0 var(--ink);display:flex;flex-direction:column}
.team .th{color:#fff;font-weight:900;font-size:1.45em;padding:8px 14px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.team .th .no{font-size:.7em;background:rgba(255,255,255,.25);border-radius:999px;padding:0 10px}
.team .tb{padding:10px 12px;display:flex;flex-wrap:wrap;gap:6px;min-height:4.5em;align-content:flex-start}
.team .tb .chip{cursor:default;font-size:.85em;padding:1px 10px}
.drop{animation:dropin .45s cubic-bezier(.3,1.5,.5,1) both}
@keyframes dropin{0%{transform:translateY(-30px) scale(.6);opacity:0}100%{transform:none;opacity:1}}
.spin{animation:spinname .09s linear infinite}
@keyframes spinname{50%{opacity:.55}}

/* question */
#question,#reveal{display:flex;flex-direction:column;gap:2vh;flex:1}
.qhead{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.qtext{margin:0;font-size:1.75em;font-weight:900;line-height:1.45;text-wrap:pretty;white-space:pre-line}
.qtext.long{font-size:1.3em}
#reveal .qtext{font-size:1.35em}
#reveal .qtext.long{font-size:1.05em;columns:2;column-gap:2.5em}
#reveal .card{padding:12px 20px}
.big-timer{font-size:2.6em;font-weight:900;font-variant-numeric:tabular-nums;min-width:2.2em;text-align:center;line-height:1}
.opts .cellgrid{grid-template-columns:9em repeat(2,minmax(0,1fr))}
.opts .cellopt{min-height:13vh;font-size:1.25em}
.opts .mcopt{min-height:11vh;font-size:1.25em}
#reveal .opts .cellopt{min-height:9vh;font-size:1.05em}
#reveal .opts .mcopt{min-height:7vh;font-size:1.05em}
.numhint{font-size:1.5em;font-weight:900;text-align:center;border:3px dashed var(--ink);border-radius:18px;padding:3vh;background:#fff}
.qfoot{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:auto}
.count{font-size:1.4em;font-weight:900}

/* 拆小題 */
.itemq{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:1.6vw;align-items:start}
.itemq h4{margin:0 0 6px;font-size:1em;font-weight:900}
.itemq .cellgrid{grid-template-columns:6.5em repeat(2,minmax(0,1fr));gap:8px}
.opts .itemq .cellopt{min-height:8.5vh;font-size:1.05em}
.amts{display:flex;flex-direction:column;gap:8px}
.amt{border:3px solid var(--ink);border-radius:14px;background:#fff;font-weight:900;padding:8px 14px;display:flex;align-items:center;gap:10px;position:relative;overflow:hidden;font-variant-numeric:tabular-nums}
.amt .ab{flex:none;display:inline-flex;align-items:center;justify-content:center;width:1.7em;height:1.7em;border-radius:50%;background:var(--ink);color:#fff;font-size:.85em}
.tips{border:2.5px dashed var(--ink);border-radius:14px;background:var(--sun-soft);padding:8px 12px;font-weight:800;font-size:.9em;line-height:1.55}
.tips b{display:block;margin-bottom:2px}
.numtips{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);gap:1.6vw;align-items:stretch}
.numtips .numhint{display:flex;align-items:center;justify-content:center;padding:2vh}
#reveal .itemq{gap:1vw}
#reveal .itemq .cellgrid{grid-template-columns:4.2em repeat(2,minmax(0,1fr));gap:6px}
#reveal .itemq .ch,#reveal .itemq .rh{font-size:.78em;padding:3px 4px}
#reveal .opts .itemq .cellopt{min-height:7vh;font-size:.88em}
#reveal .amt{padding:5px 10px;font-size:.9em}

/* reveal */
.opt-res{position:relative;overflow:hidden}
.opt-res .bar{position:absolute;left:0;bottom:0;height:8px;background:var(--ink);opacity:.55}
.opt-res .n{font-size:1.1em;font-variant-numeric:tabular-nums}
.opt-res.correct{outline:6px solid var(--yes);outline-offset:3px}
.opt-res.dim{opacity:.6}
.revgrid{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:2.5vw;align-items:start}
.explain{display:flex;flex-direction:column;gap:12px}
.numres{display:flex;flex-direction:column;gap:6px}
.numres .ans{font-size:2em;font-weight:900;color:var(--yes);font-variant-numeric:tabular-nums}
.vals{display:flex;flex-direction:column;gap:6px}
.val{display:grid;grid-template-columns:9em 1fr 3em;gap:10px;align-items:center;font-weight:800;font-variant-numeric:tabular-nums}
.val .b{height:18px;border-radius:6px;background:var(--no)}
.val.ok .b{background:var(--yes)}
.race{display:flex;flex-direction:column;gap:8px}
.race h3{margin:0;font-size:1.15em}
.lane{display:grid;grid-template-columns:1.6em 6.2em minmax(0,1fr) 3.4em 4.4em;gap:8px;align-items:center;font-weight:900;font-variant-numeric:tabular-nums}
.lane .rk{text-align:center}
.lane .nm{white-space:nowrap}
.lane .track{height:26px;background:#fff;border:2.5px solid var(--ink);border-radius:999px;overflow:hidden}
.lane .track i{display:block;height:100%;border-radius:999px;transition:width 1.2s cubic-bezier(.3,1,.4,1)}
.lane .sc{text-align:right}
.lane .gain{font-size:.85em;text-align:center;border-radius:999px;padding:0 6px;background:var(--yes-soft);color:var(--yes);border:2px solid var(--yes)}
.lane .gain.zero{background:#F1F1F1;color:var(--muted);border-color:var(--line)}
.lane .gain.full{background:var(--sun);color:var(--ink);border-color:var(--ink)}
.lane small{display:block;font-size:.7em;color:var(--muted);font-weight:800}

/* splash */
#splash{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3vh;z-index:5}
#splash h2{margin:0;font-size:3em;font-weight:900;text-align:center;white-space:pre-line;line-height:1.3}
#splash .char{width:min(34vh,300px)}

/* end */
#end{display:flex;flex-direction:column;align-items:center;gap:3vh;flex:1}
#end h2{margin:0;font-size:2.4em;font-weight:900}
.podium{display:grid;grid-template-columns:repeat(3,minmax(0,14em));gap:2vw;align-items:end}
.pod{background:#fff;border:3px solid var(--ink);border-radius:18px 18px 0 0;text-align:center;padding:12px;display:flex;flex-direction:column;gap:6px;font-weight:900;border-top-width:12px}
.pod .nm{font-size:1.5em}
.pod .sc{font-variant-numeric:tabular-nums}
.pod.p1{min-height:34vh;background:var(--sun-soft)}
.pod.p2{min-height:26vh}
.pod.p3{min-height:20vh}
.pod .medal{font-size:2.4em;line-height:1}
.rest{width:min(100%,40em)}
.lb{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.lb li{display:grid;grid-template-columns:2.2em 1fr auto;gap:10px;align-items:center;background:#fff;border:2.5px solid var(--ink);border-radius:12px;padding:6px 12px;font-weight:900;font-variant-numeric:tabular-nums}

@media (max-width:900px){
  #lobby,.revgrid,.two{grid-template-columns:1fr}
  .opts .cellgrid{grid-template-columns:5.5em repeat(2,minmax(0,1fr))}
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>鳳姨的年終盤點搶答</h1>
    <div class="row" id="hstats" hidden>
      <span class="pill" id="hRoom">房號 ----</span>
      <span class="pill" id="hPlayers">0 人</span>
    </div>
  </header>

  <!-- 設定 -->
  <section id="setup" class="card">
    <h2 style="margin:0;font-size:1.5em">開一場分組搶答</h2>
    <p class="err" id="apiErr" hidden>還沒設定 Firebase：請把 Firebase 設定貼到 fbconfig.js。</p>
    <div class="row" id="loginRow">
      <button class="btn go" type="button" id="btnLogin">用 Google 登入老師帳號</button>
      <span class="muted" id="whoami" style="font-weight:800"></span>
    </div>
    <label class="field">老師密碼（選填：要把作答紀錄自動寫進 Google 試算表才需要）
      <input id="hostKey" type="password" autocomplete="current-password">
    </label>
    <div class="field">要考哪些回合？
      <div class="rounds" id="roundPick"></div>
    </div>
    <div class="two">
      <label class="field">分成幾組？
        <select id="teamN"><option>2</option><option>3</option><option>4</option><option>5</option><option selected>6</option><option>7</option><option>8</option></select>
      </label>
      <label class="field">每題時間
        <select id="timeSel">
          <option value="auto" selected>依題型（20～30 秒）</option>
          <option value="20">每題 20 秒</option>
          <option value="25">每題 25 秒</option>
          <option value="30">每題 30 秒</option>
        </select>
      </label>
    </div>
    <p class="muted" style="margin:0">大結算的加總題和挑戰題，時間自動加倍。</p>
    <div class="row">
      <button class="btn go" type="button" id="btnCreate" disabled>開新的一場</button>
      <button class="btn" type="button" id="btnResume" hidden>接續上一場</button>
    </div>
    <p class="err" id="setupErr"></p>
  </section>

  <!-- 等待加入 -->
  <section id="lobby" hidden>
    <div class="card joinbox">
      <span class="tag">手機掃描或輸入網址加入</span>
      <div class="qr" id="qr" hidden></div>
      <div class="url" id="joinUrl"></div>
      <div class="muted" style="font-weight:800">房號</div>
      <div class="code" id="roomCode">----</div>
    </div>
    <div class="card" style="display:flex;flex-direction:column;gap:14px">
      <div class="row" style="justify-content:space-between">
        <h2 style="margin:0;font-size:1.4em">已加入：<span id="lobbyCount">0</span> 人</h2>
        <button class="btn go" type="button" id="btnGroup" disabled>隨機分組 →</button>
      </div>
      <p class="muted" style="margin:0">學生輸入學號加入，這裡只顯示學號末三碼。打錯的點兩下可以移除。</p>
      <div class="row"><button class="btn ghost" type="button" id="btnBots">＋ 加入 5 個機器人同學（自己測試用）</button><span class="muted" style="font-size:.85em">機器人公布答案時才作答、約 6 成答對，不會寫進試算表</span></div>
      <div class="players" id="players"></div>
    </div>
  </section>

  <!-- 分組 -->
  <section id="grouping" hidden>
    <div class="row" style="justify-content:space-between">
      <h2 id="groupTitle">分組中…</h2>
      <div class="row">
        <button class="btn" type="button" id="btnRegroup">重新分組</button>
        <button class="btn go" type="button" id="btnBegin" disabled>開始搶答 →</button>
      </div>
    </div>
    <div class="teams" id="teams"></div>
  </section>

  <!-- 題目 -->
  <section id="question" hidden>
    <div class="qhead">
      <span class="tag" id="qRound"></span>
      <span class="pill" id="qNo"></span>
      <div style="flex:1"></div>
      <span class="big-timer" id="qTimer">20</span>
    </div>
    <div class="timer" id="qBar"><i style="width:100%"></i></div>
    <div class="card"><p class="qtext" id="qText"></p></div>
    <div class="opts" id="qOpts"></div>
    <div class="qfoot">
      <span class="count">已作答 <span id="qCount">0</span> / <span id="qTotal">0</span></span>
      <button class="btn" type="button" id="btnReveal">提早公布答案</button>
    </div>
  </section>

  <!-- 公布 -->
  <section id="reveal" hidden>
    <div class="qhead">
      <span class="tag" id="rRound"></span>
      <span class="pill" id="rNo"></span>
      <div style="flex:1"></div>
      <span class="pill" id="rRate"></span>
    </div>
    <div class="card"><p class="qtext" id="rText"></p></div>
    <div class="revgrid">
      <div class="explain">
        <div class="opts" id="rOpts"></div>
        <div class="plain"><span class="lab">白話</span><span id="rPlain"></span></div>
        <div class="formula" id="rFormula"></div>
      </div>
      <div style="display:flex;flex-direction:column;gap:12px">
        <div class="card race">
          <h3>各組戰況　<span class="muted" style="font-size:.8em">這題得分＝答對率 × 100，全組答對再 +20</span></h3>
          <div id="race"></div>
        </div>
        <button class="btn go" type="button" id="btnNext">下一題 →</button>
      </div>
    </div>
  </section>

  <!-- 結束 -->
  <section id="end" hidden>
    <h2>盤點完成！各組最終排名</h2>
    <div class="podium" id="podium"></div>
    <div class="card rest" id="restWrap"><ol class="lb" id="endList"></ol></div>
    <p class="muted" id="practiceHint" style="margin:0;font-weight:800"></p>
    <p class="muted" id="logHint" style="margin:0;font-weight:800"></p>
    <button class="btn" type="button" id="btnCsv">下載作答紀錄（Excel 可開）</button>
    <button class="btn" type="button" id="btnHome">回設定頁</button>
  </section>
</div>

<div id="splash" hidden>
  <div class="char bob" id="splashChar"></div>
  <h2 id="splashText"></h2>
</div>

<script src="qrcode.js"></script>
<script src="firebase-app-compat.js"></script>
<script src="firebase-auth-compat.js"></script>
<script src="firebase-database-compat.js"></script>
<script src="fbconfig.js"></script>
<script src="fb.js"></script>
<script src="config.js"></script>
<script src="common.js"></script>
<script src="questions.js"></script>
<script>
/* 老師端（Firebase 版）：老師的電腦負責出題、計分、分組，結果寫進 Firebase，手機即時收到 */
(function(){
  var B = window.Battle, $ = function(id){ return document.getElementById(id); };
  var SECTIONS = ['setup','lobby','grouping','question','reveal','end'];
  var LS = { get: function(k){ try { return localStorage.getItem(k); } catch(e){ return null; } },
             set: function(k, v){ try { localStorage.setItem(k, v); } catch(e){} } };

  var key = LS.get('battle_host_key') || '';
  var room = null, deck = [], durs = [];
  var st = null;                 // 房間狀態（跟 Firebase 的 state 同步）
  var players = {};              // uid → { sid, team, ok, bot, joinedAt, last }
  var answers = {};              // 這一題的作答 uid → { v, t }
  var ansRef = null, plRef = null;
  var revealing = false, timeUp = false, tickTimer = null, prevScores = null, teacherOK = false;
  var logAll = [];               // 本場作答紀錄（下載用）

  $('splashChar').innerHTML = B.CHAR;
  $('hostKey').value = key;
  $('teamN').value = LS.get('battle_teamN') || '6';
  $('timeSel').value = LS.get('battle_time') || 'auto';

  function R(p){ return FB.ref('rooms/' + room + (p ? '/' + p : '')); }
  function show(id){
    SECTIONS.forEach(function(s){ $(s).hidden = s !== id; });
    $('hstats').hidden = id === 'setup';
    window.scrollTo(0, 0);
  }
  function roundOf(qi){ var r = QUESTIONS[qi].round; return ROUNDS.filter(function(x){ return x.id === r; })[0]; }
  function teams(){ return (st && st.teams) || []; }
  function plist(){
    return Object.keys(players).map(function(pid){ var p = players[pid]; return { pid: pid, tag: p.bot ? p.sid : '…' + String(p.sid).slice(-3), team: (p.team === undefined ? null : p.team), bot: !!p.bot, sid: p.sid, ok: p.ok || 0 }; });
  }
  function humanCount(){ return plist().filter(function(p){ return !p.bot; }).length; }
  function sizes(n){ var a = []; for (var i = 0; i < n; i++) a.push(0); plist().forEach(function(p){ if (p.team !== null && p.team < n) a[p.team]++; }); return a; }
  function alertBar(msg){
    var d = document.createElement('div'); d.textContent = msg;
    d.style.cssText = 'position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#22262B;color:#fff;font-weight:800;padding:10px 18px;border-radius:12px;z-index:9';
    document.body.appendChild(d); setTimeout(function(){ d.remove(); }, 5000);
  }
  function netBar(msg){
    var d = document.getElementById('netBar');
    if (!d){ d = document.createElement('div'); d.id = 'netBar'; d.style.cssText = 'position:fixed;left:50%;top:10px;transform:translateX(-50%);background:#22262B;color:#fff;font-weight:800;padding:8px 18px;border-radius:999px;z-index:9'; document.body.appendChild(d); }
    d.textContent = msg; d.hidden = !msg;
  }

  /* ---------- 設定與登入 ---------- */
  var savedRounds = (LS.get('battle_rounds') || '1,2,3').split(',');
  ROUNDS.forEach(function(r){
    var n = QUESTIONS.filter(function(q){ return q.round === r.id; }).length;
    var lab = document.createElement('label');
    lab.innerHTML = '<input type="checkbox" value="' + r.id + '"' + (savedRounds.indexOf(String(r.id)) >= 0 ? ' checked' : '') + '><span>' + B.esc(r.name) + '　<span class="muted">' + n + ' 題</span></span>';
    $('roundPick').appendChild(lab);
  });

  if (!FB.ready()){ $('apiErr').hidden = false; $('btnLogin').disabled = true; }
  else {
    FB.onConnection(function(ok){ netBar(ok ? '' : '網路斷線，重新連線中…'); });
    FB.waitUser().then(setUser);
  }
  function setUser(u){
    teacherOK = FB.isTeacher(u);
    $('whoami').textContent = u && u.email ? (teacherOK ? '已登入：' + u.email : u.email + ' 不是老師帳號') : '';
    $('btnLogin').textContent = teacherOK ? '換帳號' : '用 Google 登入老師帳號';
    $('btnCreate').disabled = !teacherOK;
    if (teacherOK) checkResume();
  }
  $('btnLogin').addEventListener('click', function(){
    FB.teacher().then(setUser).catch(function(e){ $('setupErr').textContent = '登入沒有完成：' + (e.code || e.message); });
  });

  function checkResume(){
    var d = JSON.parse(LS.get('battle_deck') || '{}');
    if (!d.room) return;
    FB.ref('rooms/' + d.room + '/state').once('value').then(function(s){
      var v = s.val();
      if (v && v.phase !== 'end'){ $('btnResume').hidden = false; $('btnResume').textContent = '接續上一場（房號 ' + d.room + '）'; }
    }).catch(function(){});
  }

  $('btnCreate').addEventListener('click', function(){
    var rounds = Array.prototype.slice.call(document.querySelectorAll('#roundPick input:checked')).map(function(x){ return Number(x.value); });
    if (!rounds.length){ $('setupErr').textContent = '至少選一個回合。'; return; }
    key = $('hostKey').value.trim();
    var tsel = $('timeSel').value;

      if (src && src !== keep){ upd['players/' + keep + '/team'] = players[src].team; upd['players/' + keep + '/ok'] = players[src].ok || 0; }
      ids.slice(1).forEach(function(id){ upd['players/' + id] = null; n++; });

  $('btnReveal').addEventListener('click', doReveal);
  function sendLog(action, rows){
    if (!key || !rows.length || !B.apiReady()) return;
    B.api(action, { key: key, rows: rows }, 20000).then(function(r){
      $('logHint').textContent = r && r.ok ? '作答紀錄已寫進 Google 試算表。' : '試算表沒寫成功（' + (r && r.err) + '），可以用下面的按鈕下載。';
    }).catch(function(){ $('logHint').textContent = '試算表沒寫成功，可以用下面的按鈕下載作答紀錄。'; });
  }

  function renderReveal(sum){
    var qi = deck[st.q], q = QUESTIONS[qi];
    show('reveal'); renderHeader();
    $('rRound').textContent = roundOf(qi).name;
    $('rNo').textContent = '第 ' + (st.q + 1) + ' / ' + deck.length + ' 題';
    var rate = sum.players ? Math.round(sum.right / sum.players * 100) : 0;
    $('rRate').textContent = (q.type === 'item' ? '兩個都選對 ' : '全班答對 ') + sum.right + ' / ' + sum.players + ' 人（' + rate + '%）';
    $('rText').textContent = q.text; $('rText').classList.toggle('long', q.text.length > 60);
    $('rOpts').innerHTML = optsHtml(q, q.options, 'r', sum);
    $('rPlain').textContent = q.plain;
    $('rFormula').textContent = q.formula;
    renderRace(sum.gains || []);
    var last = st.q >= deck.length - 1;
    var nextRound = !last && QUESTIONS[deck[st.q + 1]].round !== q.round;
    $('btnNext').textContent = last ? '看最終排名 →' : (nextRound ? '進入下一回合 →' : '下一題 →');
    $('btnNext').focus({ preventScroll: true });
  }
  function renderRace(gains){
    var sorted = gains.slice().sort(function(a, b){ return b.score - a.score || a.id - b.id; });
    var max = Math.max(1, sorted.length ? sorted[0].score : 1);
    var prevMax = prevScores ? Math.max.apply(null, gains.map(function(g){ return prevScores[g.id] || 0; }).concat([1])) : 1;
    var rank = 0, lastScore = null;
    $('race').innerHTML = sorted.map(function(g, i){
      if (g.score !== lastScore){ rank = i + 1; lastScore = g.score; }
      var before = prevScores ? (prevScores[g.id] || 0) : 0;
      var cls = g.full ? 'full' : (g.gain ? '' : 'zero');
      return '<div class="lane"><span class="rk">' + rank + '</span><span class="nm"><span style="color:' + B.teamColor(g.id) + '">●</span> ' + B.esc(g.name) + '<small>' + g.right + ' / ' + g.size + ' 人答對</small></span>' +
        '<span class="track"><i data-to="' + Math.round(g.score / max * 100) + '" style="width:' + Math.round(before / Math.max(max, prevMax) * 100) + '%;background:' + B.teamColor(g.id) + '"></i></span>' +
        '<span class="sc">' + g.score + '</span><span class="gain ' + cls + '">+' + g.gain + (g.full ? '★' : '') + '</span></div>';
    }).join('');
    requestAnimationFrame(function(){ requestAnimationFrame(function(){
      $('race').querySelectorAll('.track i').forEach(function(b){ b.style.width = b.dataset.to + '%'; });
    }); });
    prevScores = {}; gains.forEach(function(g){ prevScores[g.id] = g.score; });
  }
  $('btnNext').addEventListener('click', function(){
    if (st.q >= deck.length - 1) finish(); else startQuestion(st.q + 1);
  });

  /* ---------- 結束 ---------- */
  function finish(){
    if (ansRef) ansRef.off();
    var T = teams(), sz = sizes(T.length);
    var r = T.map(function(t, i){ return { id: i, name: t.name, score: t.score || 0, size: sz[i] }; }).sort(function(a, b){ return b.score - a.score || a.id - b.id; });
    st.phase = 'end';
    R('state').update({ phase: 'end', ranking: r });
    show('end');
    var medal = ['🥇', '🥈', '🥉'], order = [1, 0, 2];
    $('podium').innerHTML = order.map(function(i){
      var t = r[i]; if (!t) return '<div></div>';
      return '<div class="pod p' + (i + 1) + ' pop" style="border-top-color:' + B.teamColor(t.id) + '"><span class="medal">' + medal[i] + '</span><span class="nm">' + B.esc(t.name) + '</span><span class="sc">' + t.score + ' 分</span><span class="muted">第 ' + (t.id + 1) + ' 組・' + (t.size || 0) + ' 人</span></div>';
    }).join('');
    $('endList').innerHTML = r.slice(3).map(function(t, i){ return '<li><span>' + (i + 4) + '</span><span><span style="color:' + B.teamColor(t.id) + '">●</span> ' + B.esc(t.name) + '</span><span>' + t.score + ' 分</span></li>'; }).join('');
    $('restWrap').hidden = r.length <= 3;
    $('practiceHint').textContent = '回家想再練：' + joinUrl().split('index.html')[0] + 'practice.html';
    // 總排名寫進試算表：每位同學一列
    var place = {}, rank = 0, lastS = null;
    r.forEach(function(t, i){ if (t.score !== lastS){ rank = i + 1; lastS = t.score; } place[t.id] = rank; });
    var rows = [];
    r.forEach(function(t){
      plist().filter(function(p){ return !p.bot && p.team === t.id; }).sort(function(a, b){ return a.sid < b.sid ? -1 : 1; })
        .forEach(function(p){ rows.push([room, place[t.id], t.name, t.score, p.sid, p.ok, deck.length]); });
    });
    rankRows = rows;
    sendLog('hostLogRank', rows);
  }
  var rankRows = [];
  $('btnCsv').addEventListener('click', function(){
    var esc = function(x){ x = String(x == null ? '' : x); return /[",\n]/.test(x) ? '"' + x.replace(/"/g, '""') + '"' : x; };
    var lines = ['房號,題號,學號,組別,作答,對錯,秒數'].concat(logAll.map(function(r){ return r.map(esc).join(','); }));
    lines.push('', '房號,組別名次,組別,組別總分,學號,個人答對題數,總題數');
    rankRows.forEach(function(r){ lines.push(r.map(esc).join(',')); });
    var blob = new Blob(['﻿' + lines.join('\r\n')], { type: 'text/csv;charset=utf-8' });
    var a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = '鳳姨搶答_' + room + '.csv';
    document.body.appendChild(a); a.click(); setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 1000);
  });
  $('btnHome').addEventListener('click', function(){ show('setup'); checkResume(); });

  document.addEventListener('keydown', function(e){
    if (e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'BUTTON' || e.target.tagName === 'SELECT')) return;
    if (e.key === 'Enter' || e.key === ' '){
      if (!$('reveal').hidden){ e.preventDefault(); $('btnNext').click(); }
      else if (!$('grouping').hidden && !$('btnBegin').disabled){ e.preventDefault(); $('btnBegin').click(); }
      else if (!$('question').hidden){ e.preventDefault(); doReveal(); }
    }
  });
})();
</script>
</body>
</html>
